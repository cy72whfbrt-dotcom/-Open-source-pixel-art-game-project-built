<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Basis-Raster-Prototyp</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    margin:0; padding:0; background:#0d1620; color:#eee;
    font-family: system-ui, sans-serif; user-select:none;
    height:100%; overflow:hidden;
  }
  [hidden] { display:none !important; }
  #app {
    width:100%; max-width:480px; height:100vh; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
  }

  #stage { position:relative; width:100%; flex:1; min-height:0; }
  canvas { background:#123145; display:block; touch-action:none; width:100%; height:100%; }

  #ctrlBar { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
  #ctrlBar button {
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,0.18);
    background:rgba(10,16,22,0.55); color:#eee; font-size:15px; cursor:pointer; line-height:1;
  }

  .buildmenu {
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:20;
  }
  .buildmenu .box { background:#1c2b3a; border:1px solid #3a5570; border-radius:8px; padding:16px; width:300px; max-width:88vw; }
  .buildmenu h3 { margin:0 0 4px; font-size:15px; }
  .buildmenu .hint2 { color:#8b96a5; font-size:11.5px; margin-bottom:10px; }
  .buildopt {
    display:flex; justify-content:space-between; align-items:center; padding:9px; border:1px solid #2e4358;
    border-radius:5px; margin-bottom:7px; cursor:pointer; font-size:12.5px; gap:8px;
  }
  .buildopt.disabled { opacity:.4; }
  .buildopt small { display:block; color:#8b96a5; margin-top:2px; }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="c" width="400" height="620"></canvas>
    <div id="ctrlBar">
      <button id="zoomIn">+</button>
      <button id="centerBtn">◎</button>
      <button id="zoomOut">−</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const CELL = 62;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 400, H = 620;

function resizeCanvas(){
  const rect = canvas.parentElement.getBoundingClientRect();
  W = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  canvas.width = W;
  canvas.height = H;
  if(typeof render === "function") render();
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

const WATER_RADIUS = 320;
const UNLOCK_BATCH = 4;      // pro Basis-Level werden 4 neue Felder frei
const GRID_GROW_AT_LEVEL = 7; // ab diesem Level waechst das Raster von 5x5 auf 7x7

// ================= Raster-Geometrie (Groesse haengt vom Basis-Level ab) =================

function gridSizeForLevel(level){ return level>=GRID_GROW_AT_LEVEL ? 7 : 5; }
function centerOf(gridSize){ return Math.floor(gridSize/2); }

// Alle Felder ausser der Mitte, sortiert nach Abstand zur Mitte (naeher zuerst) -
// so wachsen neue Freischaltungen immer ringfoermig von innen nach aussen.
function cellList(gridSize){
  const c0 = centerOf(gridSize);
  const all = [];
  for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
    if(c===c0 && r===c0) continue;
    all.push([c,r]);
  }
  all.sort((a,b)=>{
    const da = Math.max(Math.abs(a[0]-c0),Math.abs(a[1]-c0));
    const db = Math.max(Math.abs(b[0]-c0),Math.abs(b[1]-c0));
    return da-db;
  });
  return all;
}
function cellCenter(c,r,gridSize){ const c0=centerOf(gridSize); return { x:(c-c0)*CELL, y:(r-c0)*CELL }; }

// ================= Zustand =================

const SAVE_KEY = "basis_raster_proto_v7";
const TUTORIAL_START_UNLOCK = 8; // das ganze 3x3-Feld um die Base ist von Anfang an frei
const MIN_WAVE_GAP = 30; // Sekunden Mindestabstand zwischen zwei Wellen
// Die 8 Nachbarfelder: 4 gerade (Turm-Plaetze im Tutorial), 4 diagonal (Mauer-Plaetze)
const TUTORIAL_TOWER_IDX = [1,3,4,6];
const TUTORIAL_WALL_IDX  = [0,2,5,7];

const WATER_NODE_DEFS = [
  { id:"holz1", type:"holz", angle:35,  capacity:20, regenMs:1600 },
  { id:"holz2", type:"holz", angle:200, capacity:20, regenMs:1600 },
  { id:"stein1", type:"stein", angle:120, capacity:16, regenMs:2200 },
  { id:"stein2", type:"stein", angle:305, capacity:16, regenMs:2200 }
];
const NODE_WATER_MARGIN = 65; // Abstand der Ressourcen-Punkte zum Rastrand, immer im Wasser
function gridHalfExtent(gridSize){ return centerOf(gridSize)*CELL + CELL/2; }

function defaultState(){
  return {
    resources: { holz: 60, stein: 30 },
    basisLevel: 1,
    baseHp: 100,
    waveTimer: 15,
    cellsByCoord: {},
    nodes: WATER_NODE_DEFS.map(n=>({ id:n.id, amount:n.capacity, angle:n.angle })),
    tutorialDone: false,
    tutorialIntroShown: false,
    tutorialCollected: false
  };
}
let state = load();
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.resources && typeof d.resources.holz==="number" && d.cellsByCoord) return d;
    }
  } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){} }

function canAfford(cost){ return state.resources.holz>=cost.holz && state.resources.stein>=cost.stein; }
function payCost(cost){ state.resources.holz-=cost.holz; state.resources.stein-=cost.stein; }
function scaleCost(cost, factor){ return { holz: Math.round(cost.holz*factor), stein: Math.round(cost.stein*factor) }; }
function formatCost(cost){
  const parts=[];
  if(cost.holz) parts.push(cost.holz+" Holz");
  if(cost.stein) parts.push(cost.stein+" Stein");
  return parts.join(" · ") || "kostenlos";
}

const BUILDABLE_TYPES = {
  turm:  { name:"Turm",  desc:"Verteidigungsturm, greift Angreifer an.", cost:{holz:20,stein:30}, baseHp:100, hpPerLevel:25 },
  mauer: { name:"Mauer", desc:"Blockiert den Weg, hat aber selbst keinen Angriff.", cost:{holz:16,stein:8}, baseHp:150, hpPerLevel:35 }
};
function upgradeCost(type, level){ return scaleCost(BUILDABLE_TYPES[type].cost, Math.pow(1.5, level)); }
function maxHpFor(type, level){ const d=BUILDABLE_TYPES[type]; return d.baseHp+(level-1)*d.hpPerLevel; }
function sellRefund(type, level){ return scaleCost(BUILDABLE_TYPES[type].cost, 0.5*level); }
function repairCost(type, b){
  const max = maxHpFor(type,b.level);
  const missing = Math.max(0, max-b.hp);
  return scaleCost(BUILDABLE_TYPES[type].cost, (missing/max)*0.7);
}

const WEAPONS = {
  bogen:  { name:"Bogen",  desc:"Standardwaffe, immer verfügbar.", unlockLevel:1 },
  kanone: { name:"Kanone", desc:"Mehr Schaden, dafür langsamer.",  unlockLevel:3 }
};

function basisUpgradeCost(level){ return { holz: Math.round(45*Math.pow(1.55,level-1)), stein: Math.round(45*Math.pow(1.55,level-1)) }; }

// ================= Basis-Level: schaltet Felder frei, laesst das Raster wachsen =================

function unlockCountForLevel(level){ return TUTORIAL_START_UNLOCK + (level-1)*UNLOCK_BATCH; }

function applyUnlocksForCurrentLevel(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const unlockCount = Math.min(unlockCountForLevel(state.basisLevel), list.length);
  list.forEach(([c,r],i)=>{
    const key=c+","+r;
    if(!state.cellsByCoord[key]) state.cellsByCoord[key]={unlocked:false,building:null};
    if(i<unlockCount) state.cellsByCoord[key].unlocked = true;
  });
}
applyUnlocksForCurrentLevel();

function upgradeBasis(){
  const cost = basisUpgradeCost(state.basisLevel);
  if(!canAfford(cost)) return false;
  payCost(cost);
  const oldSize = gridSizeForLevel(state.basisLevel);
  state.basisLevel++;
  const newSize = gridSizeForLevel(state.basisLevel);
  if(newSize>oldSize){
    const shift = centerOf(newSize)-centerOf(oldSize);
    const remapped = {};
    Object.entries(state.cellsByCoord).forEach(([key,val])=>{
      const [c,r] = key.split(",").map(Number);
      remapped[(c+shift)+","+(r+shift)] = val;
    });
    state.cellsByCoord = remapped;
  }
  applyUnlocksForCurrentLevel();
  save();
  return true;
}

function nextLevelDescription(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const currentUnlocked = Math.min(unlockCountForLevel(state.basisLevel), list.length);
  const newSize = gridSizeForLevel(state.basisLevel+1);
  if(newSize>gridSize) return "Vergrößert das Raster auf "+newSize+"x"+newSize+"!";
  const nextUnlocked = Math.min(unlockCountForLevel(state.basisLevel+1), list.length);
  return "+"+(nextUnlocked-currentUnlocked)+" neue Bauplätze";
}

// ================= Tutorial: erste Verteidigung vor der ersten Welle =================

function tutorialTargets(){
  const list = cellList(gridSizeForLevel(state.basisLevel));
  return {
    towers: TUTORIAL_TOWER_IDX.map(i=>list[i]),
    walls: TUTORIAL_WALL_IDX.map(i=>list[i])
  };
}

function checkTutorial(){
  if(state.tutorialDone) return;
  const t = tutorialTargets();
  const towersOk = t.towers.every(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r];
    return slot && slot.building && slot.building.type==="turm";
  });
  const wallsOk = t.walls.every(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r];
    return slot && slot.building && slot.building.type==="mauer";
  });
  if(towersOk && wallsOk && state.tutorialCollected){
    state.tutorialDone = true;
    state.waveTimer = 15;
    save();
  }
}

function tutorialProgressText(){
  const t = tutorialTargets();
  const towersDone = t.towers.filter(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r]; return slot && slot.building && slot.building.type==="turm";
  }).length;
  const wallsDone = t.walls.filter(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r]; return slot && slot.building && slot.building.type==="mauer";
  }).length;
  const done = towersDone+wallsDone+(state.tutorialCollected?1:0);
  return done+"/9";
}

// Naechstes Tutorial-Ziel: welches Feld/Element muss der Spieler als Naechstes antippen?
function nodeForResource(resType){
  return state.nodes
    .filter(n=>WATER_NODE_DEFS.find(d=>d.id===n.id).type===resType)
    .sort((a,b)=>b.amount-a.amount)[0];
}

// Wenn das naechste Pflichtgebaeude gerade nicht bezahlbar ist, zeigt die
// Markierung stattdessen auf den Rohstoff, der noch fehlt - bis es reicht.
function targetForBuilding(type, c, r, label){
  const cost = BUILDABLE_TYPES[type].cost;
  if(canAfford(cost)) return {kind:"cell", c, r, label};
  const missingHolz = Math.max(0, cost.holz-state.resources.holz);
  const missingStein = Math.max(0, cost.stein-state.resources.stein);
  const resType = missingStein>missingHolz ? "stein" : "holz";
  return {kind:"node", node:nodeForResource(resType), label:(resType==="holz"?"Holz":"Stein")+" sammeln"};
}

function nextTutorialTarget(){
  if(state.tutorialDone) return null;
  const t = tutorialTargets();
  for(const [c,r] of t.towers){
    const slot = state.cellsByCoord[c+","+r];
    if(!(slot && slot.building && slot.building.type==="turm")) return targetForBuilding("turm", c, r, "Turm bauen");
  }
  for(const [c,r] of t.walls){
    const slot = state.cellsByCoord[c+","+r];
    if(!(slot && slot.building && slot.building.type==="mauer")) return targetForBuilding("mauer", c, r, "Mauer bauen");
  }
  if(!state.tutorialCollected) return {kind:"node", label:"Rohstoffe sammeln"};
  return null;
}

// ================= Ressourcen-Knoten im Wasser =================

setInterval(()=>{
  let changed=false;
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    if(n.amount<def.capacity){ n.amount++; changed=true; }
  });
  if(changed){ save(); render(); }
}, 900);

function nodeWorldPos(node){
  const radius = gridHalfExtent(gridSizeForLevel(state.basisLevel)) + NODE_WATER_MARGIN;
  const rad = node.angle*Math.PI/180;
  return { x: Math.cos(rad)*radius, y: Math.sin(rad)*radius };
}

// ================= Wellen: Gegner spawnen, Tuerme feuern =================

const WEAPON_STATS = {
  bogen:  { dmg: 6,  range: 130, rate: 0.9,  pierce:false },
  kanone: { dmg: 14, range: 150, rate: 1.6,  pierce:true  }
};
function towerDamage(b){ const w = WEAPON_STATS[b.weapon]||WEAPON_STATS.bogen; return w.dmg + (b.level-1)*2; }
function maxBaseHp(){ return 100 + (state.basisLevel-1)*20; }

// Zwei Gegnertypen mit echten Gegenspielern statt nur unterschiedlicher Zahlen:
// Laeufer ist schnell/schwach -> stirbt an der schnellen Feuerrate vom Bogen.
// Brecher ist langsam/zaeh und traegt Ruestung, die Bogen-Treffer stark
// abschwaecht - nur die durchschlagende Kanone macht bei ihm vollen Schaden.
const ENEMY_TYPES = {
  laeufer: { name:"Läufer", hpMult:0.55, speedMult:1.7, dmgMult:0.6, r:8,  armor:0, color:"#c9843a" },
  brecher: { name:"Brecher", hpMult:2.6, speedMult:0.55, dmgMult:1.8, r:13, armor:5, color:"#5a3a6a" }
};

let enemies = [];
let projectiles = [];
let waveActive = false;

function pickWaveComposition(){
  const level = state.basisLevel;
  const count = Math.min(3+Math.floor(level/2), 10);
  const types = [];
  for(let i=0;i<count;i++){
    // ab Level 2 mischen sich Brecher rein, nie mehr als grob die Haelfte der Welle
    const brecherChance = level<2 ? 0 : Math.min(0.45, 0.15+level*0.05);
    types.push(Math.random()<brecherChance ? "brecher" : "laeufer");
  }
  return types;
}

function spawnWave(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const spawnRadius = gridHalfExtent(gridSize) + NODE_WATER_MARGIN + 40;
  const baseHp = 26+state.basisLevel*6;
  const baseDmg = 5+Math.floor(state.basisLevel/2);
  pickWaveComposition().forEach(typeKey=>{
    const type = ENEMY_TYPES[typeKey];
    const angle = Math.random()*Math.PI*2;
    const hp = Math.round(baseHp*type.hpMult);
    enemies.push({
      x: Math.cos(angle)*spawnRadius, y: Math.sin(angle)*spawnRadius,
      hp, maxHp: hp, typeKey, armor: type.armor, r: type.r,
      dmg: Math.round(baseDmg*type.dmgMult) || 1,
      speed: (24+Math.random()*8)*type.speedMult,
      attackCd: 0
    });
  });
  waveActive = true;
}

function waveLoot(){
  return { holz: 8+state.basisLevel*4, stein: 6+state.basisLevel*3 };
}

function findEnemyTarget(e){
  const gridSize = gridSizeForLevel(state.basisLevel);
  let best=null, bestDist=Infinity;
  Object.entries(state.cellsByCoord).forEach(([key,slot])=>{
    if(!slot.building || slot.building.hp<=0) return;
    const [c,r] = key.split(",").map(Number);
    const p = cellCenter(c,r,gridSize);
    const d = Math.hypot(e.x-p.x,e.y-p.y);
    if(d<bestDist){ bestDist=d; best={x:p.x,y:p.y,r:27,slot}; }
  });
  if(best) return best;
  return {x:0,y:0,r:29,isBase:true};
}

function updateWave(dt){
  if(!state.tutorialDone) return;

  if(enemies.length===0){
    state.waveTimer -= dt;
    if(state.waveTimer<=0){
      spawnWave();
      state.waveTimer = MIN_WAVE_GAP + Math.random()*15;
      save();
    }
  }

  const gridSize = gridSizeForLevel(state.basisLevel);

  enemies.forEach(e=>{
    const target = findEnemyTarget(e);
    const dist = Math.hypot(target.x-e.x, target.y-e.y);
    const stopDist = target.r+e.r+2;
    if(dist>stopDist){
      const ang = Math.atan2(target.y-e.y, target.x-e.x);
      e.x += Math.cos(ang)*e.speed*dt;
      e.y += Math.sin(ang)*e.speed*dt;
    } else {
      e.attackCd -= dt;
      if(e.attackCd<=0){
        e.attackCd = 1;
        if(target.isBase){
          state.baseHp = Math.max(0, state.baseHp-e.dmg);
        } else {
          target.slot.building.hp -= e.dmg;
          if(target.slot.building.hp<=0) target.slot.building = null;
        }
        save();
      }
    }
  });

  Object.entries(state.cellsByCoord).forEach(([key,slot])=>{
    if(!slot.building || slot.building.type!=="turm" || slot.building.hp<=0) return;
    const [c,r] = key.split(",").map(Number);
    const p = cellCenter(c,r,gridSize);
    const b = slot.building;
    const w = WEAPON_STATS[b.weapon]||WEAPON_STATS.bogen;
    b.fireCd = (b.fireCd||0) - dt;
    if(b.fireCd>0) return;
    let nearest=null, nd=Infinity;
    enemies.forEach(e=>{
      const d = Math.hypot(e.x-p.x,e.y-p.y);
      if(d<=w.range && d<nd){ nd=d; nearest=e; }
    });
    if(nearest){
      b.fireCd = w.rate;
      const ang = Math.atan2(nearest.y-p.y, nearest.x-p.x);
      projectiles.push({x:p.x,y:p.y,vx:Math.cos(ang)*260,vy:Math.sin(ang)*260,life:1.2,dmg:towerDamage(b),pierce:w.pierce});
    }
  });

  projectiles.forEach(pr=>{ pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt; });
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    let hit = pr.life<=0;
    enemies.forEach(e=>{
      if(!hit && Math.hypot(pr.x-e.x,pr.y-e.y)<e.r+4){
        const dmg = (e.armor && !pr.pierce) ? Math.max(1, pr.dmg-e.armor) : pr.dmg;
        e.hp -= dmg;
        hit = true;
      }
    });
    if(hit) projectiles.splice(i,1);
  }
  enemies = enemies.filter(e=>e.hp>0);

  if(waveActive && enemies.length===0){
    const loot = waveLoot();
    state.resources.holz += loot.holz;
    state.resources.stein += loot.stein;
    waveActive = false;
    save();
  }
}

// ================= Kamera (Zoom & Verschieben) =================

const camera = { x:0, y:0, scale:1 };
function clampCamera(){
  const d = Math.hypot(camera.x,camera.y);
  const max = WATER_RADIUS-40;
  if(d>max){ camera.x = camera.x/d*max; camera.y = camera.y/d*max; }
  camera.scale = Math.max(0.5, Math.min(2.4, camera.scale));
}
function screenToWorld(sx,sy){
  return { x:(sx-W/2)/camera.scale + camera.x, y:(sy-H/2)/camera.scale + camera.y };
}

const pointers = new Map();
let dragTotal = 0;
let pinchStartDist = 0, pinchStartScale = 1;

function canvasPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, canvasPos(e));
  dragTotal = 0;
  if(pointers.size===2){
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartScale = camera.scale;
  }
});
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = canvasPos(e);
  pointers.set(e.pointerId, cur);

  if(pointers.size===2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchStartDist>10){ camera.scale = pinchStartScale * (dist/pinchStartDist); clampCamera(); render(); }
  } else if(pointers.size===1){
    const dx = cur.x-prev.x, dy = cur.y-prev.y;
    dragTotal += Math.hypot(dx,dy);
    camera.x -= dx/camera.scale;
    camera.y -= dy/camera.scale;
    clampCamera();
    render();
  }
});
function pointerEnd(e){
  const wasSingle = pointers.size===1;
  const pos = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(wasSingle && dragTotal<8 && pos){
    const w = screenToWorld(pos.x,pos.y);
    handleTap(w.x,w.y);
  }
  if(pointers.size<2) pinchStartDist=0;
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  camera.scale *= (e.deltaY<0) ? 1.1 : 0.9;
  clampCamera(); render();
}, {passive:false});

document.getElementById("zoomIn").addEventListener("click", ()=>{ camera.scale*=1.2; clampCamera(); render(); });
document.getElementById("zoomOut").addEventListener("click", ()=>{ camera.scale*=0.83; clampCamera(); render(); });
document.getElementById("centerBtn").addEventListener("click", ()=>{ camera.x=0; camera.y=0; camera.scale=1; render(); });

// ================= Rendern =================

function drawRoundRect(x,y,w,h,r,fill){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fillStyle = fill; ctx.fill();
}
function hashRand(seed){ const x=Math.sin(seed*12.9898)*43758.5453; return x-Math.floor(x); }

function drawShadow(x,y,rx,ry){
  ctx.beginPath(); ctx.ellipse(x,y+ry*0.5,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fill();
}

function drawWater(){
  const grad = ctx.createRadialGradient(0,0,WATER_RADIUS*0.25, 0,0,WATER_RADIUS*1.15);
  grad.addColorStop(0, "#1d6b82");
  grad.addColorStop(0.55, "#134f68");
  grad.addColorStop(1, "#0a2c3d");
  ctx.fillStyle = grad;
  ctx.fillRect(-3000,-3000,6000,6000);

  ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.lineWidth = 3;
  for(let i=-25;i<25;i++){
    ctx.beginPath();
    ctx.moveTo(-1500, i*45);
    ctx.quadraticCurveTo(0, i*45+18, 1500, i*45);
    ctx.stroke();
  }
  for(let i=0;i<18;i++){
    const a = hashRand(i*7.3)*Math.PI*2, d = 60+hashRand(i*3.1)*WATER_RADIUS*0.9;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 1.6, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fill();
  }

  ctx.beginPath(); ctx.arc(0,0,WATER_RADIUS,0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 3/camera.scale;
  ctx.setLineDash([16/camera.scale,12/camera.scale]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "600 "+(13/camera.scale)+"px sans-serif"; ctx.textAlign="center";
  ctx.fillText("offene See →", 0, -WATER_RADIUS+24/camera.scale);
  ctx.textAlign="left";
}

function drawGrassTile(x,y,c,r){
  const checker = (c+r)%2===0;
  const grad = ctx.createLinearGradient(x,y-CELL/2,x,y+CELL/2);
  if(checker){ grad.addColorStop(0,"#5cae44"); grad.addColorStop(1,"#4c9a38"); }
  else { grad.addColorStop(0,"#54a33e"); grad.addColorStop(1,"#458f32"); }
  ctx.fillStyle = grad;
  ctx.fillRect(x-CELL/2, y-CELL/2, CELL, CELL);

  const seed = c*131+r*911;
  for(let k=0;k<3;k++){
    const bx = x+(hashRand(seed+k)-0.5)*CELL*0.75;
    const by = y+(hashRand(seed+k+40)-0.5)*CELL*0.75;
    ctx.strokeStyle = "rgba(30,70,20,0.35)"; ctx.lineWidth=1.6; ctx.lineCap="round";
    for(let b=0;b<3;b++){
      const ang = -Math.PI/2 + (hashRand(seed+k*3+b)-0.5)*0.9;
      ctx.beginPath(); ctx.moveTo(bx+b*2-2, by);
      ctx.lineTo(bx+b*2-2+Math.cos(ang)*6, by+Math.sin(ang)*6);
      ctx.stroke();
    }
    ctx.lineCap="butt";
  }
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(x-CELL/2, y-CELL/2, CELL, 2);
  ctx.strokeStyle = "rgba(0,0,0,0.10)"; ctx.lineWidth = 1;
  ctx.strokeRect(x-CELL/2, y-CELL/2, CELL, CELL);
}

function drawPlusButton(x,y){
  drawShadow(x,y+16,20,6);
  const grad = ctx.createLinearGradient(x,y-22,x,y+22);
  grad.addColorStop(0,"rgba(255,255,255,0.22)"); grad.addColorStop(1,"rgba(255,255,255,0.08)");
  drawRoundRect(x-22,y-22,44,44,12,grad);
  ctx.strokeStyle="rgba(255,255,255,0.4)"; ctx.lineWidth=1.5;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,12); ctx.stroke();
  ctx.strokeStyle="#eafff0"; ctx.lineWidth=3.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.stroke();
  ctx.lineCap="butt";
}

function drawLockedButton(x,y){
  drawShadow(x,y+16,20,6);
  const grad = ctx.createLinearGradient(x,y-22,x,y+22);
  grad.addColorStop(0,"rgba(20,30,25,0.30)"); grad.addColorStop(1,"rgba(20,30,25,0.15)");
  drawRoundRect(x-22,y-22,44,44,12,grad);
  ctx.strokeStyle="rgba(255,255,255,0.18)"; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(220,228,238,0.65)"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(x,y-3,5,Math.PI,0); ctx.stroke();
  drawRoundRect(x-7,y-3,14,10,2,"rgba(220,228,238,0.65)");
}

function drawLevelPips(x,y,level){
  const n = Math.min(level,5);
  const w = n*7-3;
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(x-w/2+i*7, y, 2.1, 0, Math.PI*2);
    ctx.fillStyle = "#f2c94c"; ctx.fill();
  }
}

function drawHpBar(x,y,hp,maxHp,w){
  if(hp>=maxHp) return;
  const ratio = Math.max(0,hp/maxHp);
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(x-w/2,y,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(x-w/2,y,w*ratio,4);
}

function drawEnemy(e){
  const type = ENEMY_TYPES[e.typeKey] || {color:"#8a2f2f"};
  drawShadow(e.x,e.y+e.r,e.r*1.3,4);
  ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fillStyle=type.color; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2; ctx.stroke();
  if(e.armor){
    // kleine Ruestungsplatten andeuten
    ctx.strokeStyle="rgba(220,220,230,0.7)"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,0.4,1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,Math.PI+0.4,Math.PI+1.6); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(e.x-e.r*0.3,e.y-e.r*0.3,e.r*0.2,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.fill();
  const w=e.r*2.2, ratio=Math.max(0,e.hp/e.maxHp), by=e.y-e.r-9;
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(e.x-w/2,by,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(e.x-w/2,by,w*ratio,4);
}

function drawProjectile(pr){
  ctx.beginPath(); ctx.arc(pr.x,pr.y,3,0,Math.PI*2);
  ctx.fillStyle="#f2c94c"; ctx.fill();
}

function drawTutorialHighlight(x,y,label){
  const t = performance.now()/1000;
  const pulse = 0.5+0.5*Math.sin(t*3.2);
  ctx.beginPath(); ctx.arc(x,y,31+pulse*5,0,Math.PI*2);
  ctx.strokeStyle = `rgba(255,225,90,${0.55+pulse*0.35})`; ctx.lineWidth=3.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,31+pulse*5+7,0,Math.PI*2);
  ctx.strokeStyle = `rgba(255,225,90,${0.18+pulse*0.15})`; ctx.lineWidth=2; ctx.stroke();
  // Pfeil von oben
  const ay = y-46-pulse*4;
  ctx.fillStyle="#ffe15a";
  ctx.beginPath(); ctx.moveTo(x,ay+14); ctx.lineTo(x-7,ay); ctx.lineTo(x+7,ay); ctx.closePath(); ctx.fill();
  ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.6)"; ctx.lineWidth=3; ctx.strokeText(label, x, ay-4);
  ctx.fillText(label, x, ay-4);
  ctx.textAlign="left";
}

function drawTowerSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-4,20,6);
  drawRoundRect(x-s,y-s,s*2,s*2,7,"#5a6472");
  ctx.strokeStyle="#333a42"; ctx.lineWidth=2;
  ctx.strokeRect(x-s+1,y-s+1,s*2-2,s*2-2);
  ctx.fillStyle="#454e59";
  const cz=6;
  [[-s+1,-s+1],[s-cz-1,-s+1],[-s+1,s-cz-1],[s-cz-1,s-cz-1]].forEach(([dx,dy])=>{ ctx.fillRect(x+dx,y+dy,cz,cz); });
  ctx.beginPath(); ctx.arc(x,y-3,13,0,Math.PI*2);
  ctx.fillStyle="#c94a4a"; ctx.fill();
  ctx.strokeStyle="#7a2424"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-4,y-7,3,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.25)"; ctx.fill();
  const weaponColor = b.weapon==="kanone" ? "#3a3a42" : "#8a6a3a";
  ctx.fillStyle = weaponColor; ctx.fillRect(x-3,y-19,6,11);
  ctx.fillStyle = b.weapon==="kanone" ? "#55555f" : "#a5825a"; ctx.fillRect(x-3,y-19,6,3);
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("turm",b.level), 34);
}

function drawWallSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-4,20,6);
  drawRoundRect(x-s,y-s,s*2,s*2,4,"#8a5a3a");
  ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=1.3;
  const rows=4, rowH=(s*2)/rows;
  for(let i=1;i<rows;i++){ const yy=y-s+i*rowH; ctx.beginPath(); ctx.moveTo(x-s+2,yy); ctx.lineTo(x+s-2,yy); ctx.stroke(); }
  for(let i=0;i<rows;i++){
    const yy0=y-s+i*rowH, yy1=yy0+rowH;
    const offset=(i%2===0)?0:(s*2)/4;
    for(let xx=x-s+offset; xx<x+s-1; xx+=(s*2)/2){ ctx.beginPath(); ctx.moveTo(xx,yy0+1.5); ctx.lineTo(xx,yy1-1.5); ctx.stroke(); }
  }
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(x-s,y-s,s*2,4);
  ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(x-s,y+s-4,s*2,4);
  ctx.strokeStyle="#4a2f1c"; ctx.lineWidth=2; ctx.strokeRect(x-s+1,y-s+1,s*2-2,s*2-2);
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("mauer",b.level), 34);
}

function drawBuildingSprite(x,y,building){
  if(building.type==="turm") drawTowerSprite(x,y,building);
  else if(building.type==="mauer") drawWallSprite(x,y,building);
}

function drawLogNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  drawShadow(x,y+16,16,5);
  ctx.globalAlpha = empty ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2);
  ctx.fillStyle="rgba(20,40,55,0.5)"; ctx.fill();
  ["#8a5a34","#a06d3f"].forEach((col,i)=>{
    ctx.fillStyle=col;
    drawRoundRect(x-15, y-4+i*7, 30, 6, 3, col);
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(x-13,y-1+i*7,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+13,y-1+i*7,2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // Fuellstand-Ring
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#c99a5a"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="10px sans-serif"; ctx.textAlign="center";
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawRockNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  drawShadow(x,y+16,16,5);
  ctx.globalAlpha = empty ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2);
  ctx.fillStyle="rgba(20,40,55,0.5)"; ctx.fill();
  [[-7,3,9,"#9aa3ac"],[6,4,8,"#7c8590"],[0,-5,7,"#b3bcc4"]].forEach(([dx,dy,rr,col])=>{
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1.2; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#b7c2cf"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="10px sans-serif"; ctx.textAlign="center";
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawChip(x,y,w,fill,drawIcon,text){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.35)"; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  drawRoundRect(x,y,w,30,15,fill);
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,0.15)"; ctx.lineWidth=1;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,30,15); ctx.stroke();
  ctx.save();
  ctx.translate(x+18,y+15);
  drawIcon();
  ctx.restore();
  ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+32, y+16);
  ctx.textBaseline="alphabetic";
}

function drawInGameHud(){
  ctx.fillStyle="rgba(8,14,20,0.0)";
  const barY = 12;
  drawChip(12, barY, 84, "rgba(10,16,22,0.55)", ()=>{
    ["#8a5a34","#a06d3f"].forEach((col,i)=>{
      ctx.fillStyle=col; drawRoundRect(-9,-3+i*5,18,4,2,col);
    });
  }, state.resources.holz);

  drawChip(104, barY, 84, "rgba(10,16,22,0.55)", ()=>{
    [[-4,2,6,"#9aa3ac"],[4,3,5,"#7c8590"],[0,-3,5,"#b3bcc4"]].forEach(([dx,dy,rr,col])=>{
      ctx.beginPath(); ctx.arc(dx,dy,rr,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    });
  }, state.resources.stein);

  drawChip(W-96, barY, 84, "rgba(165,83,58,0.55)", ()=>{
    ctx.fillStyle="#f2c94c";
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*(Math.PI*2/5);
      const ang2=ang+Math.PI/5;
      ctx.lineTo(Math.cos(ang)*7,Math.sin(ang)*7);
      ctx.lineTo(Math.cos(ang2)*3,Math.sin(ang2)*3);
    }
    ctx.closePath(); ctx.fill();
  }, "Lv "+state.basisLevel);

  const chipW = 108;
  if(!state.tutorialDone){
    drawChip(W/2-chipW/2, barY, chipW, "rgba(74,140,60,0.6)", ()=>{
      ctx.strokeStyle="#eee"; ctx.lineWidth=1.8; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-5,3); ctx.lineTo(-1,7); ctx.lineTo(6,-5); ctx.stroke();
      ctx.lineCap="butt";
    }, "Aufbau "+tutorialProgressText());
  } else {
    const waveLabel = enemies.length>0 ? enemies.length+" Gegner" : Math.max(0,Math.ceil(state.waveTimer))+"s";
    drawChip(W/2-chipW/2, barY, chipW, enemies.length>0 ? "rgba(138,47,47,0.6)" : "rgba(10,16,22,0.55)", ()=>{
      ctx.strokeStyle="#eee"; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-5); ctx.moveTo(0,0); ctx.lineTo(3,2); ctx.stroke();
    }, waveLabel);
  }
}

function render(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(camera.scale, camera.scale);
  ctx.translate(-camera.x, -camera.y);

  drawWater();

  list.forEach(([c,r])=>{ const p=cellCenter(c,r,gridSize); drawGrassTile(p.x,p.y,c,r); });
  { const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize); drawGrassTile(p.x,p.y,0,0); }

  list.forEach(([c,r])=>{
    const p = cellCenter(c,r,gridSize);
    const slot = state.cellsByCoord[c+","+r] || {unlocked:false,building:null};
    if(slot.building) drawBuildingSprite(p.x,p.y,slot.building);
    else if(!slot.unlocked) drawLockedButton(p.x,p.y);
    else drawPlusButton(p.x,p.y);
  });

  // Wasser-Ressourcenknoten
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    const p = nodeWorldPos(n);
    if(def.type==="holz") drawLogNode(p.x,p.y,n,def); else drawRockNode(p.x,p.y,n,def);
  });

  // Base in der Mitte
  {
    const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize);
    drawShadow(p.x,p.y+24,26,7);
    const grad = ctx.createLinearGradient(p.x,p.y-28,p.x,p.y+28);
    grad.addColorStop(0,"#c96a48"); grad.addColorStop(1,"#9c4930");
    drawRoundRect(p.x-28,p.y-28,56,56,10,grad);
    ctx.strokeStyle="rgba(255,255,255,0.25)"; ctx.lineWidth=1.5;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(p.x-28,p.y-28,56,56,10); ctx.stroke();
    // kleine Fahne
    ctx.strokeStyle="#3a1f14"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x,p.y-22); ctx.lineTo(p.x,p.y-8); ctx.stroke();
    ctx.fillStyle="#f2c94c";
    ctx.beginPath(); ctx.moveTo(p.x,p.y-22); ctx.lineTo(p.x+11,p.y-18); ctx.lineTo(p.x,p.y-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="600 10px sans-serif"; ctx.textAlign="center";
    ctx.fillText("Lv "+state.basisLevel, p.x, p.y+12);
    ctx.textAlign="left";
    drawHpBar(p.x, p.y+30, state.baseHp, maxBaseHp(), 40);
  }

  projectiles.forEach(drawProjectile);
  enemies.forEach(drawEnemy);

  const tut = nextTutorialTarget();
  if(tut){
    let tp;
    if(tut.kind==="cell") tp = cellCenter(tut.c,tut.r,gridSize);
    else {
      const n = tut.node || state.nodes.find(x=>x.amount>0) || state.nodes[0];
      tp = nodeWorldPos(n);
    }
    drawTutorialHighlight(tp.x, tp.y, tut.label);
  }

  ctx.restore();
  drawInGameHud();
}

// ================= Eingabe / Menues =================

function handleTap(wx,wy){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const c0 = centerOf(gridSize);

  // Wasser-Knoten treffen?
  for(const n of state.nodes){
    const p = nodeWorldPos(n);
    if(Math.hypot(wx-p.x,wy-p.y) < 26){ collectNode(n); return; }
  }

  const c = Math.round(wx/CELL + c0);
  const r = Math.round(wy/CELL + c0);
  if(c<0||c>=gridSize||r<0||r>=gridSize) return;
  if(c===c0 && r===c0){ openBasisMenu(); return; }
  openBuildMenu(c,r);
}

function collectNode(n){
  if(n.amount<=0) return;
  const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
  state.resources[def.type] += n.amount;
  n.amount = 0;
  // an eine neue Stelle im Wasser versetzen, mit Abstand zu den anderen Knoten
  let tries=0, angle;
  do { angle = Math.random()*360; tries++; }
  while(tries<10 && state.nodes.some(o=>o!==n && Math.abs(((o.angle-angle+540)%360)-180)<35));
  n.angle = angle;
  state.tutorialCollected = true;
  checkTutorial();
  save(); render();
}

function requiredTypeForCell(c,r){
  if(state.tutorialDone) return null;
  const t = tutorialTargets();
  if(t.towers.some(([tc,tr])=>tc===c&&tr===r)) return "turm";
  if(t.walls.some(([tc,tr])=>tc===c&&tr===r)) return "mauer";
  return null;
}

function openBasisMenu(){
  const overlay = document.createElement("div");
  overlay.className="buildmenu";
  const box = document.createElement("div");
  box.className="box";
  box.innerHTML = `<h3>Base</h3><div class="hint2">Level ${state.basisLevel}</div>`;

  if(!state.tutorialDone){
    box.innerHTML += `<div class="hint2">Baue zuerst deine Grundverteidigung fertig (${tutorialProgressText()}), bevor du die Base verbessern kannst.</div>`;
  } else {
    const cost = basisUpgradeCost(state.basisLevel);
    const opt = document.createElement("div");
    opt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
    opt.innerHTML = `<span>Verbessern auf Level ${state.basisLevel+1}<small>${nextLevelDescription()}</small></span><b>${formatCost(cost)}</b>`;
    opt.addEventListener("click", ()=>{
      if(upgradeBasis()){ document.body.removeChild(overlay); render(); }
    });
    box.appendChild(opt);
  }
  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function openBuildMenu(c,r){
  const key = c+","+r;
  const slot = state.cellsByCoord[key] || {unlocked:false, building:null};
  state.cellsByCoord[key] = slot;

  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";

  if(!slot.unlocked){
    box.innerHTML = `<h3>Noch gesperrt</h3><div class="hint2">Verbessere deine Base, um weitere Felder freizuschalten.</div>`;
  } else if(slot.building){
    const b = slot.building;
    const def = BUILDABLE_TYPES[b.type];
    const cost = upgradeCost(b.type, b.level);
    const maxHp = maxHpFor(b.type, b.level);
    box.innerHTML = `<h3>${def.name}</h3><div class="hint2">Level ${b.level} · HP ${Math.round(b.hp)}/${maxHp}</div>`;

    const upOpt = document.createElement("div");
    upOpt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
    upOpt.innerHTML = `<span>Verbessern auf Level ${b.level+1}<small>Repariert dabei auch komplett</small></span><b>${formatCost(cost)}</b>`;
    upOpt.addEventListener("click", ()=>{
      if(canAfford(cost)){ payCost(cost); b.level++; b.hp = maxHpFor(b.type,b.level); save(); document.body.removeChild(overlay); render(); }
    });
    box.appendChild(upOpt);

    if(b.hp<maxHp){
      const rCost = repairCost(b.type,b);
      const repOpt = document.createElement("div");
      repOpt.className = "buildopt" + (!canAfford(rCost) ? " disabled":"");
      repOpt.innerHTML = `<span>Reparieren<small>Stellt volle HP wieder her</small></span><b>${formatCost(rCost)}</b>`;
      repOpt.addEventListener("click", ()=>{
        if(canAfford(rCost)){ payCost(rCost); b.hp = maxHp; save(); document.body.removeChild(overlay); render(); }
      });
      box.appendChild(repOpt);
    }

    if(b.type==="turm"){
      const wHead = document.createElement("div");
      wHead.className="hint2"; wHead.style.marginTop="6px"; wHead.textContent="Waffe auswählen:";
      box.appendChild(wHead);
      Object.entries(WEAPONS).forEach(([key2,w])=>{
        const unlocked = b.level>=w.unlockLevel;
        const selected = b.weapon===key2;
        const wOpt = document.createElement("div");
        wOpt.className = "buildopt"+(!unlocked?" disabled":"");
        wOpt.style.border = selected ? "1px solid #7aa2f7" : "";
        wOpt.innerHTML = `<span>${w.name}${selected?" (aktiv)":""}<small>${unlocked?w.desc:"Verfügbar ab Level "+w.unlockLevel}</small></span>`;
        if(unlocked && !selected) wOpt.addEventListener("click", ()=>{ b.weapon=key2; save(); document.body.removeChild(overlay); render(); });
        box.appendChild(wOpt);
      });
    }

    const refund = sellRefund(b.type,b.level);
    const sellOpt = document.createElement("div");
    sellOpt.className = "buildopt"; sellOpt.style.marginTop="6px";
    sellOpt.innerHTML = `<span>Verkaufen</span><b>+${formatCost(refund)}</b>`;
    sellOpt.addEventListener("click", ()=>{
      state.resources.holz+=refund.holz; state.resources.stein+=refund.stein;
      slot.building = null;
      save(); document.body.removeChild(overlay); render();
    });
    box.appendChild(sellOpt);
  } else {
    const required = requiredTypeForCell(c,r);
    box.innerHTML = required
      ? `<h3>${BUILDABLE_TYPES[required].name} bauen</h3><div class="hint2">Für die Grundverteidigung brauchst du hier ${required==="turm"?"einen Turm":"eine Mauer"}.</div>`
      : `<h3>Feld bebauen</h3>`;
    Object.entries(BUILDABLE_TYPES).filter(([type])=> !required || type===required).forEach(([type,def])=>{
      const opt = document.createElement("div");
      opt.className = "buildopt" + (!canAfford(def.cost) ? " disabled":"");
      opt.innerHTML = `<span>${def.name}<small>${def.desc}</small></span><b>${formatCost(def.cost)}</b>`;
      opt.addEventListener("click", ()=>{
        if(canAfford(def.cost)){
          payCost(def.cost);
          const hp = maxHpFor(type,1);
          slot.building = type==="turm" ? {type,level:1,weapon:"bogen",hp} : {type,level:1,hp};
          checkTutorial();
          save(); document.body.removeChild(overlay); render();
        }
      });
      box.appendChild(opt);
    });
  }

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function addCloseBtn(box, overlay){
  const close = document.createElement("div");
  close.className="buildopt"; close.style.justifyContent="center"; close.textContent="Schließen";
  close.addEventListener("click", ()=> document.body.removeChild(overlay));
  box.appendChild(close);
}

function showIntroIfNeeded(){
  if(state.tutorialIntroShown) return;
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>Willkommen auf deiner Insel</h3>
    <div class="hint2">
      Folge der markierten Stelle mit dem Pfeil und tippe genau dort drauf -
      sie zeigt dir Schritt für Schritt, was als Nächstes zu tun ist.
      Erst wenn deine Grundverteidigung steht, kommt die erste Gegnerwelle.
    </div>`;
  const opt = document.createElement("div");
  opt.className = "buildopt"; opt.style.justifyContent="center";
  opt.textContent = "Los geht's";
  opt.addEventListener("click", ()=>{
    state.tutorialIntroShown = true;
    save();
    document.body.removeChild(overlay);
  });
  box.appendChild(opt);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
resizeCanvas();
showIntroIfNeeded();

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  updateWave(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
