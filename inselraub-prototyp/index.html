<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Basis-Raster-Prototyp</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    margin:0; padding:0; background:#0d1620; color:#eee;
    font-family: system-ui, sans-serif; display:flex; flex-direction:column; align-items:center;
    min-height:100vh; user-select:none;
  }
  [hidden] { display:none !important; }
  #app { width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; }

  #stage { position:relative; width:100%; line-height:0; }
  canvas { background:#123145; display:block; touch-action:none; width:100%; height:auto; }

  #ctrlBar { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
  #ctrlBar button {
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,0.18);
    background:rgba(10,16,22,0.55); color:#eee; font-size:15px; cursor:pointer; line-height:1;
  }

  .buildmenu {
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:20;
  }
  .buildmenu .box { background:#1c2b3a; border:1px solid #3a5570; border-radius:8px; padding:16px; width:300px; max-width:88vw; }
  .buildmenu h3 { margin:0 0 4px; font-size:15px; }
  .buildmenu .hint2 { color:#8b96a5; font-size:11.5px; margin-bottom:10px; }
  .buildopt {
    display:flex; justify-content:space-between; align-items:center; padding:9px; border:1px solid #2e4358;
    border-radius:5px; margin-bottom:7px; cursor:pointer; font-size:12.5px; gap:8px;
  }
  .buildopt.disabled { opacity:.4; }
  .buildopt small { display:block; color:#8b96a5; margin-top:2px; }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="c" width="400" height="620"></canvas>
    <div id="ctrlBar">
      <button id="zoomIn">+</button>
      <button id="centerBtn">◎</button>
      <button id="zoomOut">−</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const CELL = 62;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const WATER_RADIUS = 320;
const UNLOCK_BATCH = 4;      // pro Basis-Level werden 4 neue Felder frei
const GRID_GROW_AT_LEVEL = 7; // ab diesem Level waechst das Raster von 5x5 auf 7x7

// ================= Raster-Geometrie (Groesse haengt vom Basis-Level ab) =================

function gridSizeForLevel(level){ return level>=GRID_GROW_AT_LEVEL ? 7 : 5; }
function centerOf(gridSize){ return Math.floor(gridSize/2); }

// Alle Felder ausser der Mitte, sortiert nach Abstand zur Mitte (naeher zuerst) -
// so wachsen neue Freischaltungen immer ringfoermig von innen nach aussen.
function cellList(gridSize){
  const c0 = centerOf(gridSize);
  const all = [];
  for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
    if(c===c0 && r===c0) continue;
    all.push([c,r]);
  }
  all.sort((a,b)=>{
    const da = Math.max(Math.abs(a[0]-c0),Math.abs(a[1]-c0));
    const db = Math.max(Math.abs(b[0]-c0),Math.abs(b[1]-c0));
    return da-db;
  });
  return all;
}
function cellCenter(c,r,gridSize){ const c0=centerOf(gridSize); return { x:(c-c0)*CELL, y:(r-c0)*CELL }; }

// ================= Zustand =================

const SAVE_KEY = "basis_raster_proto_v5";

const WATER_NODE_DEFS = [
  { id:"holz1", type:"holz", angle:35,  capacity:20, regenMs:1600 },
  { id:"holz2", type:"holz", angle:200, capacity:20, regenMs:1600 },
  { id:"stein1", type:"stein", angle:120, capacity:16, regenMs:2200 },
  { id:"stein2", type:"stein", angle:305, capacity:16, regenMs:2200 }
];
const NODE_WATER_MARGIN = 65; // Abstand der Ressourcen-Punkte zum Rastrand, immer im Wasser
function gridHalfExtent(gridSize){ return centerOf(gridSize)*CELL + CELL/2; }

function defaultState(){
  return {
    resources: { holz: 60, stein: 30 },
    basisLevel: 1,
    cellsByCoord: {},
    nodes: WATER_NODE_DEFS.map(n=>({ id:n.id, amount:n.capacity }))
  };
}
let state = load();
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.resources && typeof d.resources.holz==="number" && d.cellsByCoord) return d;
    }
  } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){} }

function canAfford(cost){ return state.resources.holz>=cost.holz && state.resources.stein>=cost.stein; }
function payCost(cost){ state.resources.holz-=cost.holz; state.resources.stein-=cost.stein; }
function scaleCost(cost, factor){ return { holz: Math.round(cost.holz*factor), stein: Math.round(cost.stein*factor) }; }
function formatCost(cost){
  const parts=[];
  if(cost.holz) parts.push(cost.holz+" Holz");
  if(cost.stein) parts.push(cost.stein+" Stein");
  return parts.join(" · ") || "kostenlos";
}

const BUILDABLE_TYPES = {
  turm:  { name:"Turm",  desc:"Verteidigungsturm, greift Angreifer an.", cost:{holz:20,stein:30}, baseHp:100, hpPerLevel:25 },
  mauer: { name:"Mauer", desc:"Blockiert den Weg, hat aber selbst keinen Angriff.", cost:{holz:16,stein:8}, baseHp:150, hpPerLevel:35 }
};
function upgradeCost(type, level){ return scaleCost(BUILDABLE_TYPES[type].cost, Math.pow(1.5, level)); }
function hpFor(type, level){ const d=BUILDABLE_TYPES[type]; return d.baseHp+(level-1)*d.hpPerLevel; }

const WEAPONS = {
  bogen:  { name:"Bogen",  desc:"Standardwaffe, immer verfügbar.", unlockLevel:1 },
  kanone: { name:"Kanone", desc:"Mehr Schaden, dafür langsamer.",  unlockLevel:3 }
};

function basisUpgradeCost(level){ return { holz: Math.round(45*Math.pow(1.55,level-1)), stein: Math.round(45*Math.pow(1.55,level-1)) }; }

// ================= Basis-Level: schaltet Felder frei, laesst das Raster wachsen =================

function applyUnlocksForCurrentLevel(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const unlockCount = Math.min(state.basisLevel*UNLOCK_BATCH, list.length);
  list.forEach(([c,r],i)=>{
    const key=c+","+r;
    if(!state.cellsByCoord[key]) state.cellsByCoord[key]={unlocked:false,building:null};
    if(i<unlockCount) state.cellsByCoord[key].unlocked = true;
  });
}
applyUnlocksForCurrentLevel();

function upgradeBasis(){
  const cost = basisUpgradeCost(state.basisLevel);
  if(!canAfford(cost)) return false;
  payCost(cost);
  const oldSize = gridSizeForLevel(state.basisLevel);
  state.basisLevel++;
  const newSize = gridSizeForLevel(state.basisLevel);
  if(newSize>oldSize){
    const shift = centerOf(newSize)-centerOf(oldSize);
    const remapped = {};
    Object.entries(state.cellsByCoord).forEach(([key,val])=>{
      const [c,r] = key.split(",").map(Number);
      remapped[(c+shift)+","+(r+shift)] = val;
    });
    state.cellsByCoord = remapped;
  }
  applyUnlocksForCurrentLevel();
  save();
  return true;
}

function nextLevelDescription(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const currentUnlocked = Math.min(state.basisLevel*UNLOCK_BATCH, list.length);
  const newSize = gridSizeForLevel(state.basisLevel+1);
  if(newSize>gridSize) return "Vergrößert das Raster auf "+newSize+"x"+newSize+"!";
  const nextUnlocked = Math.min((state.basisLevel+1)*UNLOCK_BATCH, list.length);
  return "+"+(nextUnlocked-currentUnlocked)+" neue Bauplätze";
}

// ================= Ressourcen-Knoten im Wasser =================

setInterval(()=>{
  let changed=false;
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    if(n.amount<def.capacity){ n.amount++; changed=true; }
  });
  if(changed){ save(); render(); }
}, 900);

function nodeWorldPos(def){
  const radius = gridHalfExtent(gridSizeForLevel(state.basisLevel)) + NODE_WATER_MARGIN;
  const rad = def.angle*Math.PI/180;
  return { x: Math.cos(rad)*radius, y: Math.sin(rad)*radius };
}

// ================= Kamera (Zoom & Verschieben) =================

const camera = { x:0, y:0, scale:1 };
function clampCamera(){
  const d = Math.hypot(camera.x,camera.y);
  const max = WATER_RADIUS-40;
  if(d>max){ camera.x = camera.x/d*max; camera.y = camera.y/d*max; }
  camera.scale = Math.max(0.5, Math.min(2.4, camera.scale));
}
function screenToWorld(sx,sy){
  return { x:(sx-W/2)/camera.scale + camera.x, y:(sy-H/2)/camera.scale + camera.y };
}

const pointers = new Map();
let dragTotal = 0;
let pinchStartDist = 0, pinchStartScale = 1;

function canvasPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, canvasPos(e));
  dragTotal = 0;
  if(pointers.size===2){
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartScale = camera.scale;
  }
});
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = canvasPos(e);
  pointers.set(e.pointerId, cur);

  if(pointers.size===2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchStartDist>10){ camera.scale = pinchStartScale * (dist/pinchStartDist); clampCamera(); render(); }
  } else if(pointers.size===1){
    const dx = cur.x-prev.x, dy = cur.y-prev.y;
    dragTotal += Math.hypot(dx,dy);
    camera.x -= dx/camera.scale;
    camera.y -= dy/camera.scale;
    clampCamera();
    render();
  }
});
function pointerEnd(e){
  const wasSingle = pointers.size===1;
  const pos = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(wasSingle && dragTotal<8 && pos){
    const w = screenToWorld(pos.x,pos.y);
    handleTap(w.x,w.y);
  }
  if(pointers.size<2) pinchStartDist=0;
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  camera.scale *= (e.deltaY<0) ? 1.1 : 0.9;
  clampCamera(); render();
}, {passive:false});

document.getElementById("zoomIn").addEventListener("click", ()=>{ camera.scale*=1.2; clampCamera(); render(); });
document.getElementById("zoomOut").addEventListener("click", ()=>{ camera.scale*=0.83; clampCamera(); render(); });
document.getElementById("centerBtn").addEventListener("click", ()=>{ camera.x=0; camera.y=0; camera.scale=1; render(); });

// ================= Rendern =================

function drawRoundRect(x,y,w,h,r,fill){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fillStyle = fill; ctx.fill();
}
function hashRand(seed){ const x=Math.sin(seed*12.9898)*43758.5453; return x-Math.floor(x); }

function drawWater(){
  ctx.fillStyle = "#123145";
  ctx.fillRect(-3000,-3000,6000,6000);
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 3;
  for(let i=-25;i<25;i++){
    ctx.beginPath();
    ctx.moveTo(-1500, i*45);
    ctx.quadraticCurveTo(0, i*45+18, 1500, i*45);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,WATER_RADIUS,0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 4/camera.scale;
  ctx.setLineDash([14/camera.scale,10/camera.scale]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = (13/camera.scale)+"px sans-serif"; ctx.textAlign="center";
  ctx.fillText("offene See →", 0, -WATER_RADIUS+24/camera.scale);
  ctx.textAlign="left";
}

function drawGrassTile(x,y,c,r){
  ctx.fillStyle = "#33502f";
  ctx.fillRect(x-CELL/2, y-CELL/2, CELL, CELL);
  const seed = c*131+r*911;
  for(let k=0;k<4;k++){
    const rx = (hashRand(seed+k)-0.5)*CELL*0.8;
    const ry = (hashRand(seed+k+40)-0.5)*CELL*0.8;
    ctx.fillStyle = k%2===0 ? "rgba(255,255,255,0.045)" : "rgba(0,0,0,0.09)";
    ctx.beginPath(); ctx.arc(x+rx,y+ry, 2.5+hashRand(seed+k+80)*3, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
  ctx.strokeRect(x-CELL/2, y-CELL/2, CELL, CELL);
}

function drawPlusButton(x,y){
  drawRoundRect(x-22,y-22,44,44,9,"rgba(255,255,255,0.10)");
  ctx.strokeStyle="rgba(255,255,255,0.32)"; ctx.lineWidth=1.5;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,9); ctx.stroke();
  ctx.strokeStyle="#cfe3f7"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.stroke();
  ctx.lineCap="butt";
}

function drawLockedButton(x,y){
  drawRoundRect(x-22,y-22,44,44,9,"rgba(255,255,255,0.03)");
  ctx.strokeStyle="rgba(255,255,255,0.14)"; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,9); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(210,220,235,0.55)"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(x,y-3,5,Math.PI,0); ctx.stroke();
  drawRoundRect(x-7,y-3,14,10,2,"rgba(210,220,235,0.55)");
}

function drawLevelPips(x,y,level){
  const n = Math.min(level,5);
  const w = n*7-3;
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(x-w/2+i*7, y, 2.1, 0, Math.PI*2);
    ctx.fillStyle = "#f2c94c"; ctx.fill();
  }
}

function drawTowerSprite(x,y,b){
  const s=25;
  drawRoundRect(x-s,y-s,s*2,s*2,7,"#5a6472");
  ctx.strokeStyle="#333a42"; ctx.lineWidth=2;
  ctx.strokeRect(x-s+1,y-s+1,s*2-2,s*2-2);
  ctx.fillStyle="#454e59";
  const cz=6;
  [[-s+1,-s+1],[s-cz-1,-s+1],[-s+1,s-cz-1],[s-cz-1,s-cz-1]].forEach(([dx,dy])=>{ ctx.fillRect(x+dx,y+dy,cz,cz); });
  ctx.beginPath(); ctx.arc(x,y-3,13,0,Math.PI*2);
  ctx.fillStyle="#c94a4a"; ctx.fill();
  ctx.strokeStyle="#7a2424"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-4,y-7,3,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.25)"; ctx.fill();
  const weaponColor = b.weapon==="kanone" ? "#3a3a42" : "#8a6a3a";
  ctx.fillStyle = weaponColor; ctx.fillRect(x-3,y-19,6,11);
  ctx.fillStyle = b.weapon==="kanone" ? "#55555f" : "#a5825a"; ctx.fillRect(x-3,y-19,6,3);
  drawLevelPips(x, y+18, b.level);
}

function drawWallSprite(x,y,b){
  const s=25;
  drawRoundRect(x-s,y-s,s*2,s*2,4,"#8a5a3a");
  ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=1.3;
  const rows=4, rowH=(s*2)/rows;
  for(let i=1;i<rows;i++){ const yy=y-s+i*rowH; ctx.beginPath(); ctx.moveTo(x-s+2,yy); ctx.lineTo(x+s-2,yy); ctx.stroke(); }
  for(let i=0;i<rows;i++){
    const yy0=y-s+i*rowH, yy1=yy0+rowH;
    const offset=(i%2===0)?0:(s*2)/4;
    for(let xx=x-s+offset; xx<x+s-1; xx+=(s*2)/2){ ctx.beginPath(); ctx.moveTo(xx,yy0+1.5); ctx.lineTo(xx,yy1-1.5); ctx.stroke(); }
  }
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(x-s,y-s,s*2,4);
  ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(x-s,y+s-4,s*2,4);
  ctx.strokeStyle="#4a2f1c"; ctx.lineWidth=2; ctx.strokeRect(x-s+1,y-s+1,s*2-2,s*2-2);
  drawLevelPips(x, y+18, b.level);
}

function drawBuildingSprite(x,y,building){
  if(building.type==="turm") drawTowerSprite(x,y,building);
  else if(building.type==="mauer") drawWallSprite(x,y,building);
}

function drawLogNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2);
  ctx.fillStyle="rgba(20,40,55,0.5)"; ctx.fill();
  ["#8a5a34","#a06d3f"].forEach((col,i)=>{
    ctx.fillStyle=col;
    drawRoundRect(x-15, y-4+i*7, 30, 6, 3, col);
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(x-13,y-1+i*7,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+13,y-1+i*7,2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // Fuellstand-Ring
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#c99a5a"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="10px sans-serif"; ctx.textAlign="center";
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawRockNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2);
  ctx.fillStyle="rgba(20,40,55,0.5)"; ctx.fill();
  [[-7,3,9,"#9aa3ac"],[6,4,8,"#7c8590"],[0,-5,7,"#b3bcc4"]].forEach(([dx,dy,rr,col])=>{
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1.2; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#b7c2cf"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="10px sans-serif"; ctx.textAlign="center";
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawChip(x,y,w,fill,drawIcon,text){
  drawRoundRect(x,y,w,30,15,fill);
  ctx.save();
  ctx.translate(x+18,y+15);
  drawIcon();
  ctx.restore();
  ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+32, y+16);
  ctx.textBaseline="alphabetic";
}

function drawInGameHud(){
  ctx.fillStyle="rgba(8,14,20,0.0)";
  const barY = 12;
  drawChip(12, barY, 84, "rgba(10,16,22,0.55)", ()=>{
    ["#8a5a34","#a06d3f"].forEach((col,i)=>{
      ctx.fillStyle=col; drawRoundRect(-9,-3+i*5,18,4,2,col);
    });
  }, state.resources.holz);

  drawChip(104, barY, 84, "rgba(10,16,22,0.55)", ()=>{
    [[-4,2,6,"#9aa3ac"],[4,3,5,"#7c8590"],[0,-3,5,"#b3bcc4"]].forEach(([dx,dy,rr,col])=>{
      ctx.beginPath(); ctx.arc(dx,dy,rr,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    });
  }, state.resources.stein);

  drawChip(W-96, barY, 84, "rgba(165,83,58,0.55)", ()=>{
    ctx.fillStyle="#f2c94c";
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*(Math.PI*2/5);
      const ang2=ang+Math.PI/5;
      ctx.lineTo(Math.cos(ang)*7,Math.sin(ang)*7);
      ctx.lineTo(Math.cos(ang2)*3,Math.sin(ang2)*3);
    }
    ctx.closePath(); ctx.fill();
  }, "Lv "+state.basisLevel);
}

function render(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(camera.scale, camera.scale);
  ctx.translate(-camera.x, -camera.y);

  drawWater();

  list.forEach(([c,r])=>{ const p=cellCenter(c,r,gridSize); drawGrassTile(p.x,p.y,c,r); });
  { const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize); drawGrassTile(p.x,p.y,0,0); }

  list.forEach(([c,r])=>{
    const p = cellCenter(c,r,gridSize);
    const slot = state.cellsByCoord[c+","+r] || {unlocked:false,building:null};
    if(slot.building) drawBuildingSprite(p.x,p.y,slot.building);
    else if(!slot.unlocked) drawLockedButton(p.x,p.y);
    else drawPlusButton(p.x,p.y);
  });

  // Wasser-Ressourcenknoten
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    const p = nodeWorldPos(def);
    if(def.type==="holz") drawLogNode(p.x,p.y,n,def); else drawRockNode(p.x,p.y,n,def);
  });

  // Base in der Mitte
  {
    const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize);
    drawRoundRect(p.x-27,p.y-27,54,54,8,"#a5533a");
    ctx.fillStyle="#1a0d0d"; ctx.font="9px sans-serif"; ctx.textAlign="center";
    ctx.fillText("Base", p.x, p.y+2);
    ctx.fillText("Level "+state.basisLevel, p.x, p.y+13);
    ctx.textAlign="left";
  }

  ctx.restore();
  drawInGameHud();
}

// ================= Eingabe / Menues =================

function handleTap(wx,wy){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const c0 = centerOf(gridSize);

  // Wasser-Knoten treffen?
  for(const n of state.nodes){
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    const p = nodeWorldPos(def);
    if(Math.hypot(wx-p.x,wy-p.y) < 26){ collectNode(n,def); return; }
  }

  const c = Math.round(wx/CELL + c0);
  const r = Math.round(wy/CELL + c0);
  if(c<0||c>=gridSize||r<0||r>=gridSize) return;
  if(c===c0 && r===c0){ openBasisMenu(); return; }
  openBuildMenu(c,r);
}

function collectNode(n,def){
  if(n.amount<=0) return;
  state.resources[def.type] += n.amount;
  n.amount = 0;
  save(); render();
}

function openBasisMenu(){
  const cost = basisUpgradeCost(state.basisLevel);
  const overlay = document.createElement("div");
  overlay.className="buildmenu";
  const box = document.createElement("div");
  box.className="box";
  box.innerHTML = `<h3>Base</h3><div class="hint2">Level ${state.basisLevel}</div>`;
  const opt = document.createElement("div");
  opt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
  opt.innerHTML = `<span>Verbessern auf Level ${state.basisLevel+1}<small>${nextLevelDescription()}</small></span><b>${formatCost(cost)}</b>`;
  opt.addEventListener("click", ()=>{
    if(upgradeBasis()){ document.body.removeChild(overlay); render(); }
  });
  box.appendChild(opt);
  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function openBuildMenu(c,r){
  const key = c+","+r;
  const slot = state.cellsByCoord[key] || {unlocked:false, building:null};
  state.cellsByCoord[key] = slot;

  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";

  if(!slot.unlocked){
    box.innerHTML = `<h3>Noch gesperrt</h3><div class="hint2">Verbessere deine Base, um weitere Felder freizuschalten.</div>`;
  } else if(slot.building){
    const b = slot.building;
    const def = BUILDABLE_TYPES[b.type];
    const cost = upgradeCost(b.type, b.level);
    const hp = hpFor(b.type, b.level);
    box.innerHTML = `<h3>${def.name}</h3><div class="hint2">Level ${b.level} · HP ${hp}/${hp}</div>`;

    const upOpt = document.createElement("div");
    upOpt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
    upOpt.innerHTML = `<span>Verbessern auf Level ${b.level+1}</span><b>${formatCost(cost)}</b>`;
    upOpt.addEventListener("click", ()=>{
      if(canAfford(cost)){ payCost(cost); b.level++; save(); document.body.removeChild(overlay); render(); }
    });
    box.appendChild(upOpt);

    if(b.type==="turm"){
      const wHead = document.createElement("div");
      wHead.className="hint2"; wHead.style.marginTop="6px"; wHead.textContent="Waffe auswählen:";
      box.appendChild(wHead);
      Object.entries(WEAPONS).forEach(([key2,w])=>{
        const unlocked = b.level>=w.unlockLevel;
        const selected = b.weapon===key2;
        const wOpt = document.createElement("div");
        wOpt.className = "buildopt"+(!unlocked?" disabled":"");
        wOpt.style.border = selected ? "1px solid #7aa2f7" : "";
        wOpt.innerHTML = `<span>${w.name}${selected?" (aktiv)":""}<small>${unlocked?w.desc:"Verfügbar ab Level "+w.unlockLevel}</small></span>`;
        if(unlocked && !selected) wOpt.addEventListener("click", ()=>{ b.weapon=key2; save(); document.body.removeChild(overlay); render(); });
        box.appendChild(wOpt);
      });
    }
  } else {
    box.innerHTML = `<h3>Feld bebauen</h3>`;
    Object.entries(BUILDABLE_TYPES).forEach(([type,def])=>{
      const opt = document.createElement("div");
      opt.className = "buildopt" + (!canAfford(def.cost) ? " disabled":"");
      opt.innerHTML = `<span>${def.name}<small>${def.desc}</small></span><b>${formatCost(def.cost)}</b>`;
      opt.addEventListener("click", ()=>{
        if(canAfford(def.cost)){
          payCost(def.cost);
          slot.building = type==="turm" ? {type,level:1,weapon:"bogen"} : {type,level:1};
          save(); document.body.removeChild(overlay); render();
        }
      });
      box.appendChild(opt);
    });
  }

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function addCloseBtn(box, overlay){
  const close = document.createElement("div");
  close.className="buildopt"; close.style.justifyContent="center"; close.textContent="Schließen";
  close.addEventListener("click", ()=> document.body.removeChild(overlay));
  box.appendChild(close);
}

render();

})();
</script>
