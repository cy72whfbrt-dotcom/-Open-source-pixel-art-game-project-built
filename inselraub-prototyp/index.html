<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Basis-Raster-Prototyp</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    margin:0; padding:0; background:#0d1620; color:#eee;
    font-family: system-ui, sans-serif; display:flex; flex-direction:column; align-items:center;
    min-height:100vh; user-select:none;
  }
  [hidden] { display:none !important; }
  #app { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; padding:10px; }
  h1 { margin:4px 0 2px; font-size:17px; text-align:center; }
  .sub { color:#8b96a5; font-size:11.5px; text-align:center; margin-bottom:8px; padding:0 6px; }

  #hud { width:100%; max-width:380px; display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
  #hud .pill { background:#1c2b3a; border:1px solid #2e4358; padding:5px 10px; border-radius:11px; }
  #hud .pill b { color:#f2c94c; }

  canvas { background:#0f2233; border:2px solid #2e4358; border-radius:8px; display:block; }

  .legend { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; font-size:11px; color:#9aa3b2; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .swatch { width:12px; height:12px; border-radius:3px; display:inline-block; }

  .buildmenu {
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:20;
  }
  .buildmenu .box { background:#1c2b3a; border:1px solid #3a5570; border-radius:8px; padding:16px; width:300px; max-width:88vw; }
  .buildmenu h3 { margin:0 0 4px; font-size:15px; }
  .buildmenu .hint2 { color:#8b96a5; font-size:11.5px; margin-bottom:10px; }
  .buildopt {
    display:flex; justify-content:space-between; align-items:center; padding:9px; border:1px solid #2e4358;
    border-radius:5px; margin-bottom:7px; cursor:pointer; font-size:12.5px; gap:8px;
  }
  .buildopt.disabled { opacity:.4; }
  .buildopt small { display:block; color:#8b96a5; margin-top:2px; }
</style>
</head>
<body>

<div id="app">
  <h1>Basis-Raster-Prototyp</h1>
  <div class="sub">5x5 Raster, deine Base in der Mitte. Auf jedem freien Feld kannst du selbst wählen: Turm oder Mauer.</div>

  <div id="hud">
    <div class="pill">Vorräte: <b id="hudRes">0</b></div>
    <div class="pill">Basis-HP: <b id="hudHp">100</b></div>
  </div>

  <canvas id="c" width="380" height="380"></canvas>

  <div class="legend">
    <span><i class="swatch" style="background:#c94a4a"></i>Turm</span>
    <span><i class="swatch" style="background:#8a5a3a"></i>Mauer</span>
    <span><i class="swatch" style="background:#a5533a"></i>Base</span>
    <span><i class="swatch" style="background:#33502f"></i>Grün / frei</span>
  </div>
</div>

<script>
(function(){
"use strict";

const GRID = 5, CELL = 62, ORIGIN = {x:35, y:35};
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function cellCenter(c,r){ return { x: ORIGIN.x + c*CELL + CELL/2, y: ORIGIN.y + r*CELL + CELL/2 }; }

const CENTER = [2,2];

// Alle 24 Felder auSSer der Mitte - die 8 direkten Nachbarn zuerst
// (die schaltest du zuerst frei), danach der aeuSSere Rand des 5x5-Rasters.
const NEIGHBOR_CELLS = [[1,1],[2,1],[3,1],[1,2],[3,2],[1,3],[2,3],[3,3]];
const OUTER_CELLS = [];
for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
  if(r===0||r===GRID-1||c===0||c===GRID-1) OUTER_CELLS.push([c,r]);
}
const CELLS = NEIGHBOR_CELLS.concat(OUTER_CELLS);

// ================= Zustand =================

const SAVE_KEY = "basis_raster_proto_v2";

function defaultState(){
  return {
    resources: 70,
    baseHp: 100,
    cells: CELLS.map((_,i)=>({ unlocked: i<4, building:null }))
  };
}
let state = load();
function load(){
  try { const raw = localStorage.getItem(SAVE_KEY); if(raw) return JSON.parse(raw); } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){} }

function unlockCost(i){ return 30 + i*18; }

const BUILDABLE_TYPES = {
  turm:  { name:"Turm",  desc:"Verteidigungsturm, greift Angreifer an.", baseCost:40, icon:"⚔", color:"#c94a4a" },
  mauer: { name:"Mauer", desc:"Blockiert den Weg, hat aber selbst keinen Angriff.", baseCost:15, icon:"▮", color:"#8a5a3a" }
};
function upgradeCost(type, level){ return Math.round(BUILDABLE_TYPES[type].baseCost * Math.pow(1.5, level)); }

// ================= Rendern =================

function drawRoundRect(x,y,w,h,r,fill){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fillStyle = fill; ctx.fill();
}

function render(){
  document.getElementById("hudRes").textContent = state.resources;
  document.getElementById("hudHp").textContent = state.baseHp;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Gruenes 5x5-Feld als Untergrund
  ctx.fillStyle = "#33502f";
  ctx.fillRect(ORIGIN.x, ORIGIN.y, CELL*GRID, CELL*GRID);
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(ORIGIN.x+i*CELL, ORIGIN.y); ctx.lineTo(ORIGIN.x+i*CELL, ORIGIN.y+CELL*GRID); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ORIGIN.x, ORIGIN.y+i*CELL); ctx.lineTo(ORIGIN.x+CELL*GRID, ORIGIN.y+i*CELL); ctx.stroke();
  }

  // Bau-Felder
  CELLS.forEach(([c,r],i)=>{
    const p = cellCenter(c,r);
    const slot = state.cells[i];
    if(slot.building){
      const def = BUILDABLE_TYPES[slot.building.type];
      drawRoundRect(p.x-26,p.y-26,52,52,8,def.color);
      ctx.fillStyle="#1a0d0d"; ctx.font="bold 19px sans-serif"; ctx.textAlign="center";
      ctx.fillText(def.icon, p.x, p.y+6);
      ctx.font="9px sans-serif"; ctx.fillText("Lv"+slot.building.level, p.x, p.y+21);
    } else if(!slot.unlocked){
      ctx.strokeStyle="#3a5570"; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
      ctx.strokeRect(p.x-24,p.y-24,48,48); ctx.setLineDash([]);
      ctx.fillStyle="#5f7180"; ctx.font="17px sans-serif"; ctx.textAlign="center";
      ctx.fillText("+", p.x, p.y+6);
    } else {
      ctx.strokeStyle="#cfe3f7"; ctx.lineWidth=1.5;
      ctx.strokeRect(p.x-24,p.y-24,48,48);
      ctx.fillStyle="#cfe3f7"; ctx.font="17px sans-serif"; ctx.textAlign="center";
      ctx.fillText("+", p.x, p.y+6);
    }
  });

  // Base in der Mitte
  {
    const p = cellCenter(CENTER[0], CENTER[1]);
    drawRoundRect(p.x-27,p.y-27,54,54,8,"#a5533a");
    ctx.fillStyle="#1a0d0d"; ctx.font="9px sans-serif"; ctx.textAlign="center";
    ctx.fillText("Base", p.x, p.y+3);
    ctx.fillText(state.baseHp+"/100", p.x, p.y+14);
  }

  ctx.textAlign="left";
}

// ================= Eingabe =================

function findCellIndex(c,r){ return CELLS.findIndex(cell=>cell[0]===c&&cell[1]===r); }

canvas.addEventListener("click", e=>{
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left)*(canvas.width/rect.width);
  const y = (e.clientY-rect.top)*(canvas.height/rect.height);
  const c = Math.floor((x-ORIGIN.x)/CELL), r = Math.floor((y-ORIGIN.y)/CELL);
  if(c<0||c>=GRID||r<0||r>=GRID) return;
  if(c===CENTER[0] && r===CENTER[1]) return;

  const i = findCellIndex(c,r);
  if(i>=0) openBuildMenu(i);
});

function openBuildMenu(i){
  const slot = state.cells[i];
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";

  if(!slot.unlocked){
    const cost = unlockCost(i);
    box.innerHTML = `<h3>Feld freischalten</h3>`;
    const opt = document.createElement("div");
    opt.className = "buildopt" + (state.resources<cost ? " disabled":"");
    opt.innerHTML = `<span>Freischalten</span><b>${cost}g</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources>=cost){ state.resources-=cost; slot.unlocked=true; save(); document.body.removeChild(overlay); render(); }
    });
    box.appendChild(opt);
  } else if(slot.building){
    const def = BUILDABLE_TYPES[slot.building.type];
    const cost = upgradeCost(slot.building.type, slot.building.level);
    box.innerHTML = `<h3>${def.name} aufwerten</h3><div class="hint2">Level ${slot.building.level} → ${slot.building.level+1}</div>`;
    const opt = document.createElement("div");
    opt.className = "buildopt" + (state.resources<cost ? " disabled":"");
    opt.innerHTML = `<span>Aufwerten</span><b>${cost}g</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources>=cost){ state.resources-=cost; slot.building.level++; save(); document.body.removeChild(overlay); render(); }
    });
    box.appendChild(opt);
  } else {
    box.innerHTML = `<h3>Feld bebauen</h3>`;
    Object.entries(BUILDABLE_TYPES).forEach(([type,def])=>{
      const opt = document.createElement("div");
      opt.className = "buildopt" + (state.resources<def.baseCost ? " disabled":"");
      opt.innerHTML = `<span>${def.name}<small>${def.desc}</small></span><b>${def.baseCost}g</b>`;
      opt.addEventListener("click", ()=>{
        if(state.resources>=def.baseCost){
          state.resources-=def.baseCost; slot.building={type,level:1};
          save(); document.body.removeChild(overlay); render();
        }
      });
      box.appendChild(opt);
    });
  }

  const close = document.createElement("div");
  close.className = "buildopt"; close.style.justifyContent = "center"; close.textContent = "Schließen";
  close.addEventListener("click", ()=> document.body.removeChild(overlay));
  box.appendChild(close);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

render();

})();
</script>
</body>
</html>
