function drawLevelPips(x,y,level){
  const n = Math.min(level,5);
  const w = n*7-3;
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(x-w/2+i*7, y, 2.1, 0, Math.PI*2);
    ctx.fillStyle = "#f2c94c"; ctx.fill();
  }
}

function drawHpBar(x,y,hp,maxHp,w){
  if(hp>=maxHp) return;
  const ratio = Math.max(0,hp/maxHp);
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(x-w/2,y,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(x-w/2,y,w*ratio,4);
}

function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,(n>>16)+amt));
  const g = Math.max(0,Math.min(255,((n>>8)&0xff)+amt));
  const b = Math.max(0,Math.min(255,(n&0xff)+amt));
  return "rgb("+r+","+g+","+b+")";
}

function drawPlayerSprite(){
  const pl = state.player;
  const x=pl.x, y=pl.y;

  if(pl.moveTarget){
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1.6;
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(pl.moveTarget.x,pl.moveTarget.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.save();
  // Kurzes Blinken waehrend der Unverwundbarkeit nach einem K.o.
  if(pl.invulnCd>0) ctx.globalAlpha = (Math.floor(performance.now()/120)%2===0) ? 0.4 : 1;

  drawShadow(x,y+13,10,4);
  // Rucksack (hinter dem Koerper), Fuellstand als kleiner Ring
  const total = backpackTotal();
  const fillRatio = Math.max(0, Math.min(1, total/playerBackpackCapacity()));
  const bpX = x-9, bpY = y-2;
  drawRoundRect(bpX-6,bpY-7,12,15,3,"#6a4c2a");
  ctx.strokeStyle="#3a2612"; ctx.lineWidth=1.2; ctx.strokeRect(bpX-6,bpY-7,12,15);
  if(total>0){
    ctx.beginPath(); ctx.arc(bpX,bpY,9,-Math.PI/2,-Math.PI/2+Math.PI*2*fillRatio);
    ctx.strokeStyle = fillRatio>=1 ? "#e04a4a" : "#f2c94c"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  }
  // Beine
  ctx.fillStyle="#3a3f5a";
  ctx.fillRect(x-5,y+6,4,9); ctx.fillRect(x+1,y+6,4,9);
  // Koerper - kraeftiges, gesaettigtes Comic-Blau statt gedecktem Stahlblau
  const bodyGrad = ctx.createLinearGradient(x,y-8,x,y+8);
  bodyGrad.addColorStop(0,"#5a9bf0"); bodyGrad.addColorStop(1,"#3868c0");
  drawRoundRect(x-8,y-8,16,15,4,bodyGrad);
  ctx.strokeStyle="#1f3f80"; ctx.lineWidth=1.3; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-8,y-8,16,15,4); ctx.stroke();
  // Kopf
  ctx.beginPath(); ctx.arc(x,y-13,7,0,Math.PI*2);
  ctx.fillStyle="#e8b48a"; ctx.fill();
  ctx.strokeStyle="#a5764f"; ctx.lineWidth=1; ctx.stroke();
  // Haare
  ctx.beginPath(); ctx.arc(x,y-16,6,Math.PI,0); ctx.fillStyle="#5a3a22"; ctx.fill();
  // Augen
  ctx.fillStyle="#2a1f18";
  ctx.beginPath(); ctx.arc(x-2.5,y-13,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2.5,y-13,1,0,Math.PI*2); ctx.fill();

  // Rucksack-Kapazitaet als x/x ueber dem Kopf
  ctx.font = "bold 10px system-ui, sans-serif";
  ctx.textAlign = "center";
  const capLabel = total+"/"+playerBackpackCapacity();
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.strokeText(capLabel, x, y-24);
  ctx.fillStyle = fillRatio>=1 ? "#e04a4a" : "#fff";
  ctx.fillText(capLabel, x, y-24);
  ctx.textAlign = "left";

  ctx.restore();
  // HP-Leiste (ausserhalb des Blink-Alpha, damit sie auch waehrend der
  // Unverwundbarkeit klar lesbar bleibt)
  drawHpBar(x, y-38, pl.hp, playerMaxHp(), 24);
}

function drawDepositFx(){
  if(!depositFx) return;
  const elapsed = performance.now()-depositFx.startedAt;
  if(elapsed>=DEPOSIT_FX_DURATION){ depositFx = null; return; }
  const t = elapsed/DEPOSIT_FX_DURATION;
  const rise = t*26, alpha = 1-t;
  const label = "+"+depositFx.holz+" 🌳  +"+depositFx.stein+" 🪨";
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.strokeText(label, 0, -40-rise);
  ctx.fillStyle = "#fff";
  ctx.fillText(label, 0, -40-rise);
  ctx.restore();
}

function drawKnockoutFx(){
  if(!knockoutFx) return;
  const elapsed = performance.now()-knockoutFx.startedAt;
  if(elapsed>=KNOCKOUT_FX_DURATION){ knockoutFx = null; return; }
  const t = elapsed/KNOCKOUT_FX_DURATION;
  const rise = t*30, alpha = 1-t;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.strokeText("K.o.! Rucksack verloren", 0, -46-rise);
  ctx.fillStyle = "#ff6a6a";
  ctx.fillText("K.o.! Rucksack verloren", 0, -46-rise);
  ctx.restore();
}

function drawEnemy(e){
  const type = ENEMY_TYPES[e.typeKey] || {color:"#8a2f2f"};
  drawShadow(e.x,e.y+e.r,e.r*1.3,4);
  // Flacher 2-Ton-Verlauf statt kugelig-realistischer Lichtkugel-Schattierung
  // (vorher +45/-25 Kontrast liess sie wie eine gerenderte 3D-Kugel wirken).
  const bodyGrad = ctx.createLinearGradient(e.x,e.y-e.r,e.x,e.y+e.r);
  bodyGrad.addColorStop(0, shadeColor(type.color,22));
  bodyGrad.addColorStop(1, shadeColor(type.color,-14));
  ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fillStyle=bodyGrad; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2; ctx.stroke();
  if(e.armor){
    // Ruestungsplatten mit Nieten
    ctx.strokeStyle="rgba(225,228,235,0.85)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,0.35,1.65); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,Math.PI+0.35,Math.PI+1.65); ctx.stroke();
    ctx.fillStyle="rgba(200,204,212,0.9)";
    [0.55,1.0,1.45].forEach(a=>{ ctx.beginPath(); ctx.arc(e.x+Math.cos(a)*(e.r-3),e.y+Math.sin(a)*(e.r-3),1.1,0,Math.PI*2); ctx.fill(); });
  }
  // Augen (leicht wuetend, je nach Typ)
  const eyeDx = e.r*0.32, eyeDy = -e.r*0.08;
  [-1,1].forEach(s=>{
    ctx.beginPath(); ctx.arc(e.x+s*eyeDx,e.y+eyeDy,e.r*0.16,0,Math.PI*2);
    ctx.fillStyle="#1a1410"; ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+s*eyeDx-e.r*0.05,e.y+eyeDy-e.r*0.05,e.r*0.05,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.8)"; ctx.fill();
  });
  ctx.strokeStyle="rgba(0,0,0,0.55)"; ctx.lineWidth=1.4; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(e.x-eyeDx-e.r*0.16,e.y+eyeDy-e.r*0.22); ctx.lineTo(e.x-eyeDx+e.r*0.1,e.y+eyeDy-e.r*0.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(e.x+eyeDx+e.r*0.16,e.y+eyeDy-e.r*0.22); ctx.lineTo(e.x+eyeDx-e.r*0.1,e.y+eyeDy-e.r*0.1); ctx.stroke();
  ctx.lineCap="butt";
  ctx.beginPath(); ctx.arc(e.x-e.r*0.35,e.y-e.r*0.4,e.r*0.18,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fill();
  const w=e.r*2.2, ratio=Math.max(0,e.hp/e.maxHp), by=e.y-e.r-9;
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(e.x-w/2,by,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(e.x-w/2,by,w*ratio,4);

  // Brand (Feuerturm-Treffer): flackernder oranger Ring, solange burnTime
  // laeuft - klarer sichtbarer Hinweis auf den Schaden-ueber-Zeit-Effekt.
  if(e.burnTime>0){
    const flicker = 0.55+0.35*Math.sin(performance.now()/90+e.x);
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+2.5,0,Math.PI*2);
    ctx.strokeStyle = `rgba(255,122,61,${flicker})`; ctx.lineWidth=2; ctx.stroke();
  }
}

function drawProjectile(pr){
  // Feuerturm-Geschosse bekommen eine eigene orange Farbe statt dem
  // Standard-Warmgelb - sichtbarer Hinweis auf den Brand-Effekt.
  const core = pr.color || "#f2c94c";
  const ang = Math.atan2(pr.vy,pr.vx);
  const tx = pr.x-Math.cos(ang)*9, ty = pr.y-Math.sin(ang)*9;
  const trail = ctx.createLinearGradient(tx,ty,pr.x,pr.y);
  trail.addColorStop(0,core+"00"); trail.addColorStop(1,core+"d9");
  ctx.strokeStyle=trail; ctx.lineWidth=2.6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(pr.x,pr.y); ctx.stroke();
  ctx.lineCap="butt";
  const glow = ctx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,5);
  glow.addColorStop(0,core+"e6"); glow.addColorStop(1,core+"00");
  ctx.beginPath(); ctx.arc(pr.x,pr.y,5,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
  ctx.beginPath(); ctx.arc(pr.x,pr.y,2.6,0,Math.PI*2);
  ctx.fillStyle="#fff3c4"; ctx.fill();
}

function drawTutorialHighlight(x,y,label){
  const t = performance.now()/1000;
  const pulse = 0.5+0.5*Math.sin(t*3.2);
  ctx.beginPath(); ctx.arc(x,y,31+pulse*5,0,Math.PI*2);
  ctx.strokeStyle = `rgba(255,225,90,${0.55+pulse*0.35})`; ctx.lineWidth=3.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,31+pulse*5+7,0,Math.PI*2);
  ctx.strokeStyle = `rgba(255,225,90,${0.18+pulse*0.15})`; ctx.lineWidth=2; ctx.stroke();
  // Pfeil von oben
  const ay = y-46-pulse*4;
  ctx.fillStyle="#ffe15a";
  ctx.beginPath(); ctx.moveTo(x,ay+14); ctx.lineTo(x-7,ay); ctx.lineTo(x+7,ay); ctx.closePath(); ctx.fill();
  ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.6)"; ctx.lineWidth=3; ctx.strokeText(label, x, ay-4);
  ctx.fillText(label, x, ay-4);
  ctx.textAlign="left";
}

// Flacher Baustein-Fuellstil: gesaettigter 2-Ton-Verlauf + duenne klare
// Kontur + eine einzelne leichte Lichtkante oben - der gleiche Aufbau wie
// bei den Waehrungs-/Fuellstands-Pillen im HUD. Kein Rauschen, keine
// Multiply-Materialtextur und kein Ambient-Occlusion-Saum mehr: das war der
// "Material mit echtem Volumen"-Look, der zu fotorealistisch wirkte statt
// modern-flach wie der Rest des Spiels.
function fillFlatBlock(x0,y0,w,h,r,tintTop,tintBottom){
  const g = ctx.createLinearGradient(x0,y0,x0,y0+h);
  g.addColorStop(0,tintTop); g.addColorStop(1,tintBottom);
  drawRoundRect(x0,y0,w,h,r,g);
  ctx.strokeStyle="rgba(20,24,32,0.3)"; ctx.lineWidth=2;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x0+1,y0+1,w-2,h-2,Math.max(1,r-1)); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.18)";
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x0+2,y0+2,w-4,Math.max(2,h*0.1),Math.max(1,r-1)); ctx.fill();
}

function drawTowerSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-2,21,6);
  fillFlatBlock(x-s,y-s,s*2,s*2,5, HUD.stoneA, HUD.stoneB);
  // Steinfugen als einfache, duenne Linien - Struktur-Hinweis statt
  // gemaltem Mauerwerk mit eigener Licht-/Schattenkante pro Fuge.
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,5); ctx.clip();
  ctx.strokeStyle="rgba(20,26,34,0.22)"; ctx.lineWidth=1.3;
  for(let i=1;i<5;i++){
    const yy=y-s+i*(s*2/5);
    ctx.beginPath(); ctx.moveTo(x-s,yy); ctx.lineTo(x+s,yy); ctx.stroke();
    const off = (i%2===0)?0:(s*2)/3/2;
    for(let xx=x-s+off; xx<x+s; xx+=(s*2)/3){
      ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy-(s*2/5)); ctx.stroke();
    }
  }
  ctx.restore();
  // Zinnen (Krenelierung) oben - flache Bloecke im gleichen Baustein-Stil
  const cz=6.5;
  [-s+2, -s+2+cz*2.2, s-cz*3.2, s-cz-2].forEach(dx=>{
    fillFlatBlock(x+dx,y-s-4,cz,8,1.5, HUD.stoneA, HUD.stoneB);
  });
  // Wach-Kuppel mit Verlauf - kraeftiges, gesaettigtes Rot aus der
  // HUD-Gefahrenfarbe statt gedecktem Rostrot.
  const domeGrad = ctx.createRadialGradient(x-4,y-8,2,x,y-3,14);
  domeGrad.addColorStop(0,HUD.dangerA); domeGrad.addColorStop(1,HUD.dangerB);
  ctx.beginPath(); ctx.arc(x,y-3,13,0,Math.PI*2);
  ctx.fillStyle=domeGrad; ctx.fill();
  ctx.strokeStyle="#6e211f"; ctx.lineWidth=2; ctx.stroke();
  // Sichtschlitz
  ctx.fillStyle="rgba(20,10,10,0.5)"; drawRoundRect(x-4,y-6,8,5,2,"rgba(20,10,10,0.5)");
  ctx.beginPath(); ctx.arc(x-4,y-7,3,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.fill();
  if(b.weapon==="moerser"){
    // Dicke, leicht schraeg nach oben zeigende Moerser-Roehre
    ctx.save(); ctx.translate(x,y-9); ctx.rotate(-0.35);
    ctx.fillStyle="#2f4a34"; drawRoundRect(-5,-3,10,15,3,"#2f4a34");
    ctx.fillStyle="#4a6f52"; ctx.fillRect(-5,-3,10,4);
    ctx.strokeStyle="#1a2e1f"; ctx.lineWidth=1.3; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(-5,-3,10,15,3); ctx.stroke();
    ctx.restore();
  } else {
    // Eigene Lauf-Farbe je Waffe, damit sich Tuerme auch von oben/aus der
    // Distanz unterscheiden lassen statt alle bis auf den Moerser gleich
    // auszusehen.
    const BARREL_COLORS = {
      bogen:     ["#8a6a3a","#c9a06a"],
      armbrust:  ["#5a4632","#c9a570"],
      kanone:    ["#3a3a42","#6a6a75"],
      feuerturm: ["#7a2e18","#ff7a3d"]
    };
    const [base,tip] = BARREL_COLORS[b.weapon] || BARREL_COLORS.bogen;
    ctx.fillStyle = base; ctx.fillRect(x-3,y-19,6,11);
    ctx.fillStyle = tip; ctx.fillRect(x-3,y-19,6,3);
  }
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("turm",b.level), 34);
}

function drawWallSpriteWood(x,y,b){
  const s=25;
  // Einzelne Palisaden-Bohlen als flache Baustein-Streifen mit duenner
  // Trennlinie - Struktur-Hinweis statt Maserung mit eigener Volumenkante
  // pro Bohle.
  const planks = 4, pw = (s*2)/planks;
  for(let i=0;i<planks;i++){
    const px = x-s+i*pw;
    fillFlatBlock(px+0.5, y-s, pw-1, s*2, 2, HUD.woodA, HUD.woodB);
  }
  // Zwei Querbalken, deutlich davor liegend
  [-8, 12].forEach(dy=>{
    fillFlatBlock(x-s-1, y+dy, s*2+2, 8, 2, HUD.woodA, HUD.woodB);
    // Nagelkoepfe
    [-s+6, 0, s-8].forEach(dx=>{
      ctx.beginPath(); ctx.arc(x+dx, y+dy+4, 1.5, 0, Math.PI*2);
      ctx.fillStyle="#6a6058"; ctx.fill();
      ctx.beginPath(); ctx.arc(x+dx-0.4, y+dy+3.5, 0.8, 0, Math.PI*2);
      ctx.fillStyle="rgba(230,226,216,0.6)"; ctx.fill();
    });
  });
  // Moos/Bewitterung am Fuss
  ctx.fillStyle="rgba(74,96,48,0.3)";
  [[-s+7,y+s-4,4.5],[s-12,y+s-3,3.4],[-3,y+s-2,3]].forEach(([dx,dy,rr])=>{
    ctx.beginPath(); ctx.ellipse(x+dx,dy,rr,rr*0.6,0,0,Math.PI*2); ctx.fill();
  });
}

function drawWallSpriteStone(x,y,b){
  // Ab Level 3: verstaerkte Steinmauer statt Holzpalisade - sichtbare
  // Belohnung fuers Investieren, kein neuer Mechanismus.
  const s=25;
  fillFlatBlock(x-s,y-s,s*2,s*2,3, HUD.stoneA, HUD.stoneB);
  // Einzelne Quader im Verband als duenne flache Fugenlinien
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,3); ctx.clip();
  ctx.strokeStyle="rgba(18,22,30,0.24)"; ctx.lineWidth=1.3;
  const rows=4, rowH=(s*2)/rows;
  for(let i=0;i<rows;i++){
    const yy0=y-s+i*rowH;
    if(i>0){ ctx.beginPath(); ctx.moveTo(x-s,yy0); ctx.lineTo(x+s,yy0); ctx.stroke(); }
    const offset=(i%2===0)?0:(s*2)/4;
    for(let xx=x-s+offset; xx<x+s; xx+=(s*2)/2){
      ctx.beginPath(); ctx.moveTo(xx,yy0); ctx.lineTo(xx,yy0+rowH); ctx.stroke();
    }
  }
  ctx.restore();
  // Eisenverstaerkung als flaches Band statt Metallglanz-Verlauf
  ctx.fillStyle="#5c534b"; ctx.fillRect(x-s,y-4,s*2,8);
  ctx.strokeStyle="rgba(12,10,8,0.5)"; ctx.lineWidth=1; ctx.strokeRect(x-s,y-4,s*2,8);
  [-16,-5,6,16].forEach(dx=>{
    ctx.beginPath(); ctx.arc(x+dx,y,1.8,0,Math.PI*2); ctx.fillStyle="#8a8078"; ctx.fill();
  });
}

function drawWallSpriteIron(x,y,b){
  // Ab Level 6: massive Eisenplatte statt Stein - dritte und letzte
  // Material-Stufe, kuehlere Blaugrau-Palette statt der warmen Steinfarbe,
  // damit man den Sprung auch aus der Distanz sofort erkennt.
  const s=25;
  fillFlatBlock(x-s,y-s,s*2,s*2,3, HUD.ironA, HUD.ironB);
  // Diagonale Verstrebung ueber die ganze Platte, wie ein Schott
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,3); ctx.clip();
  ctx.strokeStyle="rgba(16,20,28,0.35)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
  ctx.restore();
  // Grosse Nietenreihe am Rand statt der duennen Fugenlinien der Steinstufe
  ctx.strokeStyle="rgba(16,20,28,0.4)"; ctx.lineWidth=2;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s+3,y-s+3,s*2-6,s*2-6,2); ctx.stroke();
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
    ctx.beginPath(); ctx.arc(x+sx*(s-6),y+sy*(s-6),2.2,0,Math.PI*2);
    ctx.fillStyle="#dfe4ec"; ctx.fill();
    ctx.beginPath(); ctx.arc(x+sx*(s-6),y+sy*(s-6),2.2,0,Math.PI*2);
    ctx.strokeStyle="rgba(16,20,28,0.5)"; ctx.lineWidth=1; ctx.stroke();
  });
}

function drawWallSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-4,20,6);
  // Drei Material-Stufen nach Level statt nur zwei - Holz, ab Level 3 Stein,
  // ab Level 6 Eisen. Automatisch am Level, keine eigene Auswahl (anders als
  // bei Turm-Waffen) - Mauern haben keine unterschiedliche Funktion je
  // Material, nur mehr HP und ein sichtbar staerkeres Aussehen.
  if(b.level>=6) drawWallSpriteIron(x,y,b);
  else if(b.level>=3) drawWallSpriteStone(x,y,b);
  else drawWallSpriteWood(x,y,b);
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("mauer",b.level), 34);
}

  ctx.strokeStyle="#3a2f22"; ctx.lineWidth=1.5; ctx.stroke();

  ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1.4;

  const platGrad = ctx.createLinearGradient(x,y-s-8,x,y-s+6);

function drawHandelspostenSprite(x,y,b){

function drawBaseSprite(x,y){
  const s=28;
  drawShadow(x,y+s-4,27,8);
  const grad = ctx.createLinearGradient(x,y-s,x,y+s);
  grad.addColorStop(0,"#d97a52"); grad.addColorStop(0.55,"#c25f3d"); grad.addColorStop(1,"#9c4930");

  ctx.strokeStyle="rgba(255,255,255,0.28)"; ctx.lineWidth=1.5;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,10); ctx.stroke();
  // Holzbalken-Dach oben
  const roofGrad = ctx.createLinearGradient(x,y-s-4,x,y-s+6);
  roofGrad.addColorStop(0,"#6a4326"); roofGrad.addColorStop(1,"#4a2e18");
  drawRoundRect(x-s-2,y-s-4,s*2+4,10,4,roofGrad);
  ctx.strokeStyle="#2e1c10"; ctx.lineWidth=1.2; ctx.strokeRect(x-s-2,y-s-4,s*2+4,10);
  for(let i=-2;i<=2;i++){ ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.moveTo(x+i*10,y-s-4); ctx.lineTo(x+i*10,y-s+6); ctx.stroke(); }
  // Rundbogen-Eingang mit warmem Licht
  const doorGrad = ctx.createRadialGradient(x,y+18,1,x,y+16,14);
  doorGrad.addColorStop(0,"#ffdf9c"); doorGrad.addColorStop(1,"#c9822f");
  ctx.beginPath(); ctx.arc(x,y+10,10,Math.PI,0); ctx.lineTo(x+10,y+22); ctx.lineTo(x-10,y+22); ctx.closePath();
  ctx.fillStyle=doorGrad; ctx.fill();
  ctx.strokeStyle="#5a2f14"; ctx.lineWidth=1.6; ctx.stroke();
  // Fenster links/rechts
  ["#bfe6f2"].forEach(()=>{
    drawRoundRect(x-s+7,y-6,8,9,2,"#bfe6f2"); ctx.strokeStyle="#5a2f14"; ctx.lineWidth=1.2; ctx.strokeRect(x-s+7,y-6,8,9);
    drawRoundRect(x+s-15,y-6,8,9,2,"#bfe6f2"); ctx.strokeRect(x+s-15,y-6,8,9);
  });
  // Wehende Fahne
  const t = performance.now()/1000;
  const wave = Math.sin(t*3)*2.5;
  ctx.strokeStyle="#3a1f14"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y-s-4); ctx.lineTo(x,y-s-22); ctx.stroke();
  ctx.fillStyle="#f2c94c";
  ctx.beginPath();
  ctx.moveTo(x,y-s-22);
  ctx.quadraticCurveTo(x+9+wave,y-s-19,x+15,y-s-16);
  ctx.quadraticCurveTo(x+9-wave,y-s-15,x,y-s-12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#c9962a"; ctx.lineWidth=1; ctx.stroke();

  ctx.fillStyle="#fff"; ctx.font="700 11px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=3;
  ctx.strokeText("Lv "+state.basisLevel, x, y+34);
  ctx.fillText("Lv "+state.basisLevel, x, y+34);
  ctx.textAlign="left";
  drawHpBar(x, y+40, state.baseHp, maxBaseHp(), 44);
}

function drawDestroyedOverlay(x,y){
  const s=25;
  ctx.save();
  // Verkohlter Schutthaufen statt Gebaeude - kein Kreuz aus zwei Linien mehr.
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = "#1c1712";
  ctx.beginPath(); ctx.ellipse(x,y+7,s*0.95,s*0.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Unregelmaessige Trümmerbrocken (Balken/Steine), verstreut statt symmetrisch.
  ctx.fillStyle = "#332822";
  [[-12,3,7,-0.3],[7,7,6,0.55],[-2,-3,5,0.1],[13,-1,5,-0.45]].forEach(([dx,dy,rr,rot])=>{
    ctx.save();
    ctx.translate(x+dx,y+dy);
    ctx.rotate(rot);
    ctx.fillRect(-rr,-rr*0.5,rr*2,rr);
    ctx.restore();
  });

  // Ein paar Glutreste zwischen dem Schutt.
  ctx.fillStyle = "#ff8a3d"; ctx.globalAlpha = 0.85;
  [[-6,-1,1.6],[9,4,1.3],[1,-6,1.2]].forEach(([dx,dy,rr])=>{
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Duenner Rauch, der nach oben zieht.
  ctx.strokeStyle = "rgba(190,190,190,0.4)"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-4,y-6); ctx.quadraticCurveTo(x-11,y-18,x-4,y-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+6,y-4); ctx.quadraticCurveTo(x+13,y-16,x+6,y-28); ctx.stroke();
  ctx.restore();
}

function drawBuildingSprite(x,y,building){
  if(building.type==="turm") drawTowerSprite(x,y,building);
  else if(building.type==="mauer") drawWallSprite(x,y,building);
  else if(building.type==="kaserne") drawKaserneSprite(x,y,building);
  else if(building.type==="krankenhaus") drawKrankenhausSprite(x,y,building);
  else if(building.type==="lager") drawLagerSprite(x,y,building);
  else if(building.type==="wachturm") drawWachturmSprite(x,y,building);
  else if(building.type==="handelsposten") drawHandelspostenSprite(x,y,building);
  if(building.hp<=0) drawDestroyedOverlay(x,y);
}

function drawRepairIndicator(gridSize){
  if(!state.repairJob) return;
  const slot = state.cellsByCoord[state.repairJob.key];
  if(!slot || !slot.building) return;
  const [c,r] = state.repairJob.key.split(",").map(Number);
  const p = cellCenter(c,r,gridSize);
  const t = performance.now()/1000;
  const progress = Math.max(0, Math.min(1, 1-(state.repairJob.timeLeft/state.repairJob.totalTime)));
  const ix = p.x+20, iy = p.y-26+Math.sin(t*4)*3;

  // Fortschrittsring, damit ein Abschluss nie "aus dem Nichts" kommt
  ctx.beginPath(); ctx.arc(ix,iy,11,0,Math.PI*2);
  ctx.fillStyle="rgba(15,25,35,0.6)"; ctx.fill();
  ctx.beginPath(); ctx.arc(ix,iy,11,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
  ctx.strokeStyle="#6ad46a"; ctx.lineWidth=2.5; ctx.stroke();

  ctx.save();
  ctx.translate(ix, iy);
  ctx.rotate(Math.sin(t*3)*0.3);
  ctx.strokeStyle="#f2c94c"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-5,5); ctx.lineTo(5,-5); ctx.stroke();
  ctx.beginPath(); ctx.arc(5,-5,3.2,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function findBuildingSlotByType(type){
  for(const [key,slot] of Object.entries(state.cellsByCoord)){
    if(slot.building && slot.building.type===type){
      const [c,r] = key.split(",").map(Number);
      return {c,r};
    }
  }
  return null;
}

function drawAngreiferUnits(gridSize){
  const active = state.npc.angreifer.filter(a=>a.status==="aktiv");
  const n = active.length;
  active.forEach((a,i)=>{
    const ang = (i/Math.max(n,1))*Math.PI*2 - Math.PI/2;
    const x = Math.cos(ang)*46, y = Math.sin(ang)*46;
    drawShadow(x,y+10,11,3);
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle="#4a8f5a"; ctx.fill();
    ctx.strokeStyle="#204a2c"; ctx.lineWidth=1.8; ctx.stroke();
    // kleiner Bogen als Erkennungsmerkmal, damit sie nicht wie beliebige Punkte wirken
    ctx.strokeStyle="#eafff0"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(x+3,y,4.5,-0.9,0.9); ctx.stroke();
    drawHpBar(x,y-18,a.hp,a.maxHp,18);
  });

  // Verletzte liegen sichtbar beim Krankenhaus, mit Heil-Fortschrittsring,
  // statt einfach unsichtbar zu sein
  const verletzt = state.npc.angreifer.filter(a=>a.status==="verletzt");
  if(verletzt.length>0){
    const kSlot = findBuildingSlotByType("krankenhaus");
    if(kSlot){
      const p = cellCenter(kSlot.c, kSlot.r, gridSize);
      const totalHeal = healTimeFor();
      verletzt.forEach((a,i)=>{
        const x = p.x-24+i*16, y = p.y+34;
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.ellipse(x,y,8,5,0,0,Math.PI*2);
        ctx.fillStyle="#8a3a3a"; ctx.fill();
        ctx.globalAlpha = 1;
        const ratio = Math.max(0, Math.min(1, 1-(a.healLeft/totalHeal)));
        ctx.beginPath(); ctx.arc(x,y-9,5,-Math.PI/2,-Math.PI/2+Math.PI*2*ratio);
        ctx.strokeStyle="#6ad46a"; ctx.lineWidth=2; ctx.stroke();
      });
    }
  }
}

function drawFloatBase(x,y){
  // Kleines Holzfloss, auf dem die Ressource treibt - mit sanftem Schaukeln
  const t = performance.now()/1000;
  const bob = Math.sin(t*1.6+x*0.01)*1.6;
  drawShadow(x,y+18,17,5);
  const raftGrad = ctx.createRadialGradient(x-6,y-6+bob,3,x,y+bob,23);
  raftGrad.addColorStop(0,"#3a7a92"); raftGrad.addColorStop(1,"#1c4a5f");
  ctx.beginPath(); ctx.arc(x,y+bob,22,0,Math.PI*2);
  ctx.fillStyle=raftGrad; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.15)"; ctx.lineWidth=1.4; ctx.stroke();
  return bob;
}

function drawLogNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.45 : 1;
  const bob = drawFloatBase(x,y);
  y += bob;
  ["#7a4c2a","#a06d3f"].forEach((col,i)=>{
    const logGrad = ctx.createLinearGradient(x,y-4+i*7,x,y+2+i*7);
    logGrad.addColorStop(0, shadeColor(col,25)); logGrad.addColorStop(1, col);
    drawRoundRect(x-15, y-4+i*7, 30, 6, 3, logGrad);
    ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=0.8; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-15,y-4+i*7,30,6,3); ctx.stroke();
    ["#5a3a1f","#c9a06a"].forEach((rc,ri)=>{
      ctx.beginPath(); ctx.arc(x-13,y-1+i*7,2-ri*0.7,0,Math.PI*2); ctx.fillStyle=rc; ctx.fill();
      ctx.beginPath(); ctx.arc(x+13,y-1+i*7,2-ri*0.7,0,Math.PI*2); ctx.fill();
    });
  });
  ctx.globalAlpha = 1;
  // Fuellstand-Ring
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#c99a5a"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  ctx.fillStyle="#fff"; ctx.font="700 10px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2.5; ctx.strokeText(node.amount, x, y+22);
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawRockNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.45 : 1;
  const bob = drawFloatBase(x,y);
  y += bob;
  [[-7,3,9,"#8a929a"],[6,4,8,"#6a7278"],[0,-5,7,"#c4cdd4"]].forEach(([dx,dy,rr,col])=>{
    const rg = ctx.createRadialGradient(x+dx-rr*0.3,y+dy-rr*0.3,rr*0.15,x+dx,y+dy,rr);
    rg.addColorStop(0, shadeColor(col,35)); rg.addColorStop(1, shadeColor(col,-15));
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2);
    ctx.fillStyle=rg; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1.2; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#b7c2cf"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  ctx.fillStyle="#fff"; ctx.font="700 10px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2.5; ctx.strokeText(node.amount, x, y+22);
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

// ================= HUD-Designsystem =================
// Ein Panelstil fuer alles: gleiche Eckenradien, eine Flaechenfarbe, ein
// Schatten - statt vieler einzelner Chips mit je eigenem Glas-/Gold-Look
// (die alte Version kopierte 1:1 ein Referenzfoto eines anderen Spiels).
// Bewusst flach (keine Verlaeufe/Bevel mehr in den UI-Elementen), damit
// die UI klar und modern von der texturierten Spielwelt absticht.
// Zweiter Anlauf: der erste war zu flach/karg ("noch schlimmer als
// vorher"). Jetzt mit weichen Farbverlaengen statt reiner Vollfarbe (das
// ist der Unterschied zwischen "billig" und "hochwertig", OHNE deshalb
// fotorealistisch zu werden), einer warmen Lichtkante am Panel und einem
// Layout, das strukturell keine Textkollisionen mehr zulaesst: eine
// EINZELNE durchgehende Leiste (Spieler | Trennlinie | Waehrungen) statt
// zwei separater Panels, die sich mit dem Wellen-Pill um Platz stritten.
// Dritter Anlauf: die mitgeschickten Referenzbilder zeigen frei
// schwebende Pillen direkt auf dem Hintergrund - ein Charakterportrait
// mit Level-Plakette, Name, dicker gelb-gruener EXP-Leiste und einer
// Kraft-Plakette darunter (Sword x Staff), plus einzelne
// Waehrungs-Pillen mit farbigem Icon-Kreis (zweite Referenz). Kein
// grosses umschliessendes Rechteck-Panel mehr - jedes Element traegt
// jetzt seinen eigenen Schatten statt eines gemeinsamen Panel-Schattens.
const HUD = {
  pill:        "rgba(15,21,30,0.62)",
  pillBorder:  "rgba(255,255,255,0.16)",
  track:       "rgba(10,14,20,0.55)",
  text:        "#f7f9fb",
  textDim:     "rgba(247,249,251,0.68)",
  xpA:         "#eef27a",
  xpB:         "#9ed13a",
  accentA:     "#6bf0d2",
  accentB:     "#18a98f",
  accentText:  "#053327",
  dangerA:     "#f07872",
  dangerB:     "#a5332f",
  dangerText:  "#3a0d0f",
  coinA: "#ffe08a", coinB: "#e8a83c",
  gemA:  "#a3e6ff", gemB:  "#2f9fe0",
  woodA: "#dba169", woodB: "#8a5a34",
  stoneA:"#c9d0d7", stoneB:"#7c8590",
  ironA: "#b7c2d6", ironB: "#4d5768",
  kraftA:"#ffb46a", kraftB:"#e0642e"
};

// Schatten + Rand fuer eine frei schwebende Pille - jedes HUD-Element
// bekommt das jetzt einzeln statt eines gemeinsamen Panel-Hintergrunds.
function pillBg(x,y,w,h,fill){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.4)"; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  drawRoundRect(x,y,w,h,h/2,fill);
  ctx.restore();
  ctx.strokeStyle=HUD.pillBorder; ctx.lineWidth=1;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,h/2); ctx.stroke();
}

// Pill sizt sich an seinen Text an, statt eine feste Breite in eine
// schmale Luecke zu zwingen - genau das hat vorher zur Kollision mit den
// Waehrungs-Icons gefuehrt. Gibt seine Grenzen zurueck, damit Folge-UI
// (Wellen-Vorschau) sich sauber darunter einreiht.
function drawStatusPill(cx,y,fillA,fillB,textColor,drawIcon,text){
  ctx.font="700 13px sans-serif";
  const tw = ctx.measureText(text).width;
  const w = tw+46, h = 32;
  const x = cx-w/2;
  const g = ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,fillA); g.addColorStop(1,fillB);
  pillBg(x,y,w,h,g);
  ctx.save(); ctx.translate(x+18,y+h/2); drawIcon(); ctx.restore();
  ctx.fillStyle=textColor; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+32, y+h/2+1);
  ctx.textBaseline="alphabetic";
  return {x,y,w,h};
}

// Portrait-Kreis mit generischer Silhouette statt Zahlenscheibe - naeher
// an einem RPG-Charakterportrait wie in der Referenz, aber als klares
// flaches Icon statt eines gemalten Gesichts (kein Fotorealismus, keine
// echten Charakter-Assets vorhanden).
function drawAvatarPortrait(cx,cy,r){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.4)"; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  const bg = ctx.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.1,cx,cy,r);
  bg.addColorStop(0,"#4a5fb8"); bg.addColorStop(1,"#20265a");
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,0.8)"; ctx.lineWidth=2; ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.94,0,Math.PI*2); ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.88)";
  ctx.beginPath(); ctx.arc(cx,cy-r*0.16,r*0.34,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy+r*1.1,r*0.66,Math.PI,0); ctx.fill();
  ctx.restore();
}

// Level-Plakette haengt unten am Portrait-Ring, wie in der Referenz -
// dunkle Pille statt farbiger Zahlenscheibe.
function drawLevelBadge(cx,y,level){
  ctx.font="800 12px sans-serif";
  const tw = ctx.measureText(String(level)).width;
  const w = Math.max(26,tw+16), h = 18;
  const x = cx-w/2;
  pillBg(x,y,w,h,"rgba(10,13,20,0.92)");
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(level, cx, y+h/2+1);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

// Grosse Zahlen (Kraft kann mit vielen Gebaeuden/NPCs schnell vierstellig
// werden) als 16K/1.2M statt einer langen Ziffernkette.
function formatCompactNumber(v){
  if(v>=1000000) return (v/1000000).toFixed(v%1000000===0?0:1)+"M";
  if(v>=1000) return (v/1000).toFixed(v%1000===0?0:1)+"K";
  return String(v);
}

// Kraeftige, gesaettigte Gelb-Gruen-Leiste - die klassische RPG-EXP-Farbe
// aus der Referenz, statt einer duennen neutralen Leiste.
function drawExpBar(x,y,w,h,ratio){
  pillBg(x,y,w,h,HUD.track);
  const rr = Math.max(0,Math.min(1,ratio));
  if(rr>0.03){
    const g = ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,HUD.xpB); g.addColorStop(1,HUD.xpA);
    drawRoundRect(x+1.5,y+1.5,Math.max(0,w*rr-3),h-3,(h-3)/2,g);
  }
}

// Kraft als eigene dunkle Pille mit Icon - wie das "16K"-Abzeichen unter
// der EXP-Leiste in der Referenz, statt eines unauffaelligen Inline-Texts.
function drawKraftBadge(x,y,value){
  ctx.font="800 11.5px sans-serif";
  const text = formatCompactNumber(value);
  const tw = ctx.measureText(text).width;
  const h = 20, w = h+tw+14;
  pillBg(x,y,w,h,"rgba(10,13,20,0.85)");
  ctx.save(); ctx.translate(x+h/2,y+h/2); drawKraftIcon(h*0.34); ctx.restore();
  ctx.fillStyle=HUD.text; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+h*0.85, y+h/2+1);
  ctx.textBaseline="alphabetic";
  return w;
}

// Waehrungs-Pille: farbiges Icon + fette Zahl auf einer schwebenden
// dunklen Kapsel - 1:1 der Stil aus der zweiten Referenz.
function drawCurrencyPill(x,y,drawIconFn,iconR,text){
  ctx.font="800 13px sans-serif";
  const tw = ctx.measureText(text).width;
  const h = iconR*2+10, w = h+tw+10;
  pillBg(x,y,w,h,HUD.pill);
  ctx.save(); ctx.translate(x+h/2,y+h/2); drawIconFn(iconR); ctx.restore();
  ctx.fillStyle=HUD.text; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+h*0.92, y+h/2+1);
  ctx.textBaseline="alphabetic";
  return w;
}

// Fuellstands-Pille: der Balken selbst fuellt sich mit dem Fortschritt zur
// Lagerkapazitaet, mit weichem Materialverlauf statt Vollfarbe.
function drawStorageBar(x,y,w,h,current,cap,iconR,drawIconFn,colorA,colorB,text){
  pillBg(x,y,w,h,HUD.track);
  const ratio = Math.max(0, Math.min(1, cap>0 ? current/cap : 0));
  if(ratio>0.03){
    const g = ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,colorB); g.addColorStop(1,colorA);
    drawRoundRect(x+1.5,y+1.5,Math.max(0,w*ratio-3),h-3,(h-3)/2,g);
  }
  ctx.fillStyle=HUD.text; ctx.font="700 10.5px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.fillText(text, x+w-8, y+h/2+1);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.save(); ctx.translate(x+iconR*0.85, y+h/2); drawIconFn(iconR*0.75); ctx.restore();
}

function drawStarIcon(r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const ang=-Math.PI/2+i*(Math.PI*2/5);
    const ang2=ang+Math.PI/5;
    ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
    ctx.lineTo(Math.cos(ang2)*r*0.42,Math.sin(ang2)*r*0.42);
  }
  ctx.closePath();
  ctx.fillStyle="#4fa8e8"; ctx.fill();
}

// Ressourcen-Icons: weicher, kleiner Materialverlauf statt reiner
// Vollfarbe UND statt der fruehreren dicken Bevel-Umrisse - lesbar aus
// der Distanz, spuerbar hochwertiger, aber kein Fotorealismus.
function drawCoinIcon(r){
  const g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.15,0,0,r);
  g.addColorStop(0,HUD.coinA); g.addColorStop(1,HUD.coinB);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="rgba(110,68,10,0.4)"; ctx.lineWidth=1; ctx.stroke();
}

function drawGemIcon(r){
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r*0.85,-r*0.15); ctx.lineTo(r*0.4,r);
  ctx.lineTo(-r*0.4,r); ctx.lineTo(-r*0.85,-r*0.15); ctx.closePath();
  const g = ctx.createLinearGradient(0,-r,0,r);
  g.addColorStop(0,HUD.gemA); g.addColorStop(1,HUD.gemB);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="rgba(20,60,95,0.4)"; ctx.lineWidth=1; ctx.stroke();
}

function drawLogIcon(r){
  const g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.15,0,0,r);
  g.addColorStop(0,HUD.woodA); g.addColorStop(1,HUD.woodB);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
}

function drawStoneIcon(r){
  const g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.15,0,0,r);
  g.addColorStop(0,HUD.stoneA); g.addColorStop(1,HUD.stoneB);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
}

function drawKraftIcon(r){
  const g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.15,0,0,r);
  g.addColorStop(0,HUD.kraftA); g.addColorStop(1,HUD.kraftB);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
}

function drawPlayerLevelUpFx(cx,y){
  if(!playerLevelUpFx) return;
  const elapsed = performance.now()-playerLevelUpFx.startedAt;
  if(elapsed>=LEVELUP_FX_DURATION){ playerLevelUpFx = null; return; }
  const t = elapsed/LEVELUP_FX_DURATION;
  const rise = t*14, alpha = t<0.15 ? t/0.15 : 1-((t-0.15)/0.85);
  ctx.save();
  ctx.globalAlpha = Math.max(0,alpha);
  ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  const label = "Level Up! Lv. "+playerLevelUpFx.level;
  ctx.strokeText(label, cx, y+8-rise);
  ctx.fillStyle = "#ffe27a";
  ctx.fillText(label, cx, y+8-rise);
  ctx.restore();
}

// ================= Licht-Akzent =================
// Laeuft ueber die fertige Weltdarstellung (vor dem HUD, damit die UI
// scharf bleibt). Bewusst nur EIN weicher Lichtakzent plus eine sehr
// sanfte Vignette - die fruehere Version stapelte Sonnenlicht, einen
// kuehlen Gegenschatten, eine kraeftige Vignette UND Filmkoernung
// uebereinander und verwaschte damit genau die satten Farben, die hier
// eigentlich gewollt sind. Fuer Atmosphaere reicht deutlich weniger.
function drawLightingPass(){
  // Warmes Licht von oben links
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  const sun = ctx.createRadialGradient(W*0.2, H*0.12, 0, W*0.2, H*0.12, Math.max(W,H)*0.95);
  sun.addColorStop(0,   "rgba(255,241,208,0.38)");
  sun.addColorStop(0.5, "rgba(255,231,192,0.12)");
  sun.addColorStop(1,   "rgba(255,231,192,0)");
  ctx.fillStyle = sun; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Sehr sanfte Vignette nur in den aeussersten Ecken - fuer Fokus, ohne
  // die Szene grau zu ueberziehen.
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const vig = ctx.createRadialGradient(W/2,H*0.45,Math.max(W,H)*0.62, W/2,H*0.45,Math.max(W,H)*0.95);
  vig.addColorStop(0,"rgba(255,255,255,1)");
  vig.addColorStop(1,"rgba(158,168,188,1)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawInGameHud(){
  const pad = 12;

  // ---- Links: Portrait, Level-Plakette, Name, EXP-Leiste, Kraft-Pille -
  // alles frei schwebend statt in einem Panel, wie in der Referenz.
  const { cx:avatarCx, cy:avatarCy, r:avatarR } = avatarHotspot();
  drawAvatarPortrait(avatarCx, avatarCy, avatarR);
  drawLevelBadge(avatarCx, avatarCy+avatarR-9, state.playerLevel);

  const textX = avatarCx+avatarR+10;
  const textW = 118;
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.shadowColor="rgba(0,0,0,0.6)"; ctx.shadowBlur=4;
  ctx.fillStyle=HUD.text;
  let nameSize=13, name=state.playerName;
  ctx.font="800 "+nameSize+"px sans-serif";
  while(nameSize>10 && ctx.measureText(name).width>textW){ nameSize--; ctx.font="800 "+nameSize+"px sans-serif"; }
  while(ctx.measureText(name).width>textW && name.length>1){ name = name.slice(0,-1); ctx.font="800 "+nameSize+"px sans-serif"; }
  if(name!==state.playerName) name = name.replace(/.$/,"…");
  ctx.fillText(name, textX, avatarCy-8);
  ctx.shadowBlur=0;

  const xpRatio = state.playerXp/xpForLevel(state.playerLevel);
  drawExpBar(textX, avatarCy, textW, 10, xpRatio);
  drawKraftBadge(textX, avatarCy+15, computeKraft());
  drawPlayerLevelUpFx(textX+textW/2, avatarCy+avatarR+26);

  // ---- Rechts: Waehrungs-Pillen (Muenzen/Edelsteine), Rohstoff-Leisten
  // darunter - jede Pille schwebt einzeln, wie im zweiten Referenzbild.
  const coinText = String(state.resources.coins), gemText = String(state.resources.gems);
  ctx.font="800 13px sans-serif";
  const coinW = 18+10+ctx.measureText(coinText).width+10;
  const gemW = 18+10+ctx.measureText(gemText).width+10;
  const gemX = W-pad-gemW;
  const coinX = gemX-6-coinW;
  drawCurrencyPill(coinX, pad, drawCoinIcon, 9, coinText);
  drawCurrencyPill(gemX, pad, drawGemIcon, 9, gemText);

  const cap = storageCap();
  const resBarW = Math.max(coinW+gemW+6, 128), resBarH = 16;
  const resX = W-pad-resBarW;
  const row2Y = pad+28+6;
  drawStorageBar(resX, row2Y, resBarW, resBarH, state.resources.holz, cap, 12, drawLogIcon, HUD.woodA, HUD.woodB, state.resources.holz+"/"+cap);
  drawStorageBar(resX, row2Y+resBarH+6, resBarW, resBarH, state.resources.stein, cap, 12, drawStoneIcon, HUD.stoneA, HUD.stoneB, state.resources.stein+"/"+cap);

  // ---- Wellen-Status: eigene Zeile unter beiden Clustern, Breite passt
  // sich dem Text an statt in eine feste Luecke gezwungen zu werden.
  const statusY = Math.max(avatarCy+avatarR+18, row2Y+resBarH*2+6+14);
  let pillBounds;
  if(!state.tutorialDone){
    pillBounds = drawStatusPill(W/2, statusY, HUD.accentA, HUD.accentB, HUD.accentText, ()=>{
      ctx.strokeStyle=HUD.accentText; ctx.lineWidth=2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-5,3); ctx.lineTo(-1,7); ctx.lineTo(6,-5); ctx.stroke();
      ctx.lineCap="butt";
    }, "Aufbau "+tutorialProgressText());
  } else {
    const inCombat = enemies.length>0;
    const waveLabel = inCombat ? enemies.length+" Gegner" : Math.max(0,Math.ceil(state.waveTimer))+"s";
    const fillA = inCombat ? HUD.dangerA : "rgba(30,40,52,0.85)";
    const fillB = inCombat ? HUD.dangerB : "rgba(15,20,28,0.85)";
    const textColor = inCombat ? HUD.dangerText : HUD.text;
    pillBounds = drawStatusPill(W/2, statusY, fillA, fillB, textColor, ()=>{
      ctx.strokeStyle=textColor; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-5); ctx.moveTo(0,0); ctx.lineTo(3,2); ctx.stroke();
    }, waveLabel);

    // Wachturm-Vorschau: zeigt an, was in der naechsten Welle kommt
    if(!inCombat && state.nextWaveComposition){
      const counts = {};
      state.nextWaveComposition.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
      const summary = Object.entries(counts).map(([k,v])=>v+"x "+ENEMY_TYPES[k].name).join(" · ");
      ctx.font="600 10.5px sans-serif";
      const tw = ctx.measureText(summary).width;
      const cx = W/2;
      const py = pillBounds.y+pillBounds.h+6;
      pillBg(cx-tw/2-10, py, tw+20, 20, "rgba(15,20,28,0.85)");
      ctx.fillStyle=HUD.text; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(summary, cx, py+10);
      ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    }
  }
}

function render(){
  questBtnEl.classList.toggle("hasReward", hasClaimableReward());

  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(camera.scale, camera.scale);
  ctx.translate(-camera.x, -camera.y);

  drawWater();
  drawIslandBase(gridSize);

  // Gras wird an die organische Kuestenlinie geclippt - so enden die
  // quadratischen Felder nicht in einer harten Kante, sondern laufen an
  // den Ecken in den Strand aus.
  ctx.save();
  traceIslandPath(gridHalfExtent(gridSize)+14, 13, 4.4);
  ctx.clip();
  list.forEach(([c,r])=>{ const p=cellCenter(c,r,gridSize); drawGrassTile(p.x,p.y,c,r); });
  { const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize); drawGrassTile(p.x,p.y,0,0); }
  // Kante abdunkeln, damit das Gras zum Wasser hin abfaellt statt flach
  // abzubrechen
  const gHalf = gridHalfExtent(gridSize);
  const toEdge = ctx.createRadialGradient(0,0,gHalf*0.88, 0,0,gHalf+16);
  toEdge.addColorStop(0,"rgba(20,50,26,0)");
  toEdge.addColorStop(1,"rgba(20,50,26,0.3)");
  ctx.fillStyle = toEdge; ctx.fillRect(-gHalf-40,-gHalf-40,(gHalf+40)*2,(gHalf+40)*2);
  ctx.restore();

  drawHafen(gridSize);

  list.forEach(([c,r])=>{
    const p = cellCenter(c,r,gridSize);
    const slot = state.cellsByCoord[c+","+r] || {unlocked:false,building:null};
    if(slot.building) drawBuildingSprite(p.x,p.y,slot.building);
    else if(!slot.unlocked) drawLockedButton(p.x,p.y);
    else drawPlusButton(p.x,p.y);
  });

  // Wasser-Ressourcenknoten
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    const p = nodeWorldPos(n);
    if(def.type==="holz") drawLogNode(p.x,p.y,n,def); else drawRockNode(p.x,p.y,n,def);
  });

  // Base in der Mitte
  {
    const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize);
    drawBaseSprite(p.x,p.y);
  }

  drawAngreiferUnits(gridSize);
  drawRepairIndicator(gridSize);
  drawPlayerSprite();
  drawDepositFx();
  drawKnockoutFx();

  projectiles.forEach(drawProjectile);
  enemies.forEach(drawEnemy);

  if(moveSource){
    const p = cellCenter(moveSource.c, moveSource.r, gridSize);
    drawTutorialHighlight(p.x, p.y, "Zielfeld antippen");
  }

  const tut = nextTutorialTarget();
  if(tut){
    let tp;
    if(tut.kind==="cell") tp = cellCenter(tut.c,tut.r,gridSize);
    else {
      const n = tut.node || state.nodes.find(x=>x.amount>0) || state.nodes[0];
      tp = nodeWorldPos(n);
    }
    drawTutorialHighlight(tp.x, tp.y, tut.label);
  }

  ctx.restore();
  drawLightingPass();
  drawInGameHud();
}

// Waehrend "Verschieben" aktiv ist, wartet der naechste Tap auf ein Zielfeld
// statt normal ein Menue zu oeffnen.
let moveSource = null;

function handleTap(wx,wy,isMouseClick){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const c0 = centerOf(gridSize);

  if(moveSource){
    const c = Math.round(wx/CELL + c0);
    const r = Math.round(wy/CELL + c0);
    const srcSlot = state.cellsByCoord[moveSource.c+","+moveSource.r];
    const validTarget = c>=0 && c<gridSize && r>=0 && r<gridSize && !(c===c0 && r===c0) && !(c===moveSource.c && r===moveSource.r);
    if(validTarget && srcSlot && srcSlot.building){
      const destSlot = state.cellsByCoord[c+","+r];
      const req = requiredTypeForCell(c,r);
      const destOk = destSlot && destSlot.unlocked && !destSlot.building && (!req || req===srcSlot.building.type);
      if(destOk){
        destSlot.building = srcSlot.building;
        srcSlot.building = null;
        save();
      }
    }
    moveSource = null;
    render();
    return;
  }

  const c = Math.round(wx/CELL + c0);
  const r = Math.round(wy/CELL + c0);
  if(c<0||c>=gridSize||r<0||r>=gridSize){
    // Ausserhalb der Insel (Wasser): fuer Maus-Klicks (Desktop-Testkomfort
    // neben WASD) laeuft der Spieler direkt dorthin, wie beim Joystick.
    if(isMouseClick) state.player.moveTarget = { x:wx, y:wy, nodeId:null };
    return;
  }
  if(c===c0 && r===c0){ openBasisMenu(); return; }
  openBuildMenu(c,r);
}

function relocateNode(n){
  // an eine neue Stelle im Wasser versetzen, mit Abstand zu den anderen Knoten
  let tries=0, angle;
  do { angle = Math.random()*360; tries++; }
  while(tries<10 && state.nodes.some(o=>o!==n && Math.abs(((o.angle-angle+540)%360)-180)<35));
  n.angle = angle;
}

const PLAYER_SPEED = 130;       // px/s - deutlich schneller als jeder Gegner
const BACKPACK_CAPACITY = 40;   // Gesamt an Holz+Stein, die der Spieler gleichzeitig tragen kann
const PLAYER_ARRIVE_RADIUS = 22;
const BASE_DEPOSIT_RADIUS = 40;

function backpackTotal(){ return state.player.backpack.holz + state.player.backpack.stein; }

const JOYSTICK_DEADZONE = 0.15; // kleine Ausschläge ignorieren, damit er nicht zittert

// Beim manuellen Steuern per Joystick gibt es kein "Tap-Ziel" mit fester
// Knoten-ID mehr - stattdessen wird im Vorbeilaufen eingesammelt, sobald
// der Spieler nah genug an einem Knoten mit Inhalt ist.
function collectNearbyNode(pl){
  let closest=null, closestDist=PLAYER_ARRIVE_RADIUS*(1+abilityScaled("sammelradius",1.5))*sammelradiusMult();
  state.nodes.forEach(n=>{
    if(n.amount<=0) return;
    const p = nodeWorldPos(n);
    const d = Math.hypot(p.x-pl.x, p.y-pl.y);
    if(d<closestDist){ closestDist=d; closest=n; }
  });
  if(!closest) return;
  const def = WATER_NODE_DEFS.find(d=>d.id===closest.id);
  const room = playerBackpackCapacity() - backpackTotal();
  const take = Math.min(closest.amount, room);
  if(take>0){
    pl.backpack[def.type] += take;
    closest.amount -= take;
    if(closest.amount<=0){
      relocateNode(closest);
      state.tutorialCollected = true;
      checkTutorial();
    }
    save();
  }
}

function updatePlayer(dt){
  const pl = state.player;
  const joyLen = Math.hypot(joystickDir.x, joystickDir.y);
  const kDir = keyboardDir();
  const kLen = Math.hypot(kDir.x, kDir.y);
  const useJoy = joyLen>JOYSTICK_DEADZONE;
  const useKey = !useJoy && kLen>0;
  if(useJoy || useKey){
    // Manuelle Steuerung per Joystick oder Tastatur geht vor - bricht ein per
    // Tap/Klick gesetztes Auto-Ziel ab, der Spieler bestimmt direkt die Richtung.
    pl.moveTarget = null;
    const dir = useJoy ? joystickDir : kDir;
    const len = useJoy ? joyLen : kLen;
    const speedMult = useJoy ? Math.min(1, joyLen) : 1;
    pl.x += (dir.x/len)*PLAYER_SPEED*playerSpeedMult()*speedMult*dt;
    pl.y += (dir.y/len)*PLAYER_SPEED*playerSpeedMult()*speedMult*dt;
    collectNearbyNode(pl);
  } else if(pl.moveTarget){
    const dx = pl.moveTarget.x-pl.x, dy = pl.moveTarget.y-pl.y;
    const dist = Math.hypot(dx,dy);
    if(dist>PLAYER_ARRIVE_RADIUS){
      const ang = Math.atan2(dy,dx);
      pl.x += Math.cos(ang)*PLAYER_SPEED*playerSpeedMult()*dt;
      pl.y += Math.sin(ang)*PLAYER_SPEED*playerSpeedMult()*dt;
    } else {
      if(pl.moveTarget.nodeId){
        const node = state.nodes.find(n=>n.id===pl.moveTarget.nodeId);
        if(node && node.amount>0){
          const def = WATER_NODE_DEFS.find(d=>d.id===node.id);
          const room = playerBackpackCapacity() - backpackTotal();
          const take = Math.min(node.amount, room);
          if(take>0){
            pl.backpack[def.type] += take;
            node.amount -= take;
            if(node.amount<=0){
              relocateNode(node);
              state.tutorialCollected = true;
              checkTutorial();
            }
          }
        }
      }
      pl.moveTarget = null;
      // Rucksack voll -> automatisch zur Base zurücklaufen, statt extra Klick
      if(backpackTotal()>=playerBackpackCapacity()){
        pl.moveTarget = { x:0, y:0, nodeId:null };
      }
      save();
    }
  }
  // In der Naehe der Base automatisch entleeren
  if(backpackTotal()>0 && Math.hypot(pl.x,pl.y)<=BASE_DEPOSIT_RADIUS){
    const cap = storageCap();
    state.resources.holz = Math.min(cap, state.resources.holz+pl.backpack.holz);
    state.resources.stein = Math.min(cap, state.resources.stein+pl.backpack.stein);
    addQuestProgress("collect", pl.backpack.holz+pl.backpack.stein);
    depositFx = { holz: pl.backpack.holz, stein: pl.backpack.stein, startedAt: performance.now() };
    pl.backpack.holz = 0; pl.backpack.stein = 0;
    save();
  }
}

function requiredTypeForCell(c,r){
  if(state.tutorialDone) return null;
  const t = tutorialTargets();
  if(t.towers.some(([tc,tr])=>tc===c&&tr===r)) return "turm";
  if(t.walls.some(([tc,tr])=>tc===c&&tr===r)) return "mauer";
  return null;
}

function openBasisMenu(){
  const overlay = document.createElement("div");
  overlay.className="buildmenu";
  const box = document.createElement("div");
  box.className="box";
  box.innerHTML = `<h3>Base</h3><div class="hint2">Level ${state.basisLevel}</div>`;

  if(!state.tutorialDone){
    box.innerHTML += `<div class="hint2">Baue zuerst deine Grundverteidigung fertig (${tutorialProgressText()}), bevor du die Base verbessern kannst.</div>`;
  } else {
    const cost = basisUpgradeCost(state.basisLevel);
    const opt = document.createElement("div");
    opt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
    opt.innerHTML = `<span>Verbessern auf Level ${state.basisLevel+1}<small>${nextLevelDescription()}</small></span><b>${formatCost(cost)}</b>`;
    opt.addEventListener("click", ()=>{
      if(upgradeBasis()){ document.body.removeChild(overlay); render(); }
    });
    box.appendChild(opt);
  }
  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// Kurze, sich selbst entfernende Hinweis-Meldung oben am Bildschirm -
// fuer Feedback wie die Coin-Erstattung beim Kombinieren, das keinen
// eigenen Dialog braucht.
function showToast(text){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{
    el.classList.remove("show");
    setTimeout(()=>el.remove(), 300);
  }, 1800);
}

// Kleiner Auswahl-Dialog fuer einen LEEREN Faehigkeiten-Slot im Ring -
// listet nur noch eigene (bereits im Shop gezogene, noch nicht aktive)
// Faehigkeiten. Freies Direktkaufen gibt es nicht mehr - neue Faehigkeiten
// kommen nur noch zufaellig aus der Kiste im Shop (wie Ausruestung).
// Wird ueber dem Profil-Hub eingeblendet, schliesst sich selbst und ruft
// onPick(key) nach einer gueltigen Auswahl auf.
function openAbilityPicker(onPick){
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>Fähigkeit wählen</h3>`;

  const equipped = state.player.abilitiesEquipped;
  const ownedKeys = [...new Set(state.player.abilitiesInventory.map(a=>a.key))];
  const pickable = ownedKeys.filter(key=>!equipped[key]);

  if(pickable.length===0){
    const empty = document.createElement("div");
    empty.className = "hint2";
    empty.textContent = "Noch keine freie Fähigkeit - im Shop ziehen (🛒-Knopf am Bildschirmrand).";
    box.appendChild(empty);
  }

  pickable.forEach(key=>{
    const def = ABILITY_DEFS[key];
    const best = state.player.abilitiesInventory.filter(a=>a.key===key)
      .sort((a,b)=> gearPower(b.rarity,b.level,b.stars)-gearPower(a.rarity,a.level,a.stars))[0];
    const rInfo = RARITY_INFO[best.rarity];
    const opt = document.createElement("div");
    opt.className = "buildopt";
    opt.innerHTML = `<span>${def.icon} ${def.name}<small>${def.desc}</small></span><b style="color:${rInfo.color}">${rInfo.name}</b>`;
    opt.addEventListener("click", ()=>{ document.body.removeChild(overlay); onPick(key); });
    box.appendChild(opt);
  });

  // Eigenes onClose statt Standard: der Aufrufer hat das Profil-Hub bereits
  // geschlossen, ohne Rueckkehr wuerde Schliessen sonst im Nichts enden.
  addCloseBtn(box, overlay, ()=>{ document.body.removeChild(overlay); openProfileHub("abilities"); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function formatReward(reward){
  const parts = [];
  if(reward.coins) parts.push(`🪙 ${reward.coins}`);
  if(reward.gems) parts.push(`💎 ${reward.gems}`);
  if(reward.holz) parts.push(`🪵 ${reward.holz}`);
  if(reward.stein) parts.push(`🪨 ${reward.stein}`);
  return parts.join(" · ");
}

// Aufgaben-Panel: taegliche Quests oben, Kapitel darunter - beide mit
// Fortschritt und einem Abholen-Knopf, sobald erfuellt (siehe
// DAILY_QUEST_DEFS/CHAPTER_DEFS und hasClaimableReward()).
function openQuestPanel(){
  ensureDailyQuestsCurrent();
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>📜 Aufgaben</h3><div class="hint2">Tägliche Aufgaben setzen sich jeden Tag neu zusammen. Kapitel schaltest du dauerhaft frei.</div>`;

  const questLabel = document.createElement("div");
  questLabel.className = "sectionLabel";
  questLabel.textContent = "📅 Tägliche Aufgaben";
  box.appendChild(questLabel);

  DAILY_QUEST_DEFS.forEach(def=>{
    const prog = Math.min(questProgress(def.key), def.goal);
    const claimed = state.dailyQuests.claimed.includes(def.key);
    const claimable = questClaimable(def);
    const row = document.createElement("div");
    row.className = "buildopt" + (!claimable ? " disabled" : "");
    row.innerHTML = `<span>${def.icon} ${def.name}<small>${def.desc} · ${prog}/${def.goal}</small></span><b>${claimed ? "✓" : (claimable ? "Abholen" : formatReward(def.reward))}</b>`;
    if(claimable){
      row.addEventListener("click", ()=>{ claimDailyQuest(def.key); refresh(); });
    }
    box.appendChild(row);
  });

  const chapterLabel = document.createElement("div");
  chapterLabel.className = "sectionLabel";
  chapterLabel.textContent = "📖 Kapitel";
  box.appendChild(chapterLabel);

  CHAPTER_DEFS.forEach(def=>{
    const done = def.isDone();
    const claimed = state.claimedChapters.includes(def.id);
    const claimable = chapterClaimable(def);
    const row = document.createElement("div");
    row.className = "buildopt" + (!claimable ? " disabled" : "");
    row.innerHTML = `<span>${def.icon} ${def.name}<small>${def.desc}</small></span><b>${claimed ? "✓" : (claimable ? "Abholen" : (done ? formatReward(def.reward) : "🔒"))}</b>`;
    if(claimable){
      row.addEventListener("click", ()=>{ claimChapter(def.id); refresh(); });
    }
    box.appendChild(row);
  });

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function refresh(){
    document.body.removeChild(overlay);
    openQuestPanel();
  }
}

// Gacha-Shop: zwei Kisten untereinander. Ausruestung (bezahlt mit Coins,
// liefert zufaelligen Slot + Rarität Grau-Lila, Gold aufwaerts nur durchs
// Kombinieren) und Faehigkeiten (bezahlt mit Juwelen, liefert eine
// zufaellige aus dem festen 8er-Pool - kein Direktkauf mehr, siehe
// openAbilityPicker).
function openGearShop(){
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>🛒 Shop</h3>`;

  const gearLabel = document.createElement("div");
  gearLabel.className = "sectionLabel";
  gearLabel.textContent = "🛡️ Ausrüstung";
  box.appendChild(gearLabel);
  const gearHint = document.createElement("div");
  gearHint.className = "hint2";
  gearHint.textContent = "Kiste öffnen für zufällige Ausrüstung (Grau bis Lila). Gold, Türkis und Mystisch gibt es nur durchs Kombinieren.";
  box.appendChild(gearHint);

  const crate = document.createElement("div");
  crate.className = "gearCrate";
  crate.innerHTML = `<div class="crateIcon">🎁</div>`;
  box.appendChild(crate);

  const row = document.createElement("div");
  row.className = "crateBtnRow";
  [[1,PULL_COST_1X],[10,PULL_COST_10X]].forEach(([count,cost])=>{
    const btn = document.createElement("div");
    btn.className = "crateBtn"+(state.resources.coins<cost?" disabled":"");
    btn.innerHTML = `${count}x Ziehen<b>🪙 ${cost}</b>`;
    btn.addEventListener("click", ()=>{
      if(state.resources.coins<cost) return;
      state.resources.coins -= cost;
      const results = [];
      for(let i=0;i<count;i++) results.push(pullGear());
      save();
      document.body.removeChild(overlay);
      showPullResults(results);
    });
    row.appendChild(btn);
  });
  box.appendChild(row);

  const abilityLabel = document.createElement("div");
  abilityLabel.className = "sectionLabel";
  abilityLabel.textContent = "🌟 Fähigkeiten";
  box.appendChild(abilityLabel);
  const abilityHint = document.createElement("div");
  abilityHint.className = "hint2";
  abilityHint.textContent = "Kiste öffnen für eine zufällige Fähigkeit. Bereits besessene geben stattdessen Juwelen zurück.";
  box.appendChild(abilityHint);

  const abilityCrate = document.createElement("div");
  abilityCrate.className = "gearCrate";
  abilityCrate.innerHTML = `<div class="crateIcon">🌟</div>`;
  box.appendChild(abilityCrate);

  const abilityRow = document.createElement("div");
  abilityRow.className = "crateBtnRow";
  [[1,ABILITY_PULL_COST_1X],[10,ABILITY_PULL_COST_10X]].forEach(([count,cost])=>{
    const btn = document.createElement("div");
    btn.className = "crateBtn"+(state.resources.gems<cost?" disabled":"");
    btn.innerHTML = `${count}x Ziehen<b>💎 ${cost}</b>`;
    btn.addEventListener("click", ()=>{
      if(state.resources.gems<cost) return;
      state.resources.gems -= cost;
      const results = [];
      for(let i=0;i<count;i++) results.push(pullAbility());
      save();
      document.body.removeChild(overlay);
      showAbilityPullResults(results);
    });
    abilityRow.appendChild(btn);
  });
  box.appendChild(abilityRow);

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function showPullResults(results){
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>Gezogen!</h3>`;
  const grid = document.createElement("div");
  grid.className = "pullResultGrid";
  results.forEach(item=>{
    const slotInfo = GEAR_SLOT_INFO[item.slot], rInfo = RARITY_INFO[item.rarity];
    const cell = document.createElement("div");
    cell.className = "pullResultCell";
    cell.style.borderColor = rInfo.color;
    cell.innerHTML = `<div class="prIcon">${slotInfo.icon}</div><div class="prRarity" style="color:${rInfo.color}">${rInfo.name}</div>`;
    grid.appendChild(cell);
  });
  box.appendChild(grid);
  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// Slot-Picker: eigene Exemplare dieses Slots (nach Rarität/Power sortiert)
// zum Tragen, Level-/Stern-Aufwerten und Kombinieren (3 gleiche Rarität ->
// 1 der naechsten). Erreichbar ueber einen Ring-Slot im Profil-Hub.
function openGearPicker(slot, returnMode){
  returnMode = returnMode || "equip";
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  const info = GEAR_SLOT_INFO[slot];
  box.innerHTML = `<h3>${info.icon} ${info.name}</h3><div class="hint2">Wirkt auf: ${info.desc}</div>`;

  const equippedId = state.player.gearEquipped[slot];
  const items = state.player.gearInventory.filter(g=>g.slot===slot)
    .sort((a,b)=> rarityIndex(b.rarity)-rarityIndex(a.rarity) || gearPower(b.rarity,b.level,b.stars)-gearPower(a.rarity,a.level,a.stars));

  if(items.length===0){
    const empty = document.createElement("div");
    empty.className = "hint2";
    empty.textContent = "Noch keine Ausrüstung für diesen Slot - im Shop ziehen.";
    box.appendChild(empty);
  }

  // Eigene Exemplare als Icon-Kacheln (3 pro Reihe) statt Textzeilen -
  // antippen oeffnet die Detailseite mit Tragen/Aufwerten (openGearItemDetail).
  if(items.length>0){
    const grid = document.createElement("div");
    grid.className = "gearItemGrid";
    items.forEach(item=>{
      const rInfo = RARITY_INFO[item.rarity];
      const isEquipped = item.id===equippedId;
      const cell = document.createElement("div");
      cell.className = "gearItemCell";
      cell.style.borderColor = rInfo.color;
      cell.innerHTML = `${isEquipped?'<div class="gearItemCheck">✓</div>':""}<div class="prIcon">${info.icon}</div><div class="gearItemLv" style="color:${rInfo.color}">Lv.${item.level}${item.stars>0?" "+"★".repeat(item.stars):""}</div>`;
      cell.addEventListener("click", ()=>{
        document.body.removeChild(overlay);
        openGearItemDetail(item, slot, returnMode);
      });
      grid.appendChild(cell);
    });
    box.appendChild(grid);
  }

  const fuseables = RARITIES.slice(0,-1).filter(r=>items.filter(g=>g.rarity===r && g.id!==equippedId).length>=GEAR_FUSE_COUNT);
  if(fuseables.length>0){
    const label = document.createElement("div");
    label.className = "sectionLabel";
    label.textContent = "Kombinieren";
    box.appendChild(label);
    fuseables.forEach(rarity=>{
      const nextRarity = RARITIES[rarityIndex(rarity)+1];
      const opt = document.createElement("div");
      opt.className = "buildopt";
      opt.innerHTML = `<span>🔀 3x ${RARITY_INFO[rarity].name}<small>Ergibt 1x ${RARITY_INFO[nextRarity].name}</small></span><b>→</b>`;
      opt.addEventListener("click", ()=>{
        const result = fuseGear(slot, rarity);
        save();
        refresh();
        if(result && result.refund>0){
          showToast(`🔀 Kombiniert! +🪙 ${result.refund} Erstattung`);
        } else if(result){
          showToast(`🔀 Kombiniert zu ${RARITY_INFO[nextRarity].name}!`);
        }
      });
      box.appendChild(opt);
    });
  }

  // Eigenes onClose statt Standard: fuehrt zurueck zum Profil-Hub statt im
  // Nichts zu enden (der ist beim Oeffnen des Pickers bereits geschlossen
  // worden).
  addCloseBtn(box, overlay, ()=>{ document.body.removeChild(overlay); openProfileHub(returnMode); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function refresh(){
    document.body.removeChild(overlay);
    openGearPicker(slot, returnMode);
  }
}

// Gemeinsamer grosser Kopf fuer die Detailseiten von Ausruestung UND
// Faehigkeiten (openGearItemDetail/openAbilityItemDetail) - grosse farbige
// Icon-Kachel statt nur einer schmalen Ueberschrift, plus Level/Sterne/Kraft
// als eigene Chips statt einer einzigen Textzeile.
function itemDetailHead(icon, rInfo, name, sub, item, kraft){
  return `<div class="itemDetailHead">
    <div class="itemDetailIcon" style="border-color:${rInfo.color};background:${rInfo.color}22;">${icon}</div>
    <div class="itemDetailName" style="color:${rInfo.color}">${rInfo.name} ${name}</div>
    <div class="itemDetailSub">${sub}</div>
    <div class="itemDetailStats">
      <div class="idStat"><small>Level</small>${item.level}</div>
      <div class="idStat"><small>Sterne</small>${item.stars}</div>
      <div class="idStat"><small>Kraft</small>⚡${kraft}</div>
    </div>
  </div>`;
}

// Detailseite eines einzelnen Ausruestungs-Exemplars, geoeffnet per Antippen
// der Icon-Kachel im Slot-Picker: Tragen sowie Level-/Stern-Aufwerten, statt
// alles gleichzeitig als Textzeilen in der Liste zu zeigen.
function openGearItemDetail(item, slot, returnMode, onBack){
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  const info = GEAR_SLOT_INFO[slot];
  const rInfo = RARITY_INFO[item.rarity];
  const isEquipped = state.player.gearEquipped[slot]===item.id;
  const maxed = item.level>=GEAR_MAX_LEVEL;
  const starMaxed = item.stars>=GEAR_MAX_STARS;

  box.innerHTML = itemDetailHead(info.icon, rInfo, info.name, info.desc+(isEquipped?" · Getragen":""), item, gearKraft(item));

  if(isEquipped){
    const hint = document.createElement("div");
    hint.className = "buildopt gearRow";
    hint.style.borderColor = rInfo.color;
    hint.innerHTML = `<span>✓ Ausgerüstet</span>`;
    box.appendChild(hint);
  } else {
    const wear = document.createElement("div");
    wear.className = "buildopt gearRow";
    wear.style.borderColor = rInfo.color;
    wear.innerHTML = `<span>Ausrüsten</span><b>Tragen</b>`;
    wear.addEventListener("click", ()=>{
      state.player.gearEquipped[slot] = item.id;
      save();
      reopen();
    });
    box.appendChild(wear);
  }

  if(!maxed){
    const cost = gearLevelCost(item);
    const opt = document.createElement("div");
    opt.className = "buildopt"+(state.resources.coins<cost?" disabled":"");
    opt.innerHTML = `<span>⬆️ Level ${item.level} → ${item.level+1}</span><b>🪙 ${cost}</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources.coins<cost) return;
      state.resources.coins -= cost;
      item.level++;
      save();
      reopen();
    });
    box.appendChild(opt);
  } else if(!starMaxed){
    const cost = gearStarCost(item);
    const opt = document.createElement("div");
    opt.className = "buildopt"+(state.resources.coins<cost?" disabled":"");
    opt.innerHTML = `<span>⭐ Stern ${item.stars} → ${item.stars+1}</span><b>🪙 ${cost}</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources.coins<cost) return;
      state.resources.coins -= cost;
      item.stars++;
      save();
      reopen();
    });
    box.appendChild(opt);
  }

  // Schliessen fuehrt zurueck zum Icon-Grid des Slots statt nur das Overlay
  // zu entfernen - dieselbe Rueckkehr-Logik wie beim Slot-Picker selbst.
  // onBack erlaubt anderen Aufrufern (z.B. der Ausruestungs-Uebersicht im
  // Profil-Hub) ein eigenes Rueckkehr-Ziel statt des Slot-Pickers.
  const back = onBack || (()=>openGearPicker(slot, returnMode));
  addCloseBtn(box, overlay, ()=>{ document.body.removeChild(overlay); back(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function reopen(){
    document.body.removeChild(overlay);
    openGearItemDetail(item, slot, returnMode, onBack);
  }
}
