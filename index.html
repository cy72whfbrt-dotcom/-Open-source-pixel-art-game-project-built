// Detailseite eines einzelnen Faehigkeit-Exemplars - exakt wie
// openGearItemDetail, nur ueber Key/abilitiesInventory statt
// Slot/gearInventory und mit Juwelen statt Coins bezahlt.
function openAbilityItemDetail(item, key, returnMode, onBack){
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  const info = ABILITY_DEFS[key];
  const rInfo = RARITY_INFO[item.rarity];
  const isEquipped = state.player.abilitiesEquipped[key]===item.id;
  const maxed = item.level>=GEAR_MAX_LEVEL;
  const starMaxed = item.stars>=GEAR_MAX_STARS;

  box.innerHTML = itemDetailHead(info.icon, rInfo, info.name, info.desc+(isEquipped?" · Aktiv":""), item, abilityKraft(item));

  if(isEquipped){
    // Anders als Ausruestung (die immer alle 6 Slots gleichzeitig traegt)
    // sind bei Faehigkeiten nur bis zu ABILITY_EQUIP_MAX von 8 gleichzeitig
    // aktiv - ohne Deaktivieren-Knopf waere ein einmal befuellter Ring-Platz
    // fuer immer blockiert, sobald das Limit erreicht ist.
    const hint = document.createElement("div");
    hint.className = "buildopt gearRow";
    hint.style.borderColor = rInfo.color;
    hint.innerHTML = `<span>✓ Aktiv</span><b>Deaktivieren</b>`;
    hint.addEventListener("click", ()=>{
      setAbilityEquipped(key, null);
      reopen();
    });
    box.appendChild(hint);
  } else {
    const wear = document.createElement("div");
    wear.className = "buildopt gearRow";
    wear.style.borderColor = rInfo.color;
    wear.innerHTML = `<span>Aktivieren</span><b>Wählen</b>`;
    wear.addEventListener("click", ()=>{
      if(!setAbilityEquipped(key, item.id)){
        showToast(`⚠️ Maximal ${ABILITY_EQUIP_MAX} Fähigkeiten aktiv`);
        return;
      }
      reopen();
    });
    box.appendChild(wear);
  }

  if(!maxed){
    const cost = abilityLevelCost(item);
    const opt = document.createElement("div");
    opt.className = "buildopt"+(state.resources.coins<cost?" disabled":"");
    opt.innerHTML = `<span>⬆️ Level ${item.level} → ${item.level+1}</span><b>🪙 ${cost}</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources.coins<cost) return;
      state.resources.coins -= cost;
      item.level++;
      save();
      reopen();
    });
    box.appendChild(opt);
  } else if(!starMaxed){
    const cost = abilityStarCost(item);
    const opt = document.createElement("div");
    opt.className = "buildopt"+(state.resources.coins<cost?" disabled":"");
    opt.innerHTML = `<span>⭐ Stern ${item.stars} → ${item.stars+1}</span><b>🪙 ${cost}</b>`;
    opt.addEventListener("click", ()=>{
      if(state.resources.coins<cost) return;
      state.resources.coins -= cost;
      item.stars++;
      save();
      reopen();
    });
    box.appendChild(opt);
  }

  const back = onBack || (()=>openAbilityKeyPicker(key, returnMode));
  addCloseBtn(box, overlay, ()=>{ document.body.removeChild(overlay); back(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function reopen(){
    document.body.removeChild(overlay);
    openAbilityItemDetail(item, key, returnMode, onBack);
  }
}

// Profil-Hub: staerkt den SPIELER dauerhaft, bezahlt mit Coins/Juwelen.
// Layout an der Sword x Staff-Referenz: Emblem+Titel oben, Portrait mittig
// mit GENAU 6 Kreisen drumherum (3 links / 3 rechts), grosse Level-Zahl
// mit EXP-Leiste und Kraft-Plakette daneben, "Werte"-Abschnitt darunter.
//
// Der Ring hat ZWEI Modi, die dasselbe Panel/Layout teilen statt ein neues
// Menue zu oeffnen: "equip" zeigt die 6 Ausruestungs-Slots (Stiefel/
// Handschuhe/Brustplatte/Hose/Waffe/Ring, siehe GEAR_SLOTS), "abilities"
// zeigt bis zu 5 frei waehlbare Faehigkeiten aus dem eigenen Besitz. Der
// "Fähigkeiten"-Knopf schaltet zwischen beiden um - exakt das gleiche
// visuelle Ring-Design fuer beide, wie gewuenscht.
//
// Bewusste Abweichungen von der Referenz (mit Grund, nicht aus Faulheit):
// - Dunkler Panel-Hintergrund statt hellem Himmel-Blau, damit der Hub
//   nicht als Fremdkoerper neben den anderen (dunklen) Menues dieses
//   Spiels wirkt.
// - Kein Begleit-Kreatur-Icon, weil dieses Spiel keine Pets/Begleiter hat.
// - Emoji statt gemalter Item-Grafik, weil keine eigenen Icon-Assets
//   existieren.
function openProfileHub(mode){
  mode = mode || "equip";
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box profileBox";

  const xpNow = xpForLevel(state.playerLevel);
  const xpRatio = Math.max(0,Math.min(1, state.playerXp/xpNow));
  const GEAR_POS = ["pos-l1","pos-l2","pos-l3","pos-r1","pos-r2","pos-r3"];
  const ABILITY_POS = ["pos-l1","pos-l2","pos-r1","pos-r2","pos-r3"];

  box.innerHTML = `
    <div class="titleEmblem">
      <div class="titleIcon">🛡️</div>
      <div class="titleText">${playerTitle()}</div>
    </div>
    <div class="avatarStage" id="avatarStage">
      <div class="avatarBig"><div class="avHead"></div><div class="avBody"></div></div>
      <div class="levelChip">Lv. ${state.playerLevel}</div>
    </div>
    <div class="categoryRow">
      <div class="categoryPill${mode==="gear"?" active":""}" id="btnAusruestung">🛡️ Ausrüstung</div>
      <div class="categoryPill${mode==="abilities"?" active":""}" id="btnFaehigkeiten">🌟 Fähigkeiten</div>
      <div class="categoryPill" id="btnSchmiede">🔨 Schmiede</div>
    </div>
    <div id="midSection"></div>
    <div class="gearLegend">${mode==="abilities"
      ? "Slot antippen: aktivieren, aufwerten oder kombinieren (bezahlt mit 💎)"
      : "Slot antippen: tragen, aufwerten oder kombinieren (bezahlt mit 🪙)"}</div>
  `;

  box.querySelector("#btnAusruestung").addEventListener("click", ()=>{
    document.body.removeChild(overlay);
    openProfileHub(mode==="gear" ? "equip" : "gear");
  });
  box.querySelector("#btnFaehigkeiten").addEventListener("click", ()=>{
    document.body.removeChild(overlay);
    openProfileHub(mode==="abilities" ? "equip" : "abilities");
  });
  box.querySelector("#btnSchmiede").addEventListener("click", ()=>{
    showComingSoonPanel("🔨 Schmiede", "Noch ohne eigene Mechanik dahinter - der Button ist schon da, der Inhalt kommt später.");
  });

  // Mittlerer Bereich, je nach Modus: Standard = Level/EXP + Werte,
  // "Fähigkeiten" = Liste der eigenen Faehigkeiten, "Ausrüstung" = Liste
  // der eigenen Ausruestung - immer nur EINER der drei Inhalte gleichzeitig.
  const mid = box.querySelector("#midSection");
  if(mode==="abilities"){
    const owned = state.player.abilitiesInventory
      .slice()
      .sort((a,b)=> rarityIndex(b.rarity)-rarityIndex(a.rarity) || gearPower(b.rarity,b.level,b.stars)-gearPower(a.rarity,a.level,a.stars));
    const label = document.createElement("div");
    label.className = "sectionLabel";
    label.textContent = "Deine Fähigkeiten";
    mid.appendChild(label);
    if(owned.length===0){
      const empty = document.createElement("div");
      empty.className = "hint2";
      empty.textContent = "Noch keine Fähigkeit - im Shop ziehen (🛒-Knopf am Bildschirmrand).";
      mid.appendChild(empty);
    } else {
      // Icon-Kacheln (3 pro Reihe) statt Textzeilen - gleiches Muster wie bei
      // der Ausruestungs-Uebersicht. Ein Exemplar pro Kachel (nicht ein Key),
      // genau wie bei Ausruestung - antippen oeffnet die Detailseite zum
      // Aktivieren/Aufwerten (openAbilityItemDetail).
      const grid = document.createElement("div");
      grid.className = "gearItemGrid";
      owned.forEach(item=>{
        const def = ABILITY_DEFS[item.key], rInfo = RARITY_INFO[item.rarity];
        const isEquipped = state.player.abilitiesEquipped[item.key]===item.id;
        const cell = document.createElement("div");
        cell.className = "gearItemCell";
        cell.style.borderColor = rInfo.color;
        cell.innerHTML = `${isEquipped?'<div class="gearItemCheck">✓</div>':""}<div class="prIcon">${def.icon}</div><div class="gearItemLv" style="color:${rInfo.color}">Lv.${item.level}${item.stars>0?" "+"★".repeat(item.stars):""}</div>`;
        cell.title = def.desc;
        cell.addEventListener("click", ()=>{
          document.body.removeChild(overlay);
          openAbilityItemDetail(item, item.key, "abilities", ()=>openProfileHub("abilities"));
        });
        grid.appendChild(cell);
      });
      mid.appendChild(grid);
    }
  } else if(mode==="gear"){
    const owned = state.player.gearInventory
      .slice()
      .sort((a,b)=> GEAR_SLOTS.indexOf(a.slot)-GEAR_SLOTS.indexOf(b.slot) || rarityIndex(b.rarity)-rarityIndex(a.rarity) || gearPower(b.rarity,b.level,b.stars)-gearPower(a.rarity,a.level,a.stars));
    const label = document.createElement("div");
    label.className = "sectionLabel";
    label.textContent = "Deine Ausrüstung";
    mid.appendChild(label);
    if(owned.length===0){
      const empty = document.createElement("div");
      empty.className = "hint2";
      empty.textContent = "Noch keine Ausrüstung - im Shop ziehen (🛒-Knopf am Bildschirmrand).";
      mid.appendChild(empty);
    } else {
      // Icon-Kacheln (3 pro Reihe) statt Textzeilen - gleiches Muster wie im
      // Slot-Picker: antippen oeffnet die Detailseite zum Tragen/Aufwerten.
      const grid = document.createElement("div");
      grid.className = "gearItemGrid";
      owned.forEach(item=>{
        const slotInfo = GEAR_SLOT_INFO[item.slot], rInfo = RARITY_INFO[item.rarity];
        const isEquipped = state.player.gearEquipped[item.slot]===item.id;
        const cell = document.createElement("div");
        cell.className = "gearItemCell";
        cell.style.borderColor = rInfo.color;
        cell.innerHTML = `${isEquipped?'<div class="gearItemCheck">✓</div>':""}<div class="prIcon">${slotInfo.icon}</div><div class="gearItemLv" style="color:${rInfo.color}">Lv.${item.level}${item.stars>0?" "+"★".repeat(item.stars):""}</div>`;
        cell.addEventListener("click", ()=>{
          document.body.removeChild(overlay);
          openGearItemDetail(item, item.slot, "gear", ()=>openProfileHub("gear"));
        });
        grid.appendChild(cell);
      });
      mid.appendChild(grid);
    }
  } else {
    mid.innerHTML = `
      <div class="levelHeaderRow">
        <div class="lvBig">Level ${state.playerLevel}<span>${state.playerXp}/${xpNow} EXP</span></div>
        <div class="rankBadge">⚡ ${formatCompactNumber(computeKraft())}<br>Kraft</div>
      </div>
      <div class="lvBarFull"><div style="width:${Math.round(xpRatio*100)}%"></div></div>
      <div class="valuesHeader">🔍 Werte</div>
      <div class="statsGrid">
        <div class="statTile">❤ Leben<b>${Math.round(playerMaxHp())}</b></div>
        <div class="statTile">🏃 Tempo<b>+${Math.round((playerSpeedMult()-1)*100)}%</b></div>
        <div class="statTile">🎒 Rucksack<b>${playerBackpackCapacity()}</b></div>
        <div class="statTile">✨ EXP-Rate<b>+${Math.round((xpMultiplier()-1)*100)}%</b></div>
      </div>
    `;
  }

  const stage = box.querySelector("#avatarStage");

  if(mode==="abilities"){
    // Bis zu 5 der 8 Faehigkeit-Keys sind gleichzeitig aktiv - abilitiesEquipped
    // ist ein Objekt (Key -> Exemplar-Id, wie gearEquipped), die Reihenfolge
    // der aktiven Keys fuellt die 5 festen Ring-Positionen.
    const activeKeys = Object.keys(state.player.abilitiesEquipped).filter(k=>state.player.abilitiesEquipped[k]);
    for(let i=0;i<ABILITY_EQUIP_MAX;i++){
      const key = activeKeys[i];
      const inst = key ? equippedAbility(key) : null;
      const def = key ? ABILITY_DEFS[key] : null;
      const rInfo = inst ? RARITY_INFO[inst.rarity] : null;
      const slot = document.createElement("div");
      slot.className = "gearSlot "+ABILITY_POS[i]+(key?" owned":"");
      if(inst) slot.style.setProperty("--rc", rInfo.color);
      if(def) slot.title = def.desc;
      slot.innerHTML = `<div class="badge" style="${inst?`border-color:${rInfo.color};background:${rInfo.color}22;`:""}">${def?def.icon:"+"}</div>
        <div class="bonus" style="${inst?`color:${rInfo.color}`:""}">${def?def.name:"—"}</div>`;
      slot.addEventListener("click", ()=>{
        document.body.removeChild(overlay);
        if(key){
          openAbilityKeyPicker(key, "abilities");
        } else {
          openAbilityPicker((pickedKey)=>{
            equipBestAbilityInstance(pickedKey);
            openProfileHub("abilities");
          });
        }
      });
      stage.appendChild(slot);
    }
  } else {
    GEAR_SLOTS.forEach((gearSlotKey,i)=>{
      const info = GEAR_SLOT_INFO[gearSlotKey];
      const item = equippedGear(gearSlotKey);
      const rInfo = item ? RARITY_INFO[item.rarity] : null;

      const slot = document.createElement("div");
      slot.className = "gearSlot "+GEAR_POS[i]+(item?" owned":"");
      if(item) slot.style.setProperty("--rc", rInfo.color);
      slot.title = info.desc;
      slot.innerHTML = `<div class="badge" style="${item?`border-color:${rInfo.color};background:${rInfo.color}22;`:""}">${info.icon}</div>
        <div class="bonus" style="${item?`color:${rInfo.color}`:""}">${item?rInfo.name+" ·"+item.level:"—"}</div>`;
      slot.addEventListener("click", ()=>{
        document.body.removeChild(overlay);
        openGearPicker(gearSlotKey, mode);
      });
      stage.appendChild(slot);
    });
  }

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function openBuildMenu(c,r){
  const key = c+","+r;
  const slot = state.cellsByCoord[key] || {unlocked:false, building:null};
  state.cellsByCoord[key] = slot;

  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";

  if(!slot.unlocked){
    box.innerHTML = `<h3>Noch gesperrt</h3><div class="hint2">Verbessere deine Base, um weitere Felder freizuschalten.</div>`;
  } else if(slot.building){
    const b = slot.building;
    const def = BUILDABLE_TYPES[b.type];
    const cost = upgradeCost(b.type, b.level);
    const maxHp = maxHpFor(b.type, b.level);
    // Zerstoerte Gebaeude (0 HP) bleiben stehen statt zu verschwinden - sie
    // muessen erst repariert werden, bevor man sie hochstuft, umruestet
    // oder verschiebt.
    const isDestroyed = b.hp<=0;
    box.innerHTML = `<h3>${def.name}${isDestroyed?" (kaputt)":""}</h3><div class="hint2">Level ${b.level} · HP ${Math.round(b.hp)}/${maxHp}</div>`;

    // Gebaeude-Level darf das aktuelle Basis-Level nie ueberholen - sonst
    // koennte man wieder einen einzelnen Turm isoliert hochpumpen, egal wie
    // weit die Basis eigentlich ist (genau das Problem, das die Kanone
    // vorher hatte).
    const atLevelCap = b.level>=state.basisLevel;
    const upOpt = document.createElement("div");
    upOpt.className = "buildopt" + (isDestroyed || atLevelCap || !canAfford(cost) ? " disabled":"");
    upOpt.innerHTML = isDestroyed
      ? `<span>Verbessern auf Level ${b.level+1}<small>Erst reparieren</small></span>`
      : atLevelCap
      ? `<span>Verbessern auf Level ${b.level+1}<small>Erst ab Basis-Level ${b.level+1} möglich</small></span>`
      : `<span>Verbessern auf Level ${b.level+1}<small>Repariert dabei auch komplett</small></span><b>${formatCost(cost)}</b>`;
    upOpt.addEventListener("click", ()=>{
      if(!isDestroyed && !atLevelCap && canAfford(cost)){
        payCost(cost); b.level++; b.hp = maxHpFor(b.type,b.level);
        addPlayerXp(buildingUpgradeXp(b.level));
        addQuestProgress("build", 1);
        save(); document.body.removeChild(overlay); render();
        openBuildMenu(c,r);
      }
    });
    box.appendChild(upOpt);

    if(b.hp<maxHp){
      const rCost = repairCost(b.type,b);
      const repOpt = document.createElement("div");
      repOpt.className = "buildopt" + (!canAfford(rCost) ? " disabled":"");
      repOpt.innerHTML = `<span>Reparieren<small>Stellt volle HP wieder her</small></span><b>${formatCost(rCost)}</b>`;
      repOpt.addEventListener("click", ()=>{
        if(canAfford(rCost)){ payCost(rCost); b.hp = maxHp; save(); document.body.removeChild(overlay); render(); openBuildMenu(c,r); }
      });
      box.appendChild(repOpt);
    }

    if(b.type==="kaserne"){
      const head = document.createElement("div");
      head.className="hint2"; head.style.marginTop="6px"; head.textContent="Ausbildung:";
      box.appendChild(head);

      if(isDestroyed){
        const info = document.createElement("div");
        info.className="hint2"; info.textContent = "Erst reparieren, bevor hier weiter ausgebildet werden kann.";
        box.appendChild(info);
      } else {
        const anyTraining = !!state.npc.training;
        Object.entries(NPC_TRAIN_DEFS).forEach(([kind,trainDef])=>{
          const count = kind==="reparatur" ? state.npc.reparaturCount : state.npc.angreifer.length;
          const cap = kind==="reparatur" ? REPAIR_NPC_CAP : ANGREIFER_CAP;
          const isTrainingThis = state.npc.training && state.npc.training.kind===kind;

          const rowHead = document.createElement("div");
          rowHead.className="hint2"; rowHead.style.marginTop="6px";
          rowHead.textContent = trainDef.name+" herstellen "+count+"/"+cap
            + (isTrainingThis ? " · noch "+Math.ceil(state.npc.training.timeLeft)+"s" : "");
          box.appendChild(rowHead);

          const slotRow = document.createElement("div");
          slotRow.className="slotRow";
          for(let i=0;i<cap;i++){
            const slotEl = document.createElement("div");
            if(i<count){
              slotEl.className = "slot filled";
              slotEl.textContent = "✓";
            } else {
              const canStart = !anyTraining && canAfford(trainDef.cost);
              slotEl.className = "slot empty" + (canStart ? "" : " disabled");
              slotEl.textContent = "+";
              slotEl.title = trainDef.desc+" ("+formatCost(trainDef.cost)+")";
              if(canStart){
                slotEl.addEventListener("click", ()=>{
                  payCost(trainDef.cost);
                  state.npc.training = { kind, timeLeft: trainDef.baseTime, totalTime: trainDef.baseTime };
                  save(); document.body.removeChild(overlay); render();
                  openBuildMenu(c,r);
                });
              }
            }
            slotRow.appendChild(slotEl);
          }
          box.appendChild(slotRow);
        });

        const costHint = document.createElement("div");
        costHint.className="hint2";
        costHint.textContent = "Kosten pro Slot: Reparatur-Trupp "+formatCost(NPC_TRAIN_DEFS.reparatur.cost)+" · Angreifer "+formatCost(NPC_TRAIN_DEFS.angreifer.cost);
        box.appendChild(costHint);
      }
    }

    if(b.type==="krankenhaus"){
      const verletzt = state.npc.angreifer.filter(a=>a.status==="verletzt").length;
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed
        ? "Erst reparieren - solange ist die Pflege-Kapazität 0."
        : "Pflegeplätze belegt: "+verletzt+"/"+b.level+". Höheres Level heilt schneller und bietet mehr Plätze.";
      box.appendChild(info);
    }

    if(b.type==="lager"){
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = "Aktuelle Lagerkapazität: "+storageCap()+" pro Rohstoff.";
      box.appendChild(info);
    }

    if(b.type==="wachturm"){
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed ? "Erst reparieren, bevor wieder vorgewarnt wird." : "Zeigt die Zusammensetzung der nächsten Welle oben im Spiel an.";
      box.appendChild(info);
    }

    if(b.type==="handelsposten"){
      const rate = tradeRate(b.level);
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed ? "Erst reparieren, bevor hier getauscht werden kann." : "Tauschkurs: "+Math.round(rate*100)+"% - kein Ersatz fürs Sammeln, nur eine Notlösung.";
      box.appendChild(info);

      if(!isDestroyed){
        const TRADE_AMOUNT = 20;
        const gain = Math.round(TRADE_AMOUNT*rate);
        const cap = storageCap();

        const toStein = document.createElement("div");
        const canToStein = state.resources.holz>=TRADE_AMOUNT;
        toStein.className = "buildopt"+(canToStein?"":" disabled");
        toStein.innerHTML = `<span>${TRADE_AMOUNT} Holz → ${gain} Stein</span>`;
        toStein.addEventListener("click", ()=>{
          if(state.resources.holz>=TRADE_AMOUNT){
            state.resources.holz -= TRADE_AMOUNT;
            state.resources.stein = Math.min(cap, state.resources.stein+gain);
            save(); document.body.removeChild(overlay); render();
            openBuildMenu(c,r);
          }
        });
        box.appendChild(toStein);

        const toHolz = document.createElement("div");
        const canToHolz = state.resources.stein>=TRADE_AMOUNT;
        toHolz.className = "buildopt"+(canToHolz?"":" disabled");
        toHolz.innerHTML = `<span>${TRADE_AMOUNT} Stein → ${gain} Holz</span>`;
        toHolz.addEventListener("click", ()=>{
          if(state.resources.stein>=TRADE_AMOUNT){
            state.resources.stein -= TRADE_AMOUNT;
            state.resources.holz = Math.min(cap, state.resources.holz+gain);
            save(); document.body.removeChild(overlay); render();
            openBuildMenu(c,r);
          }
        });
        box.appendChild(toHolz);
      }
    }

    if(b.type==="turm"){
      const wHead = document.createElement("div");
      wHead.className="hint2"; wHead.style.marginTop="6px"; wHead.textContent="Waffe auswählen:";
      box.appendChild(wHead);
      Object.entries(WEAPONS).forEach(([key2,w])=>{
        // Beides muss stimmen: die Basis muss weit genug sein (Fortschritt
        // insgesamt) UND DIESER Turm muss selbst auf das Level hochgekauft
        // sein (Investition in genau diesen Turm) - sonst bekommt man die
        // Kanone quasi geschenkt, sobald die Basis hoch genug ist.
        const basisOk = state.basisLevel>=w.unlockLevel;
        const turmOk = b.level>=w.unlockLevel;
        const unlocked = basisOk && turmOk && !isDestroyed;
        const selected = b.weapon===key2;
        const wOpt = document.createElement("div");
        wOpt.className = "buildopt"+(!unlocked?" disabled":"");
        wOpt.style.border = selected ? "1px solid #7aa2f7" : "";
        let hint = w.desc;
        if(!unlocked){
          hint = isDestroyed ? "Erst reparieren"
               : !basisOk && !turmOk ? "Braucht Basis-Level "+w.unlockLevel+" und Turm-Level "+w.unlockLevel
               : !basisOk ? "Braucht Basis-Level "+w.unlockLevel
               : "Braucht Turm-Level "+w.unlockLevel;
        }
        wOpt.innerHTML = `<span>${w.name}${selected?" (aktiv)":""}<small>${hint}</small></span>`;
        if(unlocked && !selected) wOpt.addEventListener("click", ()=>{ b.weapon=key2; save(); document.body.removeChild(overlay); render(); openBuildMenu(c,r); });
        box.appendChild(wOpt);
      });
    }

    const moveOpt = document.createElement("div");
    moveOpt.className = "buildopt" + (isDestroyed ? " disabled":""); moveOpt.style.marginTop="6px";
    moveOpt.innerHTML = isDestroyed
      ? `<span>Verschieben<small>Erst reparieren</small></span>`
      : `<span>Verschieben<small>Tippe danach ein freies Feld an</small></span>`;
    moveOpt.addEventListener("click", ()=>{
      if(isDestroyed) return;
      moveSource = {c,r};
      document.body.removeChild(overlay); render();
    });
    box.appendChild(moveOpt);

    const refund = sellRefund(b.type,b.level);
    const sellOpt = document.createElement("div");
    sellOpt.className = "buildopt"; sellOpt.style.marginTop="6px";
    sellOpt.innerHTML = `<span>Verkaufen</span><b>+${formatCost(refund)}</b>`;
    sellOpt.addEventListener("click", ()=>{
      state.resources.holz+=refund.holz; state.resources.stein+=refund.stein;
      slot.building = null;
      save(); document.body.removeChild(overlay); render();
    });
    box.appendChild(sellOpt);
  } else {
    const required = requiredTypeForCell(c,r);
    box.innerHTML = required
      ? `<h3>${BUILDABLE_TYPES[required].name} bauen</h3><div class="hint2">Für die Grundverteidigung brauchst du hier ${required==="turm"?"einen Turm":"eine Mauer"}.</div>`
      : `<h3>Feld bebauen</h3>`;
    Object.entries(BUILDABLE_TYPES).filter(([type])=>{
      if(required) return type===required;
      if(type==="kaserne") return state.basisLevel>=KASERNE_UNLOCK_LEVEL && !hasKaserne();
      if(type==="krankenhaus") return state.basisLevel>=KASERNE_UNLOCK_LEVEL && !hasKrankenhaus();
      if(type==="lager") return state.basisLevel>=LAGER_UNLOCK_LEVEL && !hasLager();
      if(type==="wachturm") return state.basisLevel>=WACHTURM_UNLOCK_LEVEL && !hasWachturm();
      if(type==="handelsposten") return state.basisLevel>=HANDEL_UNLOCK_LEVEL && !hasHandelsposten();
      return true;
    }).forEach(([type,def])=>{
      const opt = document.createElement("div");
      opt.className = "buildopt" + (!canAfford(def.cost) ? " disabled":"");
      opt.innerHTML = `<span>${def.name}<small>${def.desc}</small></span><b>${formatCost(def.cost)}</b>`;
      opt.addEventListener("click", ()=>{
        if(canAfford(def.cost)){
          payCost(def.cost);
          const hp = maxHpFor(type,1);
          slot.building = type==="turm" ? {type,level:1,weapon:"bogen",hp} : {type,level:1,hp};
          checkTutorial();
          addQuestProgress("build", 1);
          save(); document.body.removeChild(overlay); render();
        }
      });
      box.appendChild(opt);
    });
  }

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// Modernes Schliessen: "X" oben rechts in der Box + Antippen ausserhalb der
// Box schliesst ebenfalls - kein eigener "Schließen"-Knopf mehr am Ende der
// Liste noetig. onClose optional fuer Picker, die zu einem Eltern-Panel
// zurueckkehren muessen statt nur das Overlay zu entfernen.
function addCloseBtn(box, overlay, onClose){
  const close = onClose || (()=>{ document.body.removeChild(overlay); });
  const x = document.createElement("div");
  x.className = "modalCloseX";
  x.textContent = "✕";
  x.addEventListener("click", close);
  box.appendChild(x);
  overlay.addEventListener("click", e=>{
    if(e.target===overlay) close();
  });
}

function showIntroIfNeeded(){
  if(state.tutorialIntroShown) return;
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>Willkommen auf deiner Insel</h3>
    <div class="hint2">
      Folge der markierten Stelle mit dem Pfeil und tippe genau dort drauf -
      sie zeigt dir Schritt für Schritt, was als Nächstes zu tun ist.
      Erst wenn deine Grundverteidigung steht, kommt die erste Gegnerwelle.
    </div>`;
  const opt = document.createElement("div");
  opt.className = "buildopt"; opt.style.justifyContent="center";
  opt.textContent = "Los geht's";
  opt.addEventListener("click", ()=>{
    state.tutorialIntroShown = true;
    save();
    document.body.removeChild(overlay);
  });
  box.appendChild(opt);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
buildTextures();
resizeCanvas();
showIntroIfNeeded();

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  updateWave(dt);
  updateRepairJob(dt);
  updateTraining(dt);
  updateHospital(dt);
  updatePlayer(dt);
  enforceTestResources();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
