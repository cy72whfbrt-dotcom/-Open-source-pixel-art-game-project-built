<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Basis-Raster-Prototyp</title>
<style>
  /* Ein Design-Token-Satz fuer die gesamte UI (Panels, Buttons, Menues) -
     dieselbe Palette wie im Canvas-HUD (siehe HUD-Objekt in spiel.js),
     damit UI-Elemente ausserhalb des Canvas nicht wie ein anderes Spiel
     wirken. Flach, ruhig, ein Akzentton statt vieler Materialfarben. */
  :root {
    --panel: rgba(15,21,30,0.92);
    --panel-soft: rgba(15,21,30,0.82);
    --border: rgba(255,255,255,0.09);
    --text: #eef2f6;
    --text-dim: #8b96a5;
    --accent: #2dd6bd;
    --accent-text: #083330;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    margin:0; padding:0; background:#0d1620; color:var(--text);
    font-family: system-ui, sans-serif; user-select:none;
    height:100%; overflow:hidden;
  }
  [hidden] { display:none !important; }
  #app {
    width:100%; max-width:480px; height:100vh; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
  }

  #stage { position:relative; width:100%; flex:1; min-height:0; }
  /* Color-Grading direkt auf dem Canvas: leicht entsaettigt, mehr Kontrast,
     minimal waermer - derselbe Trick, mit dem Spiele ihren "Look" bekommen.
     Kostet keine Rechenzeit im Zeichencode. */
  canvas {
    background:#0b1e28; display:block; touch-action:none; width:100%; height:100%;
    filter: saturate(0.86) contrast(1.1) brightness(1.02);
  }

  #ctrlBar { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:8px; }
  #ctrlBar button {
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel-soft); color:var(--text); font-size:15px; cursor:pointer; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }

  .buildmenu {
    position:fixed; inset:0; background:rgba(6,10,15,.68); display:flex; align-items:center; justify-content:center; z-index:20;
  }
  .buildmenu .box {
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; width:300px; max-width:88vw; box-shadow:0 12px 32px rgba(0,0,0,0.4);
  }
  .buildmenu h3 { margin:0 0 4px; font-size:15px; font-weight:700; }
  .buildmenu .hint2 { color:var(--text-dim); font-size:11.5px; margin-bottom:10px; }
  .buildopt {
    display:flex; justify-content:space-between; align-items:center; padding:10px; border:1px solid var(--border);
    background:rgba(255,255,255,0.02); border-radius:var(--radius-sm); margin-bottom:7px; cursor:pointer; font-size:12.5px; gap:8px;
  }
  .buildopt.disabled { opacity:.4; }
  .buildopt small { display:block; color:var(--text-dim); margin-top:2px; }
  .slotRow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .slot {
    width:34px; height:34px; border-radius:var(--radius-sm); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;
  }
  .slot.filled { background:rgba(45,214,189,0.14); border-color:var(--accent); color:var(--accent); }
  .slot.empty { background:rgba(255,255,255,0.04); color:var(--text-dim); cursor:pointer; }
  .slot.empty.disabled { opacity:.4; cursor:default; }

  #joystick {
    position:absolute; left:14px; bottom:14px; width:104px; height:104px; border-radius:50%;
    background:var(--panel-soft); border:1px solid var(--border); touch-action:none;
  }
  #joystickKnob {
    position:absolute; left:50%; top:50%; width:42px; height:42px; margin:-21px;
    border-radius:50%; background:rgba(45,214,189,0.35); border:1px solid rgba(45,214,189,0.7);
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="c" width="400" height="620"></canvas>
    <div id="ctrlBar">
      <button id="zoomIn">+</button>
      <button id="centerBtn">◎</button>
      <button id="zoomOut">−</button>
    </div>
    <div id="joystick"><div id="joystickKnob"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";

const CELL = 62;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 400, H = 620;

function resizeCanvas(){
  const rect = canvas.parentElement.getBoundingClientRect();
  W = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  canvas.width = W;
  canvas.height = H;
  if(typeof render === "function") render();
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

const WATER_RADIUS = 700;
const UNLOCK_BATCH = 4;      // pro Basis-Level werden 4 neue Felder frei
// Das Raster waechst in mehreren Stufen ueber die Basis-Level verteilt (bis
// Level 20 angelegt), nicht nur einmal - je hoeher das Level, desto mehr
// Platz zum Bauen und desto mehr Raum fuer echte Pfad-Entscheidungen.
const GRID_GROWTH_STEPS = [ {level:1,size:5}, {level:7,size:7}, {level:14,size:9} ];

// ================= Raster-Geometrie (Groesse haengt vom Basis-Level ab) =================

function gridSizeForLevel(level){
  let size = GRID_GROWTH_STEPS[0].size;
  for(const step of GRID_GROWTH_STEPS){ if(level>=step.level) size = step.size; }
  return size;
}
function centerOf(gridSize){ return Math.floor(gridSize/2); }

// Alle Felder ausser der Mitte, sortiert nach Abstand zur Mitte (naeher zuerst) -
// so wachsen neue Freischaltungen immer ringfoermig von innen nach aussen.
function cellList(gridSize){
  const c0 = centerOf(gridSize);
  const all = [];
  for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
    if(c===c0 && r===c0) continue;
    all.push([c,r]);
  }
  all.sort((a,b)=>{
    const da = Math.max(Math.abs(a[0]-c0),Math.abs(a[1]-c0));
    const db = Math.max(Math.abs(b[0]-c0),Math.abs(b[1]-c0));
    return da-db;
  });
  return all;
}
function cellCenter(c,r,gridSize){ const c0=centerOf(gridSize); return { x:(c-c0)*CELL, y:(r-c0)*CELL }; }

// ================= Zustand =================

const SAVE_KEY = "basis_raster_proto_v14";
const TUTORIAL_START_UNLOCK = 8; // das ganze 3x3-Feld um die Base ist von Anfang an frei
const MIN_WAVE_GAP = 30; // Sekunden Mindestabstand zwischen zwei Wellen
const PLAYER_MAX_HP = 60;
const HAFEN_UNLOCK_LEVEL = 7;
// Die 8 Nachbarfelder: 4 gerade (Turm-Plaetze im Tutorial), 4 diagonal (Mauer-Plaetze)
const TUTORIAL_TOWER_IDX = [1,3,4,6];
const TUTORIAL_WALL_IDX  = [0,2,5,7];

const WATER_NODE_DEFS = [
  { id:"holz1", type:"holz", angle:20,  capacity:20, regenMs:1600 },
  { id:"holz2", type:"holz", angle:160, capacity:20, regenMs:1600 },
  { id:"holz3", type:"holz", angle:220, capacity:20, regenMs:1600 },
  { id:"holz4", type:"holz", angle:340, capacity:20, regenMs:1600 },
  { id:"stein1", type:"stein", angle:80,  capacity:16, regenMs:2200 },
  { id:"stein2", type:"stein", angle:135, capacity:16, regenMs:2200 },
  { id:"stein3", type:"stein", angle:270, capacity:16, regenMs:2200 },
  { id:"stein4", type:"stein", angle:305, capacity:16, regenMs:2200 }
];
const NODE_WATER_MARGIN = 65; // Abstand der Ressourcen-Punkte zum Rastrand, immer im Wasser
function gridHalfExtent(gridSize){ return centerOf(gridSize)*CELL + CELL/2; }

function defaultState(){
  return {
    playerName: "Kommandant",
    playerLevel: 1,
    playerXp: 0,
    resources: { holz: 60, stein: 30, gems: 0, coins: 0 },
    basisLevel: 1,
    baseHp: 100,
    waveTimer: 15,
    cellsByCoord: {},
    nodes: WATER_NODE_DEFS.map(n=>({ id:n.id, amount:n.capacity, angle:n.angle })),
    tutorialDone: false,
    tutorialIntroShown: false,
    tutorialCollected: false,
    npc: { reparaturCount: 0, angreifer: [], training: null },
    repairJob: null,
    nextWaveComposition: null,
    player: { x:0, y:0, backpack:{holz:0,stein:0}, moveTarget:null, hp:PLAYER_MAX_HP, invulnCd:0 }
  };
}
let state = load();

// Test-Hilfe fuers Handy (kein echtes Spiel-Feature): Link mit ?cheat=1
// anhaengen (in der Adressleiste antippen und "?cheat=1" ans Ende schreiben),
// dann einmal neu laden - setzt Holz/Stein auf 100000.
if(new URLSearchParams(location.search).get("cheat")==="1"){
  state.resources.holz = 100000;
  state.resources.stein = 100000;
  save();
}
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.resources && typeof d.resources.holz==="number" && d.cellsByCoord) return d;
    }
  } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){} }

function canAfford(cost){ return state.resources.holz>=cost.holz && state.resources.stein>=cost.stein; }
function payCost(cost){ state.resources.holz-=cost.holz; state.resources.stein-=cost.stein; }
function scaleCost(cost, factor){ return { holz: Math.round(cost.holz*factor), stein: Math.round(cost.stein*factor) }; }
function formatCost(cost){
  const parts=[];
  if(cost.holz) parts.push(cost.holz+" Holz");
  if(cost.stein) parts.push(cost.stein+" Stein");
  return parts.join(" · ") || "kostenlos";
}

const BUILDABLE_TYPES = {
  turm:         { name:"Turm",         desc:"Verteidigungsturm, greift Angreifer an.", cost:{holz:20,stein:30}, baseHp:100, hpPerLevel:25 },
  mauer:        { name:"Mauer",        desc:"Blockiert den Weg, hat aber selbst keinen Angriff.", cost:{holz:16,stein:8}, baseHp:150, hpPerLevel:35 },
  kaserne:      { name:"Kaserne",      desc:"Bildet Reparatur- und Angreifer-Trupps aus.", cost:{holz:50,stein:70}, baseHp:110, hpPerLevel:20 },
  krankenhaus:  { name:"Krankenhaus",  desc:"Pflegeplätze für verletzte Angreifer, verkürzt die Heilzeit.", cost:{holz:45,stein:60}, baseHp:100, hpPerLevel:15 },
  lager:        { name:"Lager",        desc:"Erhöht die maximale Lagerkapazität für Holz und Stein.", cost:{holz:40,stein:40}, baseHp:90, hpPerLevel:15 },
  wachturm:     { name:"Wachturm",     desc:"Zeigt die Zusammensetzung der nächsten Welle vorher an.", cost:{holz:35,stein:45}, baseHp:80, hpPerLevel:10 },
  handelsposten:{ name:"Handelsposten",desc:"Tauscht Holz und Stein gegeneinander (mit Verlust).", cost:{holz:40,stein:40}, baseHp:80, hpPerLevel:10 }
};
function upgradeCost(type, level){ return scaleCost(BUILDABLE_TYPES[type].cost, Math.pow(1.5, level)); }
function maxHpFor(type, level){ const d=BUILDABLE_TYPES[type]; return d.baseHp+(level-1)*d.hpPerLevel; }
function sellRefund(type, level){ return scaleCost(BUILDABLE_TYPES[type].cost, 0.5*level); }
function repairCost(type, b){
  const max = maxHpFor(type,b.level);
  const missing = Math.max(0, max-b.hp);
  return scaleCost(BUILDABLE_TYPES[type].cost, (missing/max)*0.7);
}

// ================= NPCs: Reparatur-Trupp und Angreifer (aus der Kaserne) =================

const KASERNE_UNLOCK_LEVEL = 4;
const REPAIR_NPC_CAP = 1;      // bewusst klein - siehe CLAUDE.md, keine endlose Truppenmasse
const ANGREIFER_CAP = 4;
const REPAIR_NPC_BASE_TIME = 25;
const ANGREIFER_STATS = { hp:35, dmg:5, range:190, rate:0.7 }; // Reichweite > jeder Turm, faengt Laeufer vorher ab
const NPC_TRAIN_DEFS = {
  reparatur: { name:"Reparatur-Trupp", cost:{holz:40,stein:25}, baseTime:20, desc:"Repariert automatisch beschädigte Gebäude über Zeit (niedrigste HP zuerst)." },
  angreifer: { name:"Angreifer",       cost:{holz:55,stein:35}, baseTime:28, desc:"Fängt schnelle Läufer ab, bevor sie deine Türme erreichen." }
};

function findBuildingByType(type){
  for(const slot of Object.values(state.cellsByCoord)){
    if(slot.building && slot.building.type===type) return slot.building;
  }
  return null;
}
function findKaserne(){ return findBuildingByType("kaserne"); }
function hasKaserne(){ return !!findKaserne(); }
function findKrankenhaus(){ return findBuildingByType("krankenhaus"); }
function hasKrankenhaus(){ return !!findKrankenhaus(); }
// Krankenhaus ist ein eigenes Gebaeude, getrennt von der Kaserne - seine
// Kapazitaet/Heilzeit haengt an SEINEM Level. Ist es weg oder die
// Kapazitaet voll, ist ein besiegter Angreifer permanent verloren.
function hospitalCapacity(){ const k=findKrankenhaus(); return k ? k.level : 0; }
function healTimeFor(){ const k=findKrankenhaus(); const lvl=k?k.level:1; return Math.max(8, 30-(lvl-1)*4); }
function activeAngreiferCount(){ return state.npc.angreifer.filter(a=>a.status==="aktiv").length; }

// ================= Lager, Wachturm, Handelsposten =================

const LAGER_UNLOCK_LEVEL = 2;
const WACHTURM_UNLOCK_LEVEL = 3;
const HANDEL_UNLOCK_LEVEL = 4;
const BASE_STORAGE_CAP = 150; // Kapazitaet pro Rohstoff, auch ganz ohne Lager

function findLager(){ return findBuildingByType("lager"); }
function hasLager(){ return !!findLager(); }
// Ressourcen sind ohne Lager knapp gedeckelt - Ueberschuss beim Sammeln geht
// verloren, das erzwingt aktives Ausgeben statt endlosem Horten.
function storageCap(){ const l=findLager(); return BASE_STORAGE_CAP + (l ? l.level*80 : 0); }

function findWachturm(){ return findBuildingByType("wachturm"); }
function hasWachturm(){ return !!findWachturm(); }

function findHandelsposten(){ return findBuildingByType("handelsposten"); }
function hasHandelsposten(){ return !!findHandelsposten(); }
// Tauschkurs bleibt immer schlechter als 1:1 - kein Ersatz fuers Sammeln,
// nur eine Notloesung bei Engpass.
function tradeRate(level){ return Math.min(0.75, 0.5+level*0.05); }

// unlockLevel gilt fuer BEIDE Bedingungen zugleich: Basis-Level (genereller
// Spielfortschritt) UND das Level des einzelnen Turms (Investition in genau
// diesen Turm). Nur eins davon zu pruefen erlaubt jeweils einen Exploit:
// nur Basis-Level -> Kanone quasi geschenkt sobald die Basis hoch genug ist;
// nur Turm-Level -> ein einzelner Turm laesst sich unabhaengig vom
// Spielfortschritt hochkaufen.
const WEAPONS = {
  bogen:   { name:"Bogen",   desc:"Standardwaffe, immer verfügbar.", unlockLevel:1 },
  kanone:  { name:"Kanone",  desc:"Mehr Schaden, dafür langsamer.",  unlockLevel:3 },
  moerser: { name:"Mörser",  desc:"Flächenschaden, aber Mindestreichweite - trifft nichts direkt daneben.", unlockLevel:6 }
};

function basisUpgradeCost(level){ return { holz: Math.round(45*Math.pow(1.55,level-1)), stein: Math.round(45*Math.pow(1.55,level-1)) }; }

// ================= Spieler-Level/EXP - eigenstaendig von Basis-Level =================
// Kommt aus zwei echten Quellen: Wellen ueberstehen und irgendwas verbessern
// (Basis-Level oder Gebaeude-Level) - keine Deko-Zahl ohne Bedeutung.

function xpForLevel(level){ return Math.round(60*Math.pow(1.22,level-1)); }
function waveXpReward(){ return 18+state.basisLevel*5; }
function basisUpgradeXp(newLevel){ return 25+newLevel*8; }
function buildingUpgradeXp(newLevel){ return 6+newLevel*3; }

function addPlayerXp(amount){
  state.playerXp += amount;
  let leveledUp = false;
  while(state.playerXp >= xpForLevel(state.playerLevel)){
    state.playerXp -= xpForLevel(state.playerLevel);
    state.playerLevel++;
    leveledUp = true;
  }
  if(leveledUp) playerLevelUpFx = { level: state.playerLevel, startedAt: performance.now() };
  save();
}

// ================= Basis-Level: schaltet Felder frei, laesst das Raster wachsen =================

function unlockCountForLevel(level){ return TUTORIAL_START_UNLOCK + (level-1)*UNLOCK_BATCH; }

function applyUnlocksForCurrentLevel(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const unlockCount = Math.min(unlockCountForLevel(state.basisLevel), list.length);
  list.forEach(([c,r],i)=>{
    const key=c+","+r;
    if(!state.cellsByCoord[key]) state.cellsByCoord[key]={unlocked:false,building:null};
    if(i<unlockCount) state.cellsByCoord[key].unlocked = true;
  });
}
applyUnlocksForCurrentLevel();

function upgradeBasis(){
  const cost = basisUpgradeCost(state.basisLevel);
  if(!canAfford(cost)) return false;
  payCost(cost);
  const oldSize = gridSizeForLevel(state.basisLevel);
  state.basisLevel++;
  const newSize = gridSizeForLevel(state.basisLevel);
  if(newSize>oldSize){
    const shift = centerOf(newSize)-centerOf(oldSize);
    const remapped = {};
    Object.entries(state.cellsByCoord).forEach(([key,val])=>{
      const [c,r] = key.split(",").map(Number);
      remapped[(c+shift)+","+(r+shift)] = val;
    });
    state.cellsByCoord = remapped;
    // Ein laufender Reparatur-Auftrag zeigt sonst nach dem Raster-Umzug auf
    // ein falsches/nicht mehr existierendes Feld.
    if(state.repairJob){
      const [c,r] = state.repairJob.key.split(",").map(Number);
      state.repairJob.key = (c+shift)+","+(r+shift);
    }
  }
  applyUnlocksForCurrentLevel();
  addPlayerXp(basisUpgradeXp(state.basisLevel));
  save();
  return true;
}

function nextLevelDescription(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);
  const currentUnlocked = Math.min(unlockCountForLevel(state.basisLevel), list.length);
  const newSize = gridSizeForLevel(state.basisLevel+1);
  if(newSize>gridSize) return "Vergrößert das Raster auf "+newSize+"x"+newSize+"!";
  const nextUnlocked = Math.min(unlockCountForLevel(state.basisLevel+1), list.length);
  return "+"+(nextUnlocked-currentUnlocked)+" neue Bauplätze";
}

// ================= Tutorial: erste Verteidigung vor der ersten Welle =================

function tutorialTargets(){
  const list = cellList(gridSizeForLevel(state.basisLevel));
  return {
    towers: TUTORIAL_TOWER_IDX.map(i=>list[i]),
    walls: TUTORIAL_WALL_IDX.map(i=>list[i])
  };
}

function checkTutorial(){
  if(state.tutorialDone) return;
  const t = tutorialTargets();
  const towersOk = t.towers.every(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r];
    return slot && slot.building && slot.building.type==="turm";
  });
  const wallsOk = t.walls.every(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r];
    return slot && slot.building && slot.building.type==="mauer";
  });
  if(towersOk && wallsOk && state.tutorialCollected){
    state.tutorialDone = true;
    state.waveTimer = 15;
    save();
  }
}

function tutorialProgressText(){
  const t = tutorialTargets();
  const towersDone = t.towers.filter(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r]; return slot && slot.building && slot.building.type==="turm";
  }).length;
  const wallsDone = t.walls.filter(([c,r])=>{
    const slot = state.cellsByCoord[c+","+r]; return slot && slot.building && slot.building.type==="mauer";
  }).length;
  const done = towersDone+wallsDone+(state.tutorialCollected?1:0);
  return done+"/9";
}

// Naechstes Tutorial-Ziel: welches Feld/Element muss der Spieler als Naechstes antippen?
function nodeForResource(resType){
  return state.nodes
    .filter(n=>WATER_NODE_DEFS.find(d=>d.id===n.id).type===resType)
    .sort((a,b)=>b.amount-a.amount)[0];
}

// Wenn das naechste Pflichtgebaeude gerade nicht bezahlbar ist, zeigt die
// Markierung stattdessen auf den Rohstoff, der noch fehlt - bis es reicht.
function targetForBuilding(type, c, r, label){
  const cost = BUILDABLE_TYPES[type].cost;
  if(canAfford(cost)) return {kind:"cell", c, r, label};
  const missingHolz = Math.max(0, cost.holz-state.resources.holz);
  const missingStein = Math.max(0, cost.stein-state.resources.stein);
  const resType = missingStein>missingHolz ? "stein" : "holz";
  return {kind:"node", node:nodeForResource(resType), label:(resType==="holz"?"Holz":"Stein")+" sammeln"};
}

function nextTutorialTarget(){
  if(state.tutorialDone) return null;
  const t = tutorialTargets();
  for(const [c,r] of t.towers){
    const slot = state.cellsByCoord[c+","+r];
    if(!(slot && slot.building && slot.building.type==="turm")) return targetForBuilding("turm", c, r, "Turm bauen");
  }
  for(const [c,r] of t.walls){
    const slot = state.cellsByCoord[c+","+r];
    if(!(slot && slot.building && slot.building.type==="mauer")) return targetForBuilding("mauer", c, r, "Mauer bauen");
  }
  if(!state.tutorialCollected) return {kind:"node", label:"Rohstoffe sammeln"};
  return null;
}

// ================= Ressourcen-Knoten im Wasser =================

setInterval(()=>{
  let changed=false;
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    if(n.amount<def.capacity){ n.amount++; changed=true; }
  });
  if(changed){ save(); render(); }
}, 900);

function nodeWorldPos(node){
  const radius = gridHalfExtent(gridSizeForLevel(state.basisLevel)) + NODE_WATER_MARGIN;
  const rad = node.angle*Math.PI/180;
  return { x: Math.cos(rad)*radius, y: Math.sin(rad)*radius };
}

// ================= Wellen: Gegner spawnen, Tuerme feuern =================

const WEAPON_STATS = {
  bogen:   { dmg: 6,  range: 130, rate: 0.9,  pierce:false },
  kanone:  { dmg: 14, range: 150, rate: 1.6,  pierce:true  },
  // Moerser: Flaechenschaden statt Einzelziel, aber mit Mindestreichweite
  // (kann nichts direkt neben sich treffen) und langsamer Feuerrate - stark
  // gegen mehrere Laeufer auf einmal, schwach gegen ein einzelnes Ziel.
  moerser: { dmg: 8,  range: 190, minRange: 55, rate: 2.4, pierce:false, splash: 42 }
};
function towerDamage(b){ const w = WEAPON_STATS[b.weapon]||WEAPON_STATS.bogen; return w.dmg + (b.level-1)*2; }
function maxBaseHp(){ return 100 + (state.basisLevel-1)*20; }

// "Kraft" ist reine Anzeige (Machtwert) - fasst zusammen, was man insgesamt
// aufgebaut hat. Aktuell ohne eigene Funktion im Spiel, spaeter Basis fuer
// Vergleiche beim Online-Angreifen (wer ist staerker als wer).
function computeKraft(){
  let kraft = state.basisLevel*10;
  Object.values(state.cellsByCoord).forEach(slot=>{
    if(slot.building) kraft += slot.building.level*5;
  });
  kraft += state.npc.reparaturCount*8;
  kraft += state.npc.angreifer.length*8;
  return kraft;
}

// Zwei Gegnertypen mit echten Gegenspielern statt nur unterschiedlicher Zahlen:
// Laeufer ist schnell/schwach -> stirbt an der schnellen Feuerrate vom Bogen.
// Brecher ist langsam/zaeh und traegt Ruestung, die Bogen-Treffer stark
// abschwaecht - nur die durchschlagende Kanone macht bei ihm vollen Schaden.
const ENEMY_TYPES = {
  laeufer: { name:"Läufer", hpMult:0.55, speedMult:1.7, dmgMult:0.6, r:8,  armor:0, color:"#c9843a" },
  brecher: { name:"Brecher", hpMult:2.6, speedMult:0.55, dmgMult:1.8, r:13, armor:5, color:"#5a3a6a" }
};

let enemies = [];
let projectiles = [];
let waveActive = false;

// Nur wer bereits eine Kanone gebaut hat, kann Bruecher ueberhaupt kontern -
// deshalb tauchen sie nicht einfach ab einem festen Basis-Level auf, sondern
// erst, wenn der Spieler die Kanone tatsaechlich freigeschaltet hat.
function hasKanoneTower(){
  return Object.values(state.cellsByCoord).some(slot=>
    slot.building && slot.building.type==="turm" && slot.building.weapon==="kanone"
  );
}

// HP/Schaden wachsen nur bis zu diesem Level linear mit - danach wird die
// Schwierigkeit ueber neue Gegnertypen/Zusammensetzung geloest, nicht ueber
// endlos steigende Zahlen (sonst wird's bei einem sehr lang angelegten Spiel
// irgendwann absurd).
const STAT_SCALING_CAP_LEVEL = 15;

function pickWaveComposition(){
  const level = state.basisLevel;
  const count = Math.min(3+Math.floor(level/2), 10);
  const canFaceBrecher = hasKanoneTower();
  const brecherChance = canFaceBrecher ? Math.min(0.45, 0.1+level*0.03) : 0;
  const types = [];
  for(let i=0;i<count;i++){
    types.push(Math.random()<brecherChance ? "brecher" : "laeufer");
  }
  return types;
}

function spawnWave(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const spawnRadius = gridHalfExtent(gridSize) + NODE_WATER_MARGIN + 40;
  const scalingLevel = Math.min(state.basisLevel, STAT_SCALING_CAP_LEVEL);
  const baseHp = 26+scalingLevel*6;
  const baseDmg = 5+Math.floor(scalingLevel/2);
  const composition = state.nextWaveComposition || pickWaveComposition();
  state.nextWaveComposition = null;
  composition.forEach(typeKey=>{
    const type = ENEMY_TYPES[typeKey];
    const angle = Math.random()*Math.PI*2;
    const hp = Math.round(baseHp*type.hpMult);
    const enemy = {
      x: Math.cos(angle)*spawnRadius, y: Math.sin(angle)*spawnRadius,
      hp, maxHp: hp, typeKey, armor: type.armor, r: type.r,
      dmg: Math.round(baseDmg*type.dmgMult) || 1,
      speed: (24+Math.random()*8)*type.speedMult,
      attackCd: 0,
      pathIndex: 0
    };
    // Weg wird einmal beim Spawn berechnet (nicht live neu geplant, wenn
    // spaeter noch etwas gebaut wird) - reicht fuer eine einzelne Welle.
    enemy.path = buildEnemyPath(enemy, gridSize);
    enemies.push(enemy);
  });
  waveActive = true;
}

function waveLoot(){
  return { holz: 8+state.basisLevel*4, stein: 6+state.basisLevel*3 };
}

// ================= Wegfindung: Gegner suchen sich einen Weg zur Base statt =================
// ================= wahllos das naechste Gebaeude anzugreifen =================

function gridCellBlocked(c,r,gridSize){
  const slot = state.cellsByCoord[c+","+r];
  return !!(slot && slot.building && slot.building.hp>0);
}

// Dijkstra ueber das Raster: freie Zellen kosten 1, Zellen mit einem noch
// lebenden Gebaeude kosten deutlich mehr - der Pfad weicht Gebaeuden also
// aus, WENN es einen freien Weg gibt, und zerstoert nur das, was wirklich
// im Weg steht (der guenstigste Weg durch, falls kein Umweg existiert).
function computeGridPath(gridSize, startC, startR){
  const c0 = centerOf(gridSize);
  const key = (c,r)=>c+","+r;
  const dist = {}, prev = {}, visited = {};
  const startKey = key(startC,startR);
  dist[startKey] = 0;
  const queue = [[0,startC,startR]];
  while(queue.length){
    let bi=0; for(let i=1;i<queue.length;i++){ if(queue[i][0]<queue[bi][0]) bi=i; }
    const [d,c,r] = queue.splice(bi,1)[0];
    const k = key(c,r);
    if(visited[k]) continue;
    visited[k] = true;
    if(c===c0 && r===c0) break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{
      const nc=c+dc, nr=r+dr;
      if(nc<0||nc>=gridSize||nr<0||nr>=gridSize) return;
      const nk = key(nc,nr);
      if(visited[nk]) return;
      const isBase = (nc===c0 && nr===c0);
      const cost = (!isBase && gridCellBlocked(nc,nr,gridSize)) ? 40 : 1;
      const nd = d+cost;
      if(dist[nk]===undefined || nd<dist[nk]){ dist[nk]=nd; prev[nk]=k; queue.push([nd,nc,nr]); }
    });
  }
  const endKey = key(c0,c0);
  if(dist[endKey]===undefined) return null;
  const path = []; let cur = endKey;
  while(cur){ const [cc,rr]=cur.split(",").map(Number); path.unshift({c:cc,r:rr}); cur = prev[cur]; }
  return path;
}

function nearestEdgeCell(x,y,gridSize){
  let best=null, bestD=Infinity;
  for(let c=0;c<gridSize;c++) for(let r=0;r<gridSize;r++){
    if(c!==0 && c!==gridSize-1 && r!==0 && r!==gridSize-1) continue;
    const p = cellCenter(c,r,gridSize);
    const d = Math.hypot(x-p.x,y-p.y);
    if(d<bestD){ bestD=d; best={c,r}; }
  }
  return best;
}

function buildEnemyPath(e, gridSize){
  const edge = nearestEdgeCell(e.x,e.y,gridSize);
  const raw = computeGridPath(gridSize, edge.c, edge.r);
  if(!raw) return [];
  return raw.map(({c,r})=>({c,r,...cellCenter(c,r,gridSize)}));
}

function damageRandomAngreifer(dmg){
  const active = state.npc.angreifer.filter(a=>a.status==="aktiv");
  if(active.length===0) return;
  const a = active[Math.floor(Math.random()*active.length)];
  a.hp -= dmg;
  if(a.hp<=0){
    const healingCount = state.npc.angreifer.filter(x=>x.status==="verletzt").length;
    if(healingCount < hospitalCapacity()){
      a.status = "verletzt"; a.hp = 0; a.healLeft = healTimeFor();
    } else {
      state.npc.angreifer = state.npc.angreifer.filter(x=>x!==a); // Krankenhaus voll -> permanent verloren
    }
  }
}

const PLAYER_AGGRO_RADIUS = 90; // Gegner in dieser Naehe lassen kurz von ihrem Weg ab und greifen den Spieler an
const PLAYER_COMBAT_RADIUS = 10;
const PLAYER_INVULN_TIME = 1.5; // Sekunden Schonfrist nach einem K.o., damit man nicht sofort wieder erwischt wird

function updateWave(dt){
  if(!state.tutorialDone) return;

  const pl = state.player;
  if(pl.invulnCd>0) pl.invulnCd = Math.max(0, pl.invulnCd-dt);

  if(enemies.length===0){
    // Wachturm rollt die naechste Zusammensetzung vorab aus, damit man sich
    // vorbereiten kann, statt von der Welle ueberrascht zu werden.
    if(hasWachturm() && !state.nextWaveComposition) state.nextWaveComposition = pickWaveComposition();
    state.waveTimer -= dt;
    if(state.waveTimer<=0){
      spawnWave();
      state.waveTimer = MIN_WAVE_GAP + Math.random()*15;
      save();
    }
  }

  const gridSize = gridSizeForLevel(state.basisLevel);

  const c0 = centerOf(gridSize);
  enemies.forEach(e=>{
    if(!e.path) e.path = [];
    if(e.pathIndex===undefined) e.pathIndex = 0;

    // Naechster Wegpunkt auf dem berechneten Pfad zur Base. Kein Pfad
    // (Insel komplett zugebaut und unerreichbar) oder Pfad abgelaufen ->
    // direkt auf die Base zuhalten als Rueckfallebene.
    let waypoint = e.path[e.pathIndex];
    if(!waypoint) waypoint = {c:c0, r:c0, x:0, y:0};

    const isBaseCell = waypoint.c===c0 && waypoint.r===c0;
    const slot = isBaseCell ? null : state.cellsByCoord[waypoint.c+","+waypoint.r];
    const blockingBuilding = (slot && slot.building && slot.building.hp>0) ? slot.building : null;

    let target;
    // Kommt der Spieler einem Gegner zu nahe, laesst der kurz von seinem Weg
    // ab und greift ihn an - der Pfad selbst (pathIndex) bleibt dabei
    // unveraendert, sobald der Spieler wieder ausser Reichweite ist, geht's
    // exakt da weiter, wo der Gegner stehengeblieben ist.
    if(pl.invulnCd<=0 && Math.hypot(pl.x-e.x,pl.y-e.y)<=PLAYER_AGGRO_RADIUS){
      target = {x:pl.x,y:pl.y,r:PLAYER_COMBAT_RADIUS,isPlayer:true};
    } else if(e.typeKey==="laeufer" && activeAngreiferCount()>0 &&
       Math.hypot(e.x,e.y) <= ANGREIFER_STATS.range){
      target = {x:0,y:0,r:24,isAngreifer:true};
    } else if(isBaseCell){
      target = {x:0,y:0,r:29,isBase:true};
    } else if(blockingBuilding){
      // Dieses Gebaeude steht wirklich im Weg (guenstigster Pfad fuehrt
      // durch seine Zelle) - nur DAS wird angegriffen, nicht alles auf der Insel.
      target = {x:waypoint.x,y:waypoint.y,r:27,slot};
    } else {
      // Freies Durchgangsfeld auf dem Weg - hier wird nicht gekaempft,
      // nur durchgelaufen.
      target = {x:waypoint.x,y:waypoint.y,r:4,isWaypoint:true};
    }

    const dist = Math.hypot(target.x-e.x, target.y-e.y);
    const stopDist = target.r+e.r+2;
    if(dist>stopDist){
      const ang = Math.atan2(target.y-e.y, target.x-e.x);
      e.x += Math.cos(ang)*e.speed*dt;
      e.y += Math.sin(ang)*e.speed*dt;
    } else if(target.isWaypoint){
      e.pathIndex++;
    } else {
      e.attackCd -= dt;
      if(e.attackCd<=0){
        e.attackCd = 1;
        if(target.isBase){
          const wasAlive = state.baseHp>0;
          state.baseHp = Math.max(0, state.baseHp-e.dmg);
          if(wasAlive && state.baseHp<=0){
            // Base ueberrannt: alle Gebaeude gehen kaputt (nicht weg - muessen
            // repariert werden) statt dass einfach nichts passiert, wenn man
            // die Base sterben laesst hat das jetzt echte Konsequenzen.
            Object.values(state.cellsByCoord).forEach(s=>{ if(s.building) s.building.hp = 0; });
            state.baseHp = maxBaseHp();
            enemies = [];
            waveActive = false;
          }
        } else if(target.isAngreifer){
          damageRandomAngreifer(e.dmg);
        } else if(target.isPlayer){
          pl.hp = Math.max(0, pl.hp-e.dmg);
          if(pl.hp<=0){
            // K.o.: der komplette Rucksack-Inhalt geht verloren (echtes Risiko
            // beim Sammeln waehrend einer Welle), Respawn an der Base mit
            // kurzer Unverwundbarkeit statt sofortigem erneuten Treffer.
            pl.backpack.holz = 0; pl.backpack.stein = 0;
            pl.x = 0; pl.y = 0;
            pl.hp = PLAYER_MAX_HP;
            pl.invulnCd = PLAYER_INVULN_TIME;
            pl.moveTarget = null;
            knockoutFx = { startedAt: performance.now() };
          }
        } else {
          target.slot.building.hp = Math.max(0, target.slot.building.hp-e.dmg);
          if(target.slot.building.hp<=0) e.pathIndex++; // Weg ist jetzt frei -> weiter Richtung Base
        }
        save();
      }
    }
  });

  Object.entries(state.cellsByCoord).forEach(([key,slot])=>{
    if(!slot.building || slot.building.type!=="turm" || slot.building.hp<=0) return;
    const [c,r] = key.split(",").map(Number);
    const p = cellCenter(c,r,gridSize);
    const b = slot.building;
    const w = WEAPON_STATS[b.weapon]||WEAPON_STATS.bogen;
    b.fireCd = (b.fireCd||0) - dt;
    if(b.fireCd>0) return;
    let nearest=null, nd=Infinity;
    enemies.forEach(e=>{
      const d = Math.hypot(e.x-p.x,e.y-p.y);
      if(d<=w.range && (!w.minRange || d>=w.minRange) && d<nd){ nd=d; nearest=e; }
    });
    if(nearest){
      b.fireCd = w.rate;
      const ang = Math.atan2(nearest.y-p.y, nearest.x-p.x);
      projectiles.push({x:p.x,y:p.y,vx:Math.cos(ang)*260,vy:Math.sin(ang)*260,life:1.2,dmg:towerDamage(b),pierce:w.pierce,splash:w.splash});
    }
  });

  // Angreifer stehen an der Base, haben mehr Reichweite als Tuerme und
  // zielen nur auf Laeufer - sie fangen sie ab, bevor Tuerme reagieren.
  state.npc.angreifer.forEach(a=>{
    if(a.status!=="aktiv") return;
    a.fireCd = (a.fireCd||0) - dt;
    if(a.fireCd>0) return;
    let nearest=null, nd=Infinity;
    enemies.forEach(e=>{
      if(e.typeKey!=="laeufer") return;
      const d = Math.hypot(e.x,e.y);
      if(d<=ANGREIFER_STATS.range && d<nd){ nd=d; nearest=e; }
    });
    if(nearest){
      a.fireCd = ANGREIFER_STATS.rate;
      const ang = Math.atan2(nearest.y,nearest.x);
      projectiles.push({x:0,y:0,vx:Math.cos(ang)*260,vy:Math.sin(ang)*260,life:1.4,dmg:ANGREIFER_STATS.dmg,pierce:false});
    }
  });

  projectiles.forEach(pr=>{ pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt; });
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    let hit = pr.life<=0;
    enemies.forEach(e=>{
      if(!hit && Math.hypot(pr.x-e.x,pr.y-e.y)<e.r+4){
        if(pr.splash){
          // Flaechenschaden: alle Gegner im Radius um den Einschlag treffen,
          // nicht nur das eine Ziel
          const ix=pr.x, iy=pr.y;
          enemies.forEach(e2=>{
            if(Math.hypot(ix-e2.x,iy-e2.y)<=pr.splash){
              const d2 = (e2.armor && !pr.pierce) ? Math.max(1, pr.dmg-e2.armor) : pr.dmg;
              e2.hp -= d2;
            }
          });
        } else {
          const dmg = (e.armor && !pr.pierce) ? Math.max(1, pr.dmg-e.armor) : pr.dmg;
          e.hp -= dmg;
        }
        hit = true;
      }
    });
    if(hit) projectiles.splice(i,1);
  }
  enemies = enemies.filter(e=>e.hp>0);

  if(waveActive && enemies.length===0){
    const loot = waveLoot();
    const cap = storageCap();
    state.resources.holz = Math.min(cap, state.resources.holz+loot.holz);
    state.resources.stein = Math.min(cap, state.resources.stein+loot.stein);
    waveActive = false;
    addPlayerXp(waveXpReward());
    save();
  }
}

// ================= Reparatur-Trupp: repariert automatisch, niedrigste HP% zuerst =================

function updateRepairJob(dt){
  if(state.npc.reparaturCount<=0) return;
  if(state.repairJob){
    const slot = state.cellsByCoord[state.repairJob.key];
    if(!slot || !slot.building){ state.repairJob = null; return; }
    state.repairJob.timeLeft -= dt;
    if(state.repairJob.timeLeft<=0){
      slot.building.hp = maxHpFor(slot.building.type, slot.building.level);
      state.repairJob = null;
      save();
    }
    return;
  }
  let targetKey=null, worstRatio=1;
  Object.entries(state.cellsByCoord).forEach(([key,slot])=>{
    if(!slot.building) return;
    const max = maxHpFor(slot.building.type, slot.building.level);
    if(slot.building.hp<max){
      const ratio = slot.building.hp/max;
      if(ratio<worstRatio){ worstRatio=ratio; targetKey=key; }
    }
  });
  if(!targetKey) return;
  const b = state.cellsByCoord[targetKey].building;
  const cost = repairCost(b.type,b);
  if(!canAfford(cost)) return; // wartet, bis genug Ressourcen da sind
  payCost(cost);
  const k = findKaserne();
  const totalTime = Math.max(4, REPAIR_NPC_BASE_TIME-((k?k.level:1)-1)*3);
  state.repairJob = { key: targetKey, timeLeft: totalTime, totalTime };
  save();
}

// ================= Ausbildung (Kaserne) und Krankenhaus-Heilung =================

function updateTraining(dt){
  if(!state.npc.training) return;
  state.npc.training.timeLeft -= dt;
  if(state.npc.training.timeLeft<=0){
    if(state.npc.training.kind==="reparatur") state.npc.reparaturCount++;
    else state.npc.angreifer.push({ hp:ANGREIFER_STATS.hp, maxHp:ANGREIFER_STATS.hp, status:"aktiv", healLeft:0, fireCd:0 });
    state.npc.training = null;
    save();
  }
}

function updateHospital(dt){
  state.npc.angreifer.forEach(a=>{
    if(a.status!=="verletzt") return;
    a.healLeft -= dt;
    if(a.healLeft<=0){ a.status="aktiv"; a.hp=a.maxHp; save(); }
  });
}

// ================= Kamera (Zoom & Verschieben) =================

const camera = { x:0, y:0, scale:1 };
function clampCamera(){
  const d = Math.hypot(camera.x,camera.y);
  const max = WATER_RADIUS-40;
  if(d>max){ camera.x = camera.x/d*max; camera.y = camera.y/d*max; }
  camera.scale = Math.max(0.5, Math.min(2.4, camera.scale));
}
function screenToWorld(sx,sy){
  return { x:(sx-W/2)/camera.scale + camera.x, y:(sy-H/2)/camera.scale + camera.y };
}

const pointers = new Map();
let dragTotal = 0;
let pinchStartDist = 0, pinchStartScale = 1;

function canvasPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, canvasPos(e));
  dragTotal = 0;
  if(pointers.size===2){
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartScale = camera.scale;
  }
});
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = canvasPos(e);
  pointers.set(e.pointerId, cur);

  if(pointers.size===2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchStartDist>10){ camera.scale = pinchStartScale * (dist/pinchStartDist); clampCamera(); render(); }
  } else if(pointers.size===1){
    const dx = cur.x-prev.x, dy = cur.y-prev.y;
    dragTotal += Math.hypot(dx,dy);
    camera.x -= dx/camera.scale;
    camera.y -= dy/camera.scale;
    clampCamera();
    render();
  }
});
function pointerEnd(e){
  const wasSingle = pointers.size===1;
  const pos = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(wasSingle && dragTotal<8 && pos){
    const w = screenToWorld(pos.x,pos.y);
    handleTap(w.x,w.y);
  }
  if(pointers.size<2) pinchStartDist=0;
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  camera.scale *= (e.deltaY<0) ? 1.1 : 0.9;
  clampCamera(); render();
}, {passive:false});

document.getElementById("zoomIn").addEventListener("click", ()=>{ camera.scale*=1.2; clampCamera(); render(); });
document.getElementById("zoomOut").addEventListener("click", ()=>{ camera.scale*=0.83; clampCamera(); render(); });
document.getElementById("centerBtn").addEventListener("click", ()=>{ camera.x=0; camera.y=0; camera.scale=1; render(); });

// ================= Joystick (Spieler-Steuerung) =================
// Eigene, ungespeicherte Richtung - solange sie aktiv ist, uebersteuert sie
// ein per Tap gesetztes moveTarget (manuelle Kontrolle geht vor Auto-Lauf).
const joystickEl = document.getElementById("joystick");
const joystickKnob = document.getElementById("joystickKnob");
const JOYSTICK_MAX = 40; // px, wie weit der Knopf aus der Mitte wandern kann
let joystickDir = {x:0,y:0}; // normiert, Laenge 0..1
let joystickPointerId = null;

function setJoystickFromEvent(e){
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  let dx = e.clientX-cx, dy = e.clientY-cy;
  const dist = Math.hypot(dx,dy);
  if(dist>JOYSTICK_MAX){ dx = dx/dist*JOYSTICK_MAX; dy = dy/dist*JOYSTICK_MAX; }
  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joystickDir = { x: dx/JOYSTICK_MAX, y: dy/JOYSTICK_MAX };
}
function resetJoystick(){
  joystickDir = {x:0,y:0};
  joystickKnob.style.transform = "translate(0,0)";
}
joystickEl.addEventListener("pointerdown", e=>{
  e.stopPropagation();
  joystickPointerId = e.pointerId;
  joystickEl.setPointerCapture(e.pointerId);
  setJoystickFromEvent(e);
});
joystickEl.addEventListener("pointermove", e=>{
  if(e.pointerId!==joystickPointerId) return;
  setJoystickFromEvent(e);
});
function joystickEnd(e){
  if(e.pointerId!==joystickPointerId) return;
  joystickPointerId = null;
  resetJoystick();
}
joystickEl.addEventListener("pointerup", joystickEnd);
joystickEl.addEventListener("pointercancel", joystickEnd);

// ================= Rendern =================

function drawRoundRect(x,y,w,h,r,fill){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fillStyle = fill; ctx.fill();
}
function hashRand(seed){ const x=Math.sin(seed*12.9898)*43758.5453; return x-Math.floor(x); }

// ================= Prozedurale Texturen =================
// Statt flacher Farbflaechen bekommen Gras/Stein/Holz/Wasser echte
// Materialstruktur: Value-Noise (weiches Rauschen mit Interpolation, kein
// hartes Bildrauschen) wird EINMAL beim Start in Offscreen-Canvases
// gerendert und danach als Pattern wiederverwendet - kostet zur Laufzeit
// also nichts. Bewusst ohne ctx.filter, weil das auf iOS-Safari lange
// nicht unterstuetzt war.

function noiseHash(x,y,seed){
  const n = Math.sin(x*127.1+y*311.7+seed*74.7)*43758.5453;
  return n-Math.floor(n);
}

function valueNoise(x,y,seed){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  // Smoothstep, damit die Uebergaenge weich sind statt kantig
  const sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
  const n00=noiseHash(xi,yi,seed),   n10=noiseHash(xi+1,yi,seed);
  const n01=noiseHash(xi,yi+1,seed), n11=noiseHash(xi+1,yi+1,seed);
  return (n00*(1-sx)+n10*sx)*(1-sy) + (n01*(1-sx)+n11*sx)*sy;
}

// Fraktales Rauschen: mehrere Oktaven uebereinander = grobe Flecken PLUS
// feine Koernung, so wie echte Oberflaechen aussehen.
function fbm(x,y,seed,octaves){
  let sum=0, amp=0.5, freq=1;
  for(let o=0;o<octaves;o++){
    sum += valueNoise(x*freq,y*freq,seed+o*13)*amp;
    freq *= 2; amp *= 0.5;
  }
  return sum;
}

function makeTextureCanvas(size, pixelFn){
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const c = cv.getContext("2d");
  const img = c.createImageData(size,size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const px = pixelFn(x,y,size);
    const i = (y*size+x)*4;
    img.data[i]=px[0]; img.data[i+1]=px[1]; img.data[i+2]=px[2]; img.data[i+3]=px[3];
  }
  c.putImageData(img,0,0);
  return cv;
}

const TEX = {};
function buildTextures(){
  const S = 128;

  // Gras: gedecktes Oliv/Salbei mit groben Flecken und feiner Koernung
  TEX.grass = ctx.createPattern(makeTextureCanvas(S,(x,y)=>{
    const n = fbm(x/26,y/26,3.1,4);
    const fine = valueNoise(x/2.2,y/2.2,9.7);
    const v = n*0.78 + fine*0.22;
    const r = 70 + v*46, g = 92 + v*54, b = 52 + v*32;
    return [r|0, g|0, b|0, 255];
  }), "repeat");

  // Stein: grauer Fels mit dunklen Rissen
  TEX.stone = ctx.createPattern(makeTextureCanvas(S,(x,y)=>{
    const n = fbm(x/18,y/18,17.3,4);
    // Risse: scharfe dunkle Linien dort, wo das Rauschen einen Grat bildet
    const ridge = Math.abs(fbm(x/34,y/34,41.9,3)-0.5);
    const crack = ridge<0.035 ? 0.55 : 1;
    const v = (0.55+n*0.45)*crack;
    const g = 118*v;
    return [(g*1.02)|0, (g*1.04)|0, (g*1.1)|0, 255];
  }), "repeat");

  // Holz: gerichtete Maserung (in Y gestreckt), plus Aeste/Knoten
  TEX.wood = ctx.createPattern(makeTextureCanvas(S,(x,y)=>{
    const grain = fbm(x/7, y/44, 5.5, 3);
    const rings = Math.sin((x*0.35 + grain*9)) * 0.5 + 0.5;
    const v = 0.58 + grain*0.26 + rings*0.16;
    return [(128*v)|0, (92*v)|0, (58*v)|0, 255];
  }), "repeat");

  // Wasseroberflaeche: sehr weiches Rauschen, wird spaeter nur als
  // leichte Stoerung UEBER den Farbverlauf gelegt
  TEX.waterNoise = ctx.createPattern(makeTextureCanvas(S,(x,y)=>{
    const n = fbm(x/30,y/30,77.1,3);
    const a = 26 + n*40;
    return [210,238,255, a|0];
  }), "repeat");

  // Feine Koernung fuer den Grading-Pass (nimmt den "sauberen Vektor"-Look)
  TEX.grain = ctx.createPattern(makeTextureCanvas(64,(x,y)=>{
    const n = noiseHash(x,y,3.3);
    const g = 128 + (n-0.5)*70;
    return [g|0,g|0,g|0,255];
  }), "repeat");
}

// ================= Inselform / Kuestenlinie =================
// Die Bauflaeche bleibt exakt das quadratische Raster (Spiellogik unveraendert),
// aber die LANDMASSE bekommt eine organische Kontur: ein Superellipsen-
// "Squircle" mit Rausch-Wobble. Ein perfektes Quadrat ist der groesste
// Brettspiel-Look, den die Karte hatte.
function islandRadiusAt(theta, baseHalf, wobbleAmp, seed){
  const n = 4.2;
  const c = Math.abs(Math.cos(theta)), s = Math.abs(Math.sin(theta));
  const squircle = Math.pow(Math.pow(c,n)+Math.pow(s,n), -1/n);
  const w = (fbm(Math.cos(theta)*2.2+7, Math.sin(theta)*2.2+7, seed, 3)-0.5)*wobbleAmp;
  return baseHalf*squircle + w;
}

function traceIslandPath(baseHalf, wobbleAmp, seed){
  const steps = 180;
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const th = (i/steps)*Math.PI*2;
    const rr = islandRadiusAt(th, baseHalf, wobbleAmp, seed);
    const px = Math.cos(th)*rr, py = Math.sin(th)*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function drawIslandBase(gridSize){
  const half = gridHalfExtent(gridSize);

  // 1. Flachwasser-Hof: heller Saum im Wasser rund um die Insel, wie ein
  // Sandbank-Schelf - erzeugt Tiefeneindruck statt harter Kante.
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  [[112,0.05],[78,0.07],[48,0.09]].forEach(([pad,al])=>{
    traceIslandPath(half+pad, 26, 4.4);
    ctx.fillStyle = "rgba(150,214,220,"+al+")";
    ctx.fill();
  });
  ctx.restore();

  // 2. Dunkler Saum direkt unter der Graskante: die Insel wirft Schatten
  // ins Wasser, dadurch sitzt das Land drin statt daraufgeklebt zu sein.
  ctx.save();
  traceIslandPath(half+16, 13, 4.4);
  ctx.strokeStyle = "rgba(4,16,22,0.42)"; ctx.lineWidth = 9;
  ctx.stroke();
  ctx.restore();

  // 3. Schaumsaum genau auf der Graskante
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const t = performance.now()/1000;
  [[10,0.13],[5,0.22]].forEach(([lw,al])=>{
    traceIslandPath(half+15+Math.sin(t*1.2)*1.4, 13, 4.4);
    ctx.strokeStyle = "rgba(238,250,252,"+al+")"; ctx.lineWidth = lw;
    ctx.stroke();
  });
  ctx.restore();
}

// Weicher Schatten: gestapelte Ellipsen mit abnehmender Deckkraft statt
// einer harten schwarzen Flaeche - sieht aus wie ein echter Halbschatten
// und funktioniert ohne ctx.filter (iOS-kompatibel).
function drawShadow(x,y,rx,ry){
  const layers = [[1.35,0.055],[1.15,0.075],[0.95,0.1],[0.75,0.12]];
  layers.forEach(([sc,al])=>{
    ctx.beginPath();
    ctx.ellipse(x+rx*0.12, y+ry*0.6, rx*sc, ry*sc, 0, 0, Math.PI*2);
    ctx.fillStyle="rgba(8,14,10,"+al+")"; ctx.fill();
  });
}

function drawWater(){
  const t = performance.now()/1000;

  // 1. Tiefenverlauf: flaches Schelfwasser an der Insel, tiefes, fast
  // schwarzes Blau nach aussen - gedeckt, nicht Candy-Tuerkis.
  const grad = ctx.createRadialGradient(0,0,WATER_RADIUS*0.1, 0,0,WATER_RADIUS*1.2);
  grad.addColorStop(0,    "#2b6b72");
  grad.addColorStop(0.18, "#1d5665");
  grad.addColorStop(0.45, "#123f52");
  grad.addColorStop(0.75, "#0a293a");
  grad.addColorStop(1,    "#04141f");
  ctx.fillStyle = grad;
  ctx.fillRect(-4000,-4000,8000,8000);

  // 2. Oberflaechenstruktur: prozedurales Rauschen driftet langsam ueber
  // das Wasser - nimmt dem Verlauf den "glatte Farbflaeche"-Look.
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.globalCompositeOperation = "soft-light";
  ctx.translate((t*7)%128, (t*4)%128);
  ctx.fillStyle = TEX.waterNoise;
  ctx.fillRect(-4200,-4200,8400,8400);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.1;
  ctx.globalCompositeOperation = "overlay";
  ctx.translate(-((t*5)%128), (t*9)%128);
  ctx.fillStyle = TEX.waterNoise;
  ctx.fillRect(-4200,-4200,8400,8400);
  ctx.restore();

  // 3. Breite Sonnenreflexion (Glitzerband) statt gleichmaessiger Flecken -
  // ein klar gerichtetes Licht wirkt sofort "echter".
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const sunX = -WATER_RADIUS*0.42, sunY = -WATER_RADIUS*0.5;
  const sg = ctx.createRadialGradient(sunX,sunY,10, sunX,sunY,WATER_RADIUS*0.85);
  sg.addColorStop(0,"rgba(255,244,214,0.3)");
  sg.addColorStop(0.35,"rgba(190,224,230,0.1)");
  sg.addColorStop(1,"rgba(120,180,200,0)");
  ctx.fillStyle=sg; ctx.fillRect(-4000,-4000,8000,8000);
  ctx.restore();

  // 4. Wellenkaemme: kurze, versetzte Striche statt durchgehender Linien -
  // durchgehende Linien ueber den ganzen Bildschirm sehen gezeichnet aus.
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.lineCap = "round";
  for(let i=0;i<120;i++){
    const a = hashRand(i*5.13)*Math.PI*2;
    const d = 70+hashRand(i*2.71)*WATER_RADIUS*1.05;
    const drift = ((t*11*(0.6+hashRand(i*7.7)*0.8)) % 140) - 70;
    const wx = Math.cos(a)*d + drift, wy = Math.sin(a)*d;
    const len = 9+hashRand(i*3.3)*22;
    const near = 1-Math.min(1, d/(WATER_RADIUS*1.1));
    const al = (0.05+0.14*near)*(0.5+0.5*Math.sin(t*1.7+i));
    ctx.strokeStyle = "rgba(226,244,252,"+al.toFixed(3)+")";
    ctx.lineWidth = 1+hashRand(i*9.1)*1.4;
    ctx.beginPath();
    ctx.moveTo(wx-len/2, wy);
    ctx.quadraticCurveTo(wx, wy-2.5, wx+len/2, wy);
    ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.restore();

  // 5. Aeussere Vignette: Tiefe/Abschluss nach aussen
  const edge = ctx.createRadialGradient(0,0,WATER_RADIUS*0.75,0,0,WATER_RADIUS*1.45);
  edge.addColorStop(0,"rgba(2,8,14,0)"); edge.addColorStop(1,"rgba(2,8,14,0.72)");
  ctx.fillStyle=edge; ctx.beginPath(); ctx.arc(0,0,WATER_RADIUS*1.45,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(0,0,WATER_RADIUS,0,Math.PI*2);
  ctx.strokeStyle = "rgba(200,222,232,0.22)"; ctx.lineWidth = 2/camera.scale;
  ctx.setLineDash([16/camera.scale,14/camera.scale]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(210,228,238,0.45)"; ctx.font = "600 "+(13/camera.scale)+"px sans-serif"; ctx.textAlign="center";
  ctx.fillText("offene See →", 0, -WATER_RADIUS+24/camera.scale);
  ctx.textAlign="left";
}

// ================= Hafen (Steg mit Bootsplaetzen, ab HAFEN_UNLOCK_LEVEL) =================
// Struktur/Optik erstmal fertig - was Boot 1 konkret tut, ist noch offen
// und wird erst gebaut, wenn das feststeht (kein Sammel-Loop ohne echte
// Funktion dahinter).

const HAFEN_BERTH_SIZE = CELL*3;   // Platz fuer ein 3x3-Boot
const HAFEN_GAP = CELL*0.55;       // Steg-Stueck zwischen den beiden Plaetzen

function hafenLayout(gridSize){
  const x0 = -gridHalfExtent(gridSize); // linke Kante der Insel
  const berthW = HAFEN_BERTH_SIZE, berthH = HAFEN_BERTH_SIZE;
  const totalH = berthH*2 + HAFEN_GAP;
  const topY = -totalH/2;
  return {
    walkway: { x: x0-CELL, y: -CELL*0.35, w: CELL, h: CELL*0.7 },
    berthA: { x: x0-berthW, y: topY, w: berthW, h: berthH, locked:false },
    berthB: { x: x0-berthW, y: topY+berthH+HAFEN_GAP, w: berthW, h: berthH, locked:true }
  };
}

function drawHafen(gridSize){
  if(state.basisLevel < HAFEN_UNLOCK_LEVEL) return;
  const L = hafenLayout(gridSize);

  drawRoundRect(L.walkway.x, L.walkway.y, L.walkway.w, L.walkway.h, 2, "#8a6a3f");

  [L.berthA, L.berthB].forEach(b=>{
    drawShadow(b.x+b.w/2, b.y+b.h+4, b.w*0.45, 6);
    drawRoundRect(b.x, b.y, b.w, b.h, 6, b.locked ? "#5c5646" : "#8a6a3f");
    ctx.strokeStyle = "rgba(0,0,0,0.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(b.x,b.y,b.w,b.h,6); ctx.stroke();
    // Planken-Linien quer zum Steg
    ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 1.5;
    for(let i=1;i<6;i++){
      const ly = b.y + (b.h/6)*i;
      ctx.beginPath(); ctx.moveTo(b.x+4, ly); ctx.lineTo(b.x+b.w-4, ly); ctx.stroke();
    }
    if(b.locked){
      ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.font = "18px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("🔒", b.x+b.w/2, b.y+b.h/2-2);
      ctx.fillStyle = "#eee"; ctx.font = "600 10px sans-serif";
      ctx.fillText("später", b.x+b.w/2, b.y+b.h/2+16);
      ctx.textAlign = "left";
    }
  });
}

function drawGrassTile(x,y,c,r){
  const x0 = x-CELL/2, y0 = y-CELL/2;

  // 1. Echte Grastextur (prozedural, gedecktes Oliv) als Basis - keine
  // flache Farbflaeche mehr. Das Pattern wird verschoben, damit nicht
  // jedes Feld identisch aussieht.
  ctx.save();
  ctx.beginPath(); ctx.rect(x0,y0,CELL,CELL); ctx.clip();
  ctx.translate(x0,y0);
  ctx.fillStyle = TEX.grass;
  ctx.fillRect(-((c*37)%128), -((r*53)%128), CELL+128, CELL+128);
  ctx.restore();

  // 2. Bodenkontakt-Schattierung: Feldraender leicht abdunkeln, so wirkt
  // die Flaeche wie Gelaende statt wie ein Schachbrett-Kachel.
  const edge = ctx.createLinearGradient(x0,y0,x0,y0+CELL);
  edge.addColorStop(0,"rgba(255,252,235,0.07)");
  edge.addColorStop(0.35,"rgba(0,0,0,0)");
  edge.addColorStop(1,"rgba(10,18,8,0.2)");
  ctx.fillStyle = edge; ctx.fillRect(x0,y0,CELL,CELL);

  // 3. Grasbueschel mit Licht-/Schattenseite (Licht kommt von oben links)
  const seed = c*131+r*911;
  for(let k=0;k<5;k++){
    const bx = x+(hashRand(seed+k)-0.5)*CELL*0.8;
    const by = y+(hashRand(seed+k+40)-0.5)*CELL*0.8;
    for(let b=0;b<4;b++){
      const ang = -Math.PI/2 + (hashRand(seed+k*3+b)-0.5)*1.0;
      const len = 5+hashRand(seed+k+b*7)*4;
      ctx.strokeStyle = "rgba(24,44,16,0.45)"; ctx.lineWidth=1.5; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(bx+b*2-3, by);
      ctx.lineTo(bx+b*2-3+Math.cos(ang)*len, by+Math.sin(ang)*len);
      ctx.stroke();
      ctx.strokeStyle = "rgba(190,205,140,0.16)"; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.moveTo(bx+b*2-3.6, by-0.4);
      ctx.lineTo(bx+b*2-3.6+Math.cos(ang)*len*0.8, by-0.4+Math.sin(ang)*len*0.8);
      ctx.stroke();
      ctx.lineCap="butt";
    }
  }

  // 4. Vereinzelte Steinchen/Erdflecken statt bunter Bluemchen
  if(hashRand(seed*3.7)>0.66){
    const fx = x+(hashRand(seed+99)-0.5)*CELL*0.65, fy = y+(hashRand(seed+77)-0.5)*CELL*0.65;
    ctx.beginPath(); ctx.ellipse(fx,fy,2.6,1.9,hashRand(seed+5)*3,0,Math.PI*2);
    ctx.fillStyle="rgba(120,116,104,0.55)"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx-0.6,fy-0.6,1.5,1,hashRand(seed+5)*3,0,Math.PI*2);
    ctx.fillStyle="rgba(178,176,164,0.45)"; ctx.fill();
  }
}

function drawPlusButton(x,y){
  drawShadow(x,y+16,20,6);
  const grad = ctx.createLinearGradient(x,y-22,x,y+22);
  grad.addColorStop(0,"rgba(255,255,255,0.16)"); grad.addColorStop(1,"rgba(0,0,0,0.12)");
  drawRoundRect(x-22,y-22,44,44,8,grad);
  ctx.strokeStyle="rgba(255,255,255,0.32)"; ctx.lineWidth=1.5;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,8); ctx.stroke();
  ctx.strokeStyle="rgba(230,255,235,0.9)"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.stroke();
  ctx.lineCap="butt";
}

function drawLockedButton(x,y){
  drawShadow(x,y+16,20,6);
  const grad = ctx.createLinearGradient(x,y-22,x,y+22);
  grad.addColorStop(0,"rgba(10,16,14,0.38)"); grad.addColorStop(1,"rgba(10,16,14,0.2)");
  drawRoundRect(x-22,y-22,44,44,8,grad);
  ctx.strokeStyle="rgba(255,255,255,0.14)"; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-22,y-22,44,44,8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(200,208,218,0.55)"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(x,y-3,5,Math.PI,0); ctx.stroke();
  drawRoundRect(x-7,y-3,14,10,2,"rgba(200,208,218,0.55)");
}

function drawLevelPips(x,y,level){
  const n = Math.min(level,5);
  const w = n*7-3;
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(x-w/2+i*7, y, 2.1, 0, Math.PI*2);
    ctx.fillStyle = "#f2c94c"; ctx.fill();
  }
}

function drawHpBar(x,y,hp,maxHp,w){
  if(hp>=maxHp) return;
  const ratio = Math.max(0,hp/maxHp);
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(x-w/2,y,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(x-w/2,y,w*ratio,4);
}

function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,(n>>16)+amt));
  const g = Math.max(0,Math.min(255,((n>>8)&0xff)+amt));
  const b = Math.max(0,Math.min(255,(n&0xff)+amt));
  return "rgb("+r+","+g+","+b+")";
}

function drawPlayerSprite(){
  const pl = state.player;
  const x=pl.x, y=pl.y;

  if(pl.moveTarget){
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1.6;
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(pl.moveTarget.x,pl.moveTarget.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.save();
  // Kurzes Blinken waehrend der Unverwundbarkeit nach einem K.o.
  if(pl.invulnCd>0) ctx.globalAlpha = (Math.floor(performance.now()/120)%2===0) ? 0.4 : 1;

  drawShadow(x,y+13,10,4);
  // Rucksack (hinter dem Koerper), Fuellstand als kleiner Ring
  const total = backpackTotal();
  const fillRatio = Math.max(0, Math.min(1, total/BACKPACK_CAPACITY));
  const bpX = x-9, bpY = y-2;
  drawRoundRect(bpX-6,bpY-7,12,15,3,"#6a4c2a");
  ctx.strokeStyle="#3a2612"; ctx.lineWidth=1.2; ctx.strokeRect(bpX-6,bpY-7,12,15);
  if(total>0){
    ctx.beginPath(); ctx.arc(bpX,bpY,9,-Math.PI/2,-Math.PI/2+Math.PI*2*fillRatio);
    ctx.strokeStyle = fillRatio>=1 ? "#e04a4a" : "#f2c94c"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  }
  // Beine
  ctx.fillStyle="#3a3f5a";
  ctx.fillRect(x-5,y+6,4,9); ctx.fillRect(x+1,y+6,4,9);
  // Koerper - gedecktes Stahlblau statt Comic-Hellblau
  const bodyGrad = ctx.createLinearGradient(x,y-8,x,y+8);
  bodyGrad.addColorStop(0,"#3f6699"); bodyGrad.addColorStop(1,"#2a4a73");
  drawRoundRect(x-8,y-8,16,15,4,bodyGrad);
  ctx.strokeStyle="#1c3350"; ctx.lineWidth=1.3; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-8,y-8,16,15,4); ctx.stroke();
  // Kopf
  ctx.beginPath(); ctx.arc(x,y-13,7,0,Math.PI*2);
  ctx.fillStyle="#e8b48a"; ctx.fill();
  ctx.strokeStyle="#a5764f"; ctx.lineWidth=1; ctx.stroke();
  // Haare
  ctx.beginPath(); ctx.arc(x,y-16,6,Math.PI,0); ctx.fillStyle="#5a3a22"; ctx.fill();
  // Augen
  ctx.fillStyle="#2a1f18";
  ctx.beginPath(); ctx.arc(x-2.5,y-13,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2.5,y-13,1,0,Math.PI*2); ctx.fill();

  // Rucksack-Kapazitaet als x/x ueber dem Kopf
  ctx.font = "bold 10px system-ui, sans-serif";
  ctx.textAlign = "center";
  const capLabel = total+"/"+BACKPACK_CAPACITY;
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.strokeText(capLabel, x, y-24);
  ctx.fillStyle = fillRatio>=1 ? "#e04a4a" : "#fff";
  ctx.fillText(capLabel, x, y-24);
  ctx.textAlign = "left";

  ctx.restore();
  // HP-Leiste (ausserhalb des Blink-Alpha, damit sie auch waehrend der
  // Unverwundbarkeit klar lesbar bleibt)
  drawHpBar(x, y-38, pl.hp, PLAYER_MAX_HP, 24);
}

function drawDepositFx(){
  if(!depositFx) return;
  const elapsed = performance.now()-depositFx.startedAt;
  if(elapsed>=DEPOSIT_FX_DURATION){ depositFx = null; return; }
  const t = elapsed/DEPOSIT_FX_DURATION;
  const rise = t*26, alpha = 1-t;
  const label = "+"+depositFx.holz+" 🌳  +"+depositFx.stein+" 🪨";
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.strokeText(label, 0, -40-rise);
  ctx.fillStyle = "#fff";
  ctx.fillText(label, 0, -40-rise);
  ctx.restore();
}

function drawEnemy(e){
  const type = ENEMY_TYPES[e.typeKey] || {color:"#8a2f2f"};
  drawShadow(e.x,e.y+e.r,e.r*1.3,4);
  const bodyGrad = ctx.createRadialGradient(e.x-e.r*0.35,e.y-e.r*0.35,e.r*0.1,e.x,e.y,e.r*1.15);
  bodyGrad.addColorStop(0, shadeColor(type.color,45));
  bodyGrad.addColorStop(1, shadeColor(type.color,-25));
  ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fillStyle=bodyGrad; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.45)"; ctx.lineWidth=2; ctx.stroke();
  if(e.armor){
    // Ruestungsplatten mit Nieten
    ctx.strokeStyle="rgba(225,228,235,0.85)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,0.35,1.65); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r-3,Math.PI+0.35,Math.PI+1.65); ctx.stroke();
    ctx.fillStyle="rgba(200,204,212,0.9)";
    [0.55,1.0,1.45].forEach(a=>{ ctx.beginPath(); ctx.arc(e.x+Math.cos(a)*(e.r-3),e.y+Math.sin(a)*(e.r-3),1.1,0,Math.PI*2); ctx.fill(); });
  }
  // Augen (leicht wuetend, je nach Typ)
  const eyeDx = e.r*0.32, eyeDy = -e.r*0.08;
  [-1,1].forEach(s=>{
    ctx.beginPath(); ctx.arc(e.x+s*eyeDx,e.y+eyeDy,e.r*0.16,0,Math.PI*2);
    ctx.fillStyle="#1a1410"; ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+s*eyeDx-e.r*0.05,e.y+eyeDy-e.r*0.05,e.r*0.05,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.8)"; ctx.fill();
  });
  ctx.strokeStyle="rgba(0,0,0,0.55)"; ctx.lineWidth=1.4; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(e.x-eyeDx-e.r*0.16,e.y+eyeDy-e.r*0.22); ctx.lineTo(e.x-eyeDx+e.r*0.1,e.y+eyeDy-e.r*0.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(e.x+eyeDx+e.r*0.16,e.y+eyeDy-e.r*0.22); ctx.lineTo(e.x+eyeDx-e.r*0.1,e.y+eyeDy-e.r*0.1); ctx.stroke();
  ctx.lineCap="butt";
  ctx.beginPath(); ctx.arc(e.x-e.r*0.35,e.y-e.r*0.4,e.r*0.18,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fill();
  const w=e.r*2.2, ratio=Math.max(0,e.hp/e.maxHp), by=e.y-e.r-9;
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(e.x-w/2,by,w,4);
  ctx.fillStyle = ratio>0.5 ? "#6ad46a" : ratio>0.25 ? "#e0c34a" : "#e04a4a";
  ctx.fillRect(e.x-w/2,by,w*ratio,4);
}

function drawProjectile(pr){
  const ang = Math.atan2(pr.vy,pr.vx);
  const tx = pr.x-Math.cos(ang)*9, ty = pr.y-Math.sin(ang)*9;
  const trail = ctx.createLinearGradient(tx,ty,pr.x,pr.y);
  trail.addColorStop(0,"rgba(242,201,76,0)"); trail.addColorStop(1,"rgba(255,224,140,0.85)");
  ctx.strokeStyle=trail; ctx.lineWidth=2.6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(pr.x,pr.y); ctx.stroke();
  ctx.lineCap="butt";
  const glow = ctx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,5);
  glow.addColorStop(0,"rgba(255,240,190,0.9)"); glow.addColorStop(1,"rgba(255,240,190,0)");
  ctx.beginPath(); ctx.arc(pr.x,pr.y,5,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
  ctx.beginPath(); ctx.arc(pr.x,pr.y,2.6,0,Math.PI*2);
  ctx.fillStyle="#fff3c4"; ctx.fill();
}

function drawTutorialHighlight(x,y,label){

// Fuellt eine Flaeche mit einer echten Material-Textur und legt danach
// Licht/Schatten darueber: Lichtkante oben links, Kernschatten unten rechts,
// dunkler Rand aussen. Das ist der Unterschied zwischen "flache Farbe" und
// "Material mit Volumen".
function fillTexturedBlock(x0,y0,w,h,r,pattern,seed,tintTop,tintBottom){
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x0,y0,w,h,r); else ctx.rect(x0,y0,w,h);
  ctx.clip();
  ctx.save();
  ctx.translate(x0-((seed*29)%128), y0-((seed*61)%128));
  ctx.fillStyle = pattern;
  ctx.fillRect(0,0,w+128,h+128);
  ctx.restore();
  // Materialfarbe einfaerben (multiply behaelt die Struktur)
  ctx.globalCompositeOperation = "multiply";
  const tint = ctx.createLinearGradient(x0,y0,x0,y0+h);
  tint.addColorStop(0,tintTop); tint.addColorStop(1,tintBottom);
  ctx.fillStyle = tint; ctx.fillRect(x0,y0,w,h);
  // Volumen: Licht oben links, Schatten unten rechts
  ctx.globalCompositeOperation = "source-over";
  const vol = ctx.createLinearGradient(x0,y0,x0+w*0.7,y0+h);
  vol.addColorStop(0,"rgba(255,246,222,0.2)");
  vol.addColorStop(0.42,"rgba(255,255,255,0)");
  vol.addColorStop(1,"rgba(10,14,22,0.36)");
  ctx.fillStyle = vol; ctx.fillRect(x0,y0,w,h);
  // Innerer dunkler Saum (Ambient Occlusion an den Kanten)
  ctx.strokeStyle="rgba(12,16,22,0.3)"; ctx.lineWidth=3;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x0+1.5,y0+1.5,w-3,h-3,Math.max(1,r-1)); ctx.stroke();
  ctx.restore();
}

function drawTowerSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-2,21,6);
  fillTexturedBlock(x-s,y-s,s*2,s*2,5,TEX.stone,b.level*7+3,
    "rgba(188,196,206,1)","rgba(128,138,150,1)");
  // Steinfugen, leicht versetzt wie echtes Mauerwerk
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,5); ctx.clip();
  for(let i=1;i<5;i++){
    const yy=y-s+i*(s*2/5);
    ctx.strokeStyle="rgba(18,22,28,0.3)"; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(x-s,yy); ctx.lineTo(x+s,yy); ctx.stroke();
    ctx.strokeStyle="rgba(255,252,240,0.1)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x-s,yy+1.2); ctx.lineTo(x+s,yy+1.2); ctx.stroke();
    const off = (i%2===0)?0:(s*2)/3/2;
    for(let xx=x-s+off; xx<x+s; xx+=(s*2)/3){
      ctx.strokeStyle="rgba(18,22,28,0.26)"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy-(s*2/5)); ctx.stroke();
    }
  }
  ctx.restore();
  // Zinnen (Kraneliert) oben, jede mit eigener Licht-/Schattenseite
  const cz=6.5;
  [-s+2, -s+2+cz*2.2, s-cz*3.2, s-cz-2].forEach(dx=>{
    fillTexturedBlock(x+dx,y-s-4,cz,8,1.5,TEX.stone,dx+11,
      "rgba(196,204,214,1)","rgba(140,150,162,1)");
  });
  // Wach-Kuppel mit Verlauf - gedecktes Rostrot statt Comic-Rot
  const domeGrad = ctx.createRadialGradient(x-4,y-8,2,x,y-3,14);
  domeGrad.addColorStop(0,"#a44a44"); domeGrad.addColorStop(1,"#6e2c28");
  ctx.beginPath(); ctx.arc(x,y-3,13,0,Math.PI*2);
  ctx.fillStyle=domeGrad; ctx.fill();
  ctx.strokeStyle="#421a18"; ctx.lineWidth=2; ctx.stroke();
  // Sichtschlitz
  ctx.fillStyle="rgba(20,10,10,0.5)"; drawRoundRect(x-4,y-6,8,5,2,"rgba(20,10,10,0.5)");
  ctx.beginPath(); ctx.arc(x-4,y-7,3,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.fill();
  if(b.weapon==="moerser"){
    // Dicke, leicht schraeg nach oben zeigende Moerser-Roehre
    ctx.save(); ctx.translate(x,y-9); ctx.rotate(-0.35);
    ctx.fillStyle="#2f4a34"; drawRoundRect(-5,-3,10,15,3,"#2f4a34");
    ctx.fillStyle="#4a6f52"; ctx.fillRect(-5,-3,10,4);
    ctx.strokeStyle="#1a2e1f"; ctx.lineWidth=1.3; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(-5,-3,10,15,3); ctx.stroke();
    ctx.restore();
  } else {
    const weaponColor = b.weapon==="kanone" ? "#3a3a42" : "#8a6a3a";
    ctx.fillStyle = weaponColor; ctx.fillRect(x-3,y-19,6,11);
    ctx.fillStyle = b.weapon==="kanone" ? "#6a6a75" : "#c9a06a"; ctx.fillRect(x-3,y-19,6,3);
  }
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("turm",b.level), 34);
}

function drawWallSpriteWood(x,y,b){
  const s=25;
  // Einzelne Palisaden-Bohlen, jede mit eigener Maserung und eigener
  // Licht-/Schattenseite - statt einer Flaeche mit aufgemalten Linien.
  const planks = 4, pw = (s*2)/planks;
  for(let i=0;i<planks;i++){
    const px = x-s+i*pw;
    fillTexturedBlock(px+0.5, y-s, pw-1, s*2, 2, TEX.wood, i*17+b.level,
      "rgba(196,150,104,1)","rgba(132,94,58,1)");
    // Rundung der Bohle: Glanzkante links, Schattenkante rechts
    ctx.fillStyle="rgba(255,240,210,0.14)"; ctx.fillRect(px+1,y-s,1.6,s*2);
    ctx.fillStyle="rgba(16,10,4,0.26)"; ctx.fillRect(px+pw-2.4,y-s,1.8,s*2);
  }
  // Zwei Querbalken, deutlich davor liegend
  [-8, 12].forEach(dy=>{
    fillTexturedBlock(x-s-1, y+dy, s*2+2, 8, 2, TEX.wood, dy+41,
      "rgba(176,132,88,1)","rgba(112,78,46,1)");
    ctx.fillStyle="rgba(10,6,2,0.22)"; ctx.fillRect(x-s-1, y+dy+8, s*2+2, 2.4);
    // Nagelkoepfe
    [-s+6, 0, s-8].forEach(dx=>{
      ctx.beginPath(); ctx.arc(x+dx, y+dy+4, 1.5, 0, Math.PI*2);
      ctx.fillStyle="#6a6058"; ctx.fill();
      ctx.beginPath(); ctx.arc(x+dx-0.4, y+dy+3.5, 0.8, 0, Math.PI*2);
      ctx.fillStyle="rgba(230,226,216,0.6)"; ctx.fill();
    });
  });
  // Moos/Bewitterung am Fuss
  ctx.fillStyle="rgba(74,96,48,0.3)";
  [[-s+7,y+s-4,4.5],[s-12,y+s-3,3.4],[-3,y+s-2,3]].forEach(([dx,dy,rr])=>{
    ctx.beginPath(); ctx.ellipse(x+dx,dy,rr,rr*0.6,0,0,Math.PI*2); ctx.fill();
  });
}

function drawWallSpriteStone(x,y,b){
  // Ab Level 3: verstaerkte Steinmauer statt Holzpalisade - sichtbare
  // Belohnung fuers Investieren, kein neuer Mechanismus.
  const s=25;
  fillTexturedBlock(x-s,y-s,s*2,s*2,3,TEX.stone,b.level*13+5,
    "rgba(198,204,212,1)","rgba(126,134,144,1)");
  // Einzelne Quader im Verband, jeder mit Fuge und Lichtkante
  ctx.save();
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,3); ctx.clip();
  const rows=4, rowH=(s*2)/rows;
  for(let i=0;i<rows;i++){
    const yy0=y-s+i*rowH;
    if(i>0){
      ctx.strokeStyle="rgba(14,18,24,0.42)"; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(x-s,yy0); ctx.lineTo(x+s,yy0); ctx.stroke();
      ctx.strokeStyle="rgba(255,252,242,0.13)"; ctx.lineWidth=1.1;
      ctx.beginPath(); ctx.moveTo(x-s,yy0+1.4); ctx.lineTo(x+s,yy0+1.4); ctx.stroke();
    }
    const offset=(i%2===0)?0:(s*2)/4;
    for(let xx=x-s+offset; xx<x+s; xx+=(s*2)/2){
      ctx.strokeStyle="rgba(14,18,24,0.38)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xx,yy0); ctx.lineTo(xx,yy0+rowH); ctx.stroke();
      ctx.strokeStyle="rgba(255,252,242,0.1)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xx+1.2,yy0); ctx.lineTo(xx+1.2,yy0+rowH); ctx.stroke();
    }
  }
  ctx.restore();
  // Eisenverstaerkung als Band, mit Metallglanz
  const bandGrad = ctx.createLinearGradient(x,y-4,x,y+4);
  bandGrad.addColorStop(0,"#6e655c"); bandGrad.addColorStop(0.35,"#8d8378");
  bandGrad.addColorStop(0.6,"#4e463f"); bandGrad.addColorStop(1,"#332d28");
  ctx.fillStyle=bandGrad; ctx.fillRect(x-s,y-4,s*2,8);
  ctx.strokeStyle="rgba(12,10,8,0.6)"; ctx.lineWidth=1; ctx.strokeRect(x-s,y-4,s*2,8);
  [-16,-5,6,16].forEach(dx=>{
    ctx.beginPath(); ctx.arc(x+dx,y,1.8,0,Math.PI*2); ctx.fillStyle="#57504a"; ctx.fill();
    ctx.beginPath(); ctx.arc(x+dx-0.5,y-0.5,1,0,Math.PI*2); ctx.fillStyle="rgba(226,222,214,0.7)"; ctx.fill();
  });
}

  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s+1,y-s+1,s*2-2,s*2-2,4); ctx.stroke();
