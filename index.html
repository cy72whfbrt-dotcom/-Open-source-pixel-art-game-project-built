  roofGrad.addColorStop(0,"#6a4c2a"); roofGrad.addColorStop(1,"#4a3218");
  ctx.beginPath(); ctx.moveTo(x-s-3,y-s+2); ctx.lineTo(x,y-s-12); ctx.lineTo(x+s+3,y-s+2); ctx.closePath();
  ctx.fillStyle=roofGrad; ctx.fill(); ctx.strokeStyle="#2e1f10"; ctx.stroke();
  [-10,4].forEach(dx=>{
    ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x+dx,y-s+6); ctx.lineTo(x+dx,y+s-4); ctx.stroke();
  });
  // Kisten davor als Andeutung von Lagergut
  drawRoundRect(x-19,y+9,10,9,1.5,"#a5825a");
  ctx.strokeStyle="#5a3f22"; ctx.lineWidth=1; ctx.strokeRect(x-19,y+9,10,9);
  ctx.beginPath(); ctx.moveTo(x-19,y+13); ctx.lineTo(x-9,y+13); ctx.moveTo(x-14,y+9); ctx.lineTo(x-14,y+18); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.1)"; ctx.fillRect(x-s+1,y-s+1,s*2-2,3);
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("lager",b.level), 34);
}

function drawWachturmSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-4,18,6);
  const legGrad = ctx.createLinearGradient(x-10,0,x+10,0);
  legGrad.addColorStop(0,"#5a4a38"); legGrad.addColorStop(0.5,"#7a6650"); legGrad.addColorStop(1,"#5a4a38");
  ctx.fillStyle=legGrad;
  ctx.beginPath(); ctx.moveTo(x-10,y+s); ctx.lineTo(x-6,y-s+4); ctx.lineTo(x+6,y-s+4); ctx.lineTo(x+10,y+s); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#3a2f22"; ctx.lineWidth=1.5; ctx.stroke();
  // Streben-Kreuz
  ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(x-8,y+s-4); ctx.lineTo(x+6,y+2); ctx.moveTo(x+8,y+s-4); ctx.lineTo(x-6,y+2); ctx.stroke();
  const platGrad = ctx.createLinearGradient(x,y-s-8,x,y-s+6);
  platGrad.addColorStop(0,"#a08862"); platGrad.addColorStop(1,"#7a6244");
  drawRoundRect(x-13,y-s-8,26,14,3,platGrad);
  ctx.strokeStyle="#3a2f22"; ctx.strokeRect(x-13,y-s-8,26,14);
  ctx.fillStyle="rgba(0,0,0,0.15)"; ctx.fillRect(x-13,y-s+2,26,4);
  // Laterne/Ausguck mit Glanz
  const lampGrad = ctx.createRadialGradient(x-1.5,y-s-13,0,x,y-s-12,5);
  lampGrad.addColorStop(0,"#fff3c4"); lampGrad.addColorStop(1,"#e8b84a");
  ctx.beginPath(); ctx.arc(x,y-s-12,4.5,0,Math.PI*2);
  ctx.fillStyle=lampGrad; ctx.fill(); ctx.strokeStyle="#3a2f22"; ctx.stroke();
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("wachturm",b.level), 34);
}

function drawHandelspostenSprite(x,y,b){
  const s=25;
  drawShadow(x,y+s-2,21,6);
  const grad = ctx.createLinearGradient(x,y-s+6,x,y+s);
  grad.addColorStop(0,"#a5824a"); grad.addColorStop(1,"#7a5f34");
  drawRoundRect(x-s,y-s+6,s*2,s*2-6,5,grad);
  ctx.strokeStyle="#4a341c"; ctx.lineWidth=2;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s+1,y-s+7,s*2-2,s*2-7,4); ctx.stroke();
  // Gestreiftes Markisen-Dach - gedecktes Rot/Beige statt Comic-Zirkuszelt
  ["#9c4a3f","#d9cfb8"].forEach((col,i)=>{
    ctx.fillStyle=col;
    for(let k=0;k<4;k++){
      if((k+i)%2===0) ctx.fillRect(x-s+k*(s/2), y-s-6, s/2, 8);
    }
  });
  ctx.strokeStyle="#4a341c"; ctx.lineWidth=1; ctx.strokeRect(x-s,y-s-6,s*2,8);
  // Zickzack-Volant unter der Markise
  ctx.fillStyle="#9c4a3f";
  for(let k=0;k<6;k++){
    ctx.beginPath(); ctx.moveTo(x-s+k*(s/3), y-s+2); ctx.lineTo(x-s+(k+0.5)*(s/3), y-s+7); ctx.lineTo(x-s+(k+1)*(s/3), y-s+2); ctx.closePath(); ctx.fill();
  }
  // Theke/Auslage
  drawRoundRect(x-14,y+8,28,10,2,"#5a3f22");
  ctx.strokeStyle="#2e1f10"; ctx.strokeRect(x-14,y+8,28,10);
  ctx.fillStyle="#e8b84a"; ctx.beginPath(); ctx.arc(x-6,y+8,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#7fb84a"; ctx.beginPath(); ctx.arc(x+2,y+8,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#c94a4a"; ctx.beginPath(); ctx.arc(x+9,y+8,3,0,Math.PI*2); ctx.fill();
  drawLevelPips(x, y+18, b.level);
  drawHpBar(x, y+22, b.hp, maxHpFor("handelsposten",b.level), 34);
}

function drawBaseSprite(x,y){
  const s=28;
  drawShadow(x,y+s-4,27,8);
  const grad = ctx.createLinearGradient(x,y-s,x,y+s);
  grad.addColorStop(0,"#d97a52"); grad.addColorStop(0.55,"#c25f3d"); grad.addColorStop(1,"#9c4930");
  drawRoundRect(x-s,y-s,s*2,s*2,10,grad);
  ctx.strokeStyle="rgba(255,255,255,0.28)"; ctx.lineWidth=1.5;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-s,y-s,s*2,s*2,10); ctx.stroke();
  // Holzbalken-Dach oben
  const roofGrad = ctx.createLinearGradient(x,y-s-4,x,y-s+6);
  roofGrad.addColorStop(0,"#6a4326"); roofGrad.addColorStop(1,"#4a2e18");
  drawRoundRect(x-s-2,y-s-4,s*2+4,10,4,roofGrad);
  ctx.strokeStyle="#2e1c10"; ctx.lineWidth=1.2; ctx.strokeRect(x-s-2,y-s-4,s*2+4,10);
  for(let i=-2;i<=2;i++){ ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.moveTo(x+i*10,y-s-4); ctx.lineTo(x+i*10,y-s+6); ctx.stroke(); }
  // Rundbogen-Eingang mit warmem Licht
  const doorGrad = ctx.createRadialGradient(x,y+18,1,x,y+16,14);
  doorGrad.addColorStop(0,"#ffdf9c"); doorGrad.addColorStop(1,"#c9822f");
  ctx.beginPath(); ctx.arc(x,y+10,10,Math.PI,0); ctx.lineTo(x+10,y+22); ctx.lineTo(x-10,y+22); ctx.closePath();
  ctx.fillStyle=doorGrad; ctx.fill();
  ctx.strokeStyle="#5a2f14"; ctx.lineWidth=1.6; ctx.stroke();
  // Fenster links/rechts
  ["#bfe6f2"].forEach(()=>{
    drawRoundRect(x-s+7,y-6,8,9,2,"#bfe6f2"); ctx.strokeStyle="#5a2f14"; ctx.lineWidth=1.2; ctx.strokeRect(x-s+7,y-6,8,9);
    drawRoundRect(x+s-15,y-6,8,9,2,"#bfe6f2"); ctx.strokeRect(x+s-15,y-6,8,9);
  });
  // Wehende Fahne
  const t = performance.now()/1000;
  const wave = Math.sin(t*3)*2.5;
  ctx.strokeStyle="#3a1f14"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y-s-4); ctx.lineTo(x,y-s-22); ctx.stroke();
  ctx.fillStyle="#f2c94c";
  ctx.beginPath();
  ctx.moveTo(x,y-s-22);
  ctx.quadraticCurveTo(x+9+wave,y-s-19,x+15,y-s-16);
  ctx.quadraticCurveTo(x+9-wave,y-s-15,x,y-s-12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#c9962a"; ctx.lineWidth=1; ctx.stroke();

  ctx.fillStyle="#fff"; ctx.font="700 11px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=3;
  ctx.strokeText("Lv "+state.basisLevel, x, y+34);
  ctx.fillText("Lv "+state.basisLevel, x, y+34);
  ctx.textAlign="left";
  drawHpBar(x, y+40, state.baseHp, maxBaseHp(), 44);
}

function drawDestroyedOverlay(x,y){
  const s=25;
  ctx.save();
  // Verkohlter Schutthaufen statt Gebaeude - kein Kreuz aus zwei Linien mehr.
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = "#1c1712";
  ctx.beginPath(); ctx.ellipse(x,y+7,s*0.95,s*0.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Unregelmaessige Trümmerbrocken (Balken/Steine), verstreut statt symmetrisch.
  ctx.fillStyle = "#332822";
  [[-12,3,7,-0.3],[7,7,6,0.55],[-2,-3,5,0.1],[13,-1,5,-0.45]].forEach(([dx,dy,rr,rot])=>{
    ctx.save();
    ctx.translate(x+dx,y+dy);
    ctx.rotate(rot);
    ctx.fillRect(-rr,-rr*0.5,rr*2,rr);
    ctx.restore();
  });

  // Ein paar Glutreste zwischen dem Schutt.
  ctx.fillStyle = "#ff8a3d"; ctx.globalAlpha = 0.85;
  [[-6,-1,1.6],[9,4,1.3],[1,-6,1.2]].forEach(([dx,dy,rr])=>{
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Duenner Rauch, der nach oben zieht.
  ctx.strokeStyle = "rgba(190,190,190,0.4)"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-4,y-6); ctx.quadraticCurveTo(x-11,y-18,x-4,y-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+6,y-4); ctx.quadraticCurveTo(x+13,y-16,x+6,y-28); ctx.stroke();
  ctx.restore();
}

function drawBuildingSprite(x,y,building){
  if(building.type==="turm") drawTowerSprite(x,y,building);
  else if(building.type==="mauer") drawWallSprite(x,y,building);
  else if(building.type==="kaserne") drawKaserneSprite(x,y,building);
  else if(building.type==="krankenhaus") drawKrankenhausSprite(x,y,building);
  else if(building.type==="lager") drawLagerSprite(x,y,building);
  else if(building.type==="wachturm") drawWachturmSprite(x,y,building);
  else if(building.type==="handelsposten") drawHandelspostenSprite(x,y,building);
  if(building.hp<=0) drawDestroyedOverlay(x,y);
}

function drawRepairIndicator(gridSize){
  if(!state.repairJob) return;
  const slot = state.cellsByCoord[state.repairJob.key];
  if(!slot || !slot.building) return;
  const [c,r] = state.repairJob.key.split(",").map(Number);
  const p = cellCenter(c,r,gridSize);
  const t = performance.now()/1000;
  const progress = Math.max(0, Math.min(1, 1-(state.repairJob.timeLeft/state.repairJob.totalTime)));
  const ix = p.x+20, iy = p.y-26+Math.sin(t*4)*3;

  // Fortschrittsring, damit ein Abschluss nie "aus dem Nichts" kommt
  ctx.beginPath(); ctx.arc(ix,iy,11,0,Math.PI*2);
  ctx.fillStyle="rgba(15,25,35,0.6)"; ctx.fill();
  ctx.beginPath(); ctx.arc(ix,iy,11,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
  ctx.strokeStyle="#6ad46a"; ctx.lineWidth=2.5; ctx.stroke();

  ctx.save();
  ctx.translate(ix, iy);
  ctx.rotate(Math.sin(t*3)*0.3);
  ctx.strokeStyle="#f2c94c"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-5,5); ctx.lineTo(5,-5); ctx.stroke();
  ctx.beginPath(); ctx.arc(5,-5,3.2,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function findBuildingSlotByType(type){
  for(const [key,slot] of Object.entries(state.cellsByCoord)){
    if(slot.building && slot.building.type===type){
      const [c,r] = key.split(",").map(Number);
      return {c,r};
    }
  }
  return null;
}

function drawAngreiferUnits(gridSize){
  const active = state.npc.angreifer.filter(a=>a.status==="aktiv");
  const n = active.length;
  active.forEach((a,i)=>{
    const ang = (i/Math.max(n,1))*Math.PI*2 - Math.PI/2;
    const x = Math.cos(ang)*46, y = Math.sin(ang)*46;
    drawShadow(x,y+10,11,3);
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle="#4a8f5a"; ctx.fill();
    ctx.strokeStyle="#204a2c"; ctx.lineWidth=1.8; ctx.stroke();
    // kleiner Bogen als Erkennungsmerkmal, damit sie nicht wie beliebige Punkte wirken
    ctx.strokeStyle="#eafff0"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(x+3,y,4.5,-0.9,0.9); ctx.stroke();
    drawHpBar(x,y-18,a.hp,a.maxHp,18);
  });

  // Verletzte liegen sichtbar beim Krankenhaus, mit Heil-Fortschrittsring,
  // statt einfach unsichtbar zu sein
  const verletzt = state.npc.angreifer.filter(a=>a.status==="verletzt");
  if(verletzt.length>0){
    const kSlot = findBuildingSlotByType("krankenhaus");
    if(kSlot){
      const p = cellCenter(kSlot.c, kSlot.r, gridSize);
      const totalHeal = healTimeFor();
      verletzt.forEach((a,i)=>{
        const x = p.x-24+i*16, y = p.y+34;
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.ellipse(x,y,8,5,0,0,Math.PI*2);
        ctx.fillStyle="#8a3a3a"; ctx.fill();
        ctx.globalAlpha = 1;
        const ratio = Math.max(0, Math.min(1, 1-(a.healLeft/totalHeal)));
        ctx.beginPath(); ctx.arc(x,y-9,5,-Math.PI/2,-Math.PI/2+Math.PI*2*ratio);
        ctx.strokeStyle="#6ad46a"; ctx.lineWidth=2; ctx.stroke();
      });
    }
  }
}

function drawFloatBase(x,y){
  // Kleines Holzfloss, auf dem die Ressource treibt - mit sanftem Schaukeln
  const t = performance.now()/1000;
  const bob = Math.sin(t*1.6+x*0.01)*1.6;
  drawShadow(x,y+18,17,5);
  const raftGrad = ctx.createRadialGradient(x-6,y-6+bob,3,x,y+bob,23);
  raftGrad.addColorStop(0,"#3a7a92"); raftGrad.addColorStop(1,"#1c4a5f");
  ctx.beginPath(); ctx.arc(x,y+bob,22,0,Math.PI*2);
  ctx.fillStyle=raftGrad; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.15)"; ctx.lineWidth=1.4; ctx.stroke();
  return bob;
}

function drawLogNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.45 : 1;
  const bob = drawFloatBase(x,y);
  y += bob;
  ["#7a4c2a","#a06d3f"].forEach((col,i)=>{
    const logGrad = ctx.createLinearGradient(x,y-4+i*7,x,y+2+i*7);
    logGrad.addColorStop(0, shadeColor(col,25)); logGrad.addColorStop(1, col);
    drawRoundRect(x-15, y-4+i*7, 30, 6, 3, logGrad);
    ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=0.8; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x-15,y-4+i*7,30,6,3); ctx.stroke();
    ["#5a3a1f","#c9a06a"].forEach((rc,ri)=>{
      ctx.beginPath(); ctx.arc(x-13,y-1+i*7,2-ri*0.7,0,Math.PI*2); ctx.fillStyle=rc; ctx.fill();
      ctx.beginPath(); ctx.arc(x+13,y-1+i*7,2-ri*0.7,0,Math.PI*2); ctx.fill();
    });
  });
  ctx.globalAlpha = 1;
  // Fuellstand-Ring
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#c99a5a"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  ctx.fillStyle="#fff"; ctx.font="700 10px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2.5; ctx.strokeText(node.amount, x, y+22);
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

function drawRockNode(x,y,node,def){
  const full = node.amount>=def.capacity;
  const empty = node.amount<=0;
  ctx.globalAlpha = empty ? 0.45 : 1;
  const bob = drawFloatBase(x,y);
  y += bob;
  [[-7,3,9,"#8a929a"],[6,4,8,"#6a7278"],[0,-5,7,"#c4cdd4"]].forEach(([dx,dy,rr,col])=>{
    const rg = ctx.createRadialGradient(x+dx-rr*0.3,y+dy-rr*0.3,rr*0.15,x+dx,y+dy,rr);
    rg.addColorStop(0, shadeColor(col,35)); rg.addColorStop(1, shadeColor(col,-15));
    ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,Math.PI*2);
    ctx.fillStyle=rg; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1.2; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(x,y,26,-Math.PI/2, -Math.PI/2 + Math.PI*2*(node.amount/def.capacity));
  ctx.strokeStyle = full ? "#f2c94c" : "#b7c2cf"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  ctx.fillStyle="#fff"; ctx.font="700 10px sans-serif"; ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=2.5; ctx.strokeText(node.amount, x, y+22);
  ctx.fillText(node.amount, x, y+22);
  ctx.textAlign="left";
}

// ================= HUD-Designsystem =================
// Ein Panelstil fuer alles: gleiche Eckenradien, eine Flaechenfarbe, ein
// Schatten - statt vieler einzelner Chips mit je eigenem Glas-/Gold-Look
// (die alte Version kopierte 1:1 ein Referenzfoto eines anderen Spiels).
// Bewusst flach (keine Verlaeufe/Bevel mehr in den UI-Elementen), damit
// die UI klar und modern von der texturierten Spielwelt absticht.
const HUD = {
  panel:      "rgba(15,21,30,0.86)",
  border:     "rgba(255,255,255,0.08)",
  track:      "rgba(255,255,255,0.10)",
  text:       "#eef2f6",
  textDim:    "rgba(238,242,246,0.6)",
  accent:     "#2dd6bd",
  accentText: "#083330",
  danger:     "#e2585d",
  dangerText: "#3a0d0f",
  coin:       "#ffcf5c",
  gem:        "#7cd4ff",
  wood:       "#cf9358",
  stone:      "#9aa6b3",
  kraft:      "#ff9a52",
  radius:     14
};

function hudPanel(x,y,w,h){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.3)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  drawRoundRect(x,y,w,h,HUD.radius,HUD.panel);
  ctx.restore();
  ctx.strokeStyle=HUD.border; ctx.lineWidth=1;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,HUD.radius); ctx.stroke();
}

function drawStatusPill(x,y,w,fill,strokeColor,textColor,drawIcon,text){
  const h=30;
  drawRoundRect(x,y,w,h,h/2,fill);
  ctx.strokeStyle=strokeColor; ctx.lineWidth=1;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,h/2); ctx.stroke();
  ctx.save(); ctx.translate(x+17,y+h/2); drawIcon(); ctx.restore();
  ctx.fillStyle=textColor; ctx.font="700 13px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+30, y+h/2+1);
  ctx.textBaseline="alphabetic";
}

// Level als flache Zahlenscheibe statt Portraitbild - sofort lesbar, ohne
// den "gemaltes Gesicht"-Realismus-Anspruch eines Avatars.
function drawLevelDisc(cx,cy,r,level){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=HUD.accent; ctx.fill();
  ctx.fillStyle=HUD.accentText; ctx.font="800 "+Math.round(r*0.8)+"px sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(level, cx, cy+1);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

// Grosse Zahlen (Kraft kann mit vielen Gebaeuden/NPCs schnell vierstellig
// werden) als 16K/1.2M statt einer langen Ziffernkette.
function formatCompactNumber(v){
  if(v>=1000000) return (v/1000000).toFixed(v%1000000===0?0:1)+"M";
  if(v>=1000) return (v/1000).toFixed(v%1000===0?0:1)+"K";
  return String(v);
}

function drawExpBar(x,y,w,h,ratio){
  drawRoundRect(x,y,w,h,h/2,HUD.track);
  const rr = Math.max(0,Math.min(1,ratio));
  if(rr>0.02) drawRoundRect(x,y,w*rr,h,h/2,HUD.accent);
}

function drawKraftReadout(x,y,value){
  ctx.save(); ctx.translate(x+7,y+7); drawKraftIcon(7); ctx.restore();
  ctx.fillStyle=HUD.textDim; ctx.font="700 11px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(formatCompactNumber(value), x+18, y+8);
  ctx.textBaseline="alphabetic";
}

function drawCurrencyItem(x,y,drawIconFn,iconR,text){
  ctx.save(); ctx.translate(x+iconR,y+iconR); drawIconFn(iconR); ctx.restore();
  ctx.fillStyle=HUD.text; ctx.font="700 12.5px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(text, x+iconR*2+6, y+iconR+1);
  ctx.textBaseline="alphabetic";
}

// Fuellstands-Leiste: der Balken selbst fuellt sich mit dem Fortschritt zur
// Lagerkapazitaet, statt nur eine Zahl zu zeigen - jetzt einfarbig statt
// mit Materialverlauf, passend zum flachen Rest der HUD.
function drawStorageBar(x,y,w,h,current,cap,iconR,drawIconFn,fillColor,text){
  drawRoundRect(x,y,w,h,h/2,HUD.track);
  const ratio = Math.max(0, Math.min(1, cap>0 ? current/cap : 0));
  if(ratio>0.02) drawRoundRect(x,y,w*ratio,h,h/2,fillColor);
  ctx.fillStyle=HUD.text; ctx.font="700 10.5px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.fillText(text, x+w-8, y+h/2+1);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.save(); ctx.translate(x+iconR*0.85, y+h/2); drawIconFn(iconR*0.75); ctx.restore();
}

function drawStarIcon(r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const ang=-Math.PI/2+i*(Math.PI*2/5);
    const ang2=ang+Math.PI/5;
    ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
    ctx.lineTo(Math.cos(ang2)*r*0.42,Math.sin(ang2)*r*0.42);
  }
  ctx.closePath();
  ctx.fillStyle="#4fa8e8"; ctx.fill();
}

// Ressourcen-Icons: flache Vollfarbe statt Materialverlauf/Bevel - lesbar
// aus der Distanz, ohne den "kleines Schmuckstueck"-Realismus.
function drawCoinIcon(r){
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=HUD.coin; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,r*0.52,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.16)"; ctx.fill();
}

function drawGemIcon(r){
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r*0.85,-r*0.15); ctx.lineTo(r*0.4,r);
  ctx.lineTo(-r*0.4,r); ctx.lineTo(-r*0.85,-r*0.15); ctx.closePath();
  ctx.fillStyle=HUD.gem; ctx.fill();
}

function drawLogIcon(r){
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=HUD.wood; ctx.fill();
}

function drawStoneIcon(r){
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=HUD.stone; ctx.fill();
}

function drawKraftIcon(r){
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);

}

function drawPlayerLevelUpFx(cx,y){
  if(!playerLevelUpFx) return;
  const elapsed = performance.now()-playerLevelUpFx.startedAt;
  if(elapsed>=LEVELUP_FX_DURATION){ playerLevelUpFx = null; return; }
  const t = elapsed/LEVELUP_FX_DURATION;
  const rise = t*14, alpha = t<0.15 ? t/0.15 : 1-((t-0.15)/0.85);
  ctx.save();
  ctx.globalAlpha = Math.max(0,alpha);
  ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  const label = "Level Up! Lv. "+playerLevelUpFx.level;
  ctx.strokeText(label, cx, y+8-rise);
  ctx.fillStyle = "#ffe27a";
  ctx.fillText(label, cx, y+8-rise);
  ctx.restore();
}

// ================= Licht- und Grading-Pass =================
// Laeuft ueber die FERTIGE Weltdarstellung (aber vor dem HUD, damit die UI
// scharf bleibt). Das ist der Schritt, der aus "flach gezeichneten Formen"
// eine zusammenhaengend beleuchtete Szene macht: ein gerichtetes Sonnenlicht,
// kuehler Gegenschatten, Vignette und eine feine Koernung. Alles ueber
// Blend-Modes, die auch iOS-Safari seit Jahren unterstuetzt.
function drawLightingPass(){
  // Warmes Sonnenlicht von oben links
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  const sun = ctx.createRadialGradient(W*0.18, H*0.1, 0, W*0.18, H*0.1, Math.max(W,H)*1.05);
  sun.addColorStop(0,   "rgba(255,238,198,0.75)");
  sun.addColorStop(0.45,"rgba(255,226,180,0.25)");
  sun.addColorStop(1,   "rgba(60,80,110,0)");
  ctx.fillStyle = sun; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Kuehler Gegenschatten unten rechts - Farbtemperatur-Kontrast, das
  // wichtigste Mittel, damit eine Szene nicht "eingefaerbt flach" wirkt
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const cool = ctx.createRadialGradient(W*0.9, H*0.95, 0, W*0.9, H*0.95, Math.max(W,H)*0.95);
  cool.addColorStop(0,  "rgba(150,170,205,0.42)");
  cool.addColorStop(0.6,"rgba(198,208,225,0.18)");
  cool.addColorStop(1,  "rgba(255,255,255,0)");
  ctx.fillStyle = cool; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Vignette
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const vig = ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.38, W/2,H*0.45,Math.max(W,H)*0.82);
  vig.addColorStop(0,"rgba(255,255,255,1)");
  vig.addColorStop(1,"rgba(96,104,120,1)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Feine Filmkoernung - nimmt den "sauberen Vektor"-Eindruck
  ctx.save();
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.055;
  ctx.translate((Math.random()*64)|0, (Math.random()*64)|0);
  ctx.fillStyle = TEX.grain;
  ctx.fillRect(-64,-64,W+128,H+128);
  ctx.restore();
}

function drawInGameHud(){
  const pad = 10;

  // ---- Linkes Panel: Level, Name, EXP, Kraft - alles in EINEM Panel statt
  // einzeln floatender Elemente, das ist der Kern des modernen/aufgeraeumten
  // Looks (ein Rahmen, ein Schatten, eine Flaeche statt vieler kleiner).
  const leftW = 188, leftH = 68;
  hudPanel(pad, pad, leftW, leftH);

  const badgeR = 19, badgeCx = pad+13+badgeR, badgeCy = pad+leftH/2;
  drawLevelDisc(badgeCx, badgeCy, badgeR, state.playerLevel);

  const textX = badgeCx+badgeR+11;
  const textW = pad+leftW-11-textX;
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=HUD.text;
  let nameSize=13, name=state.playerName;
  ctx.font="700 "+nameSize+"px sans-serif";
  while(nameSize>10 && ctx.measureText(name).width>textW){ nameSize--; ctx.font="700 "+nameSize+"px sans-serif"; }
  while(ctx.measureText(name).width>textW && name.length>1){ name = name.slice(0,-1); ctx.font="700 "+nameSize+"px sans-serif"; }
  if(name!==state.playerName) name = name.replace(/.$/,"…");
  ctx.fillText(name, textX, pad+21);

  const xpRatio = state.playerXp/xpForLevel(state.playerLevel);
  drawExpBar(textX, pad+29, textW, 7, xpRatio);
  drawKraftReadout(textX, pad+42, computeKraft());
  drawPlayerLevelUpFx(pad+leftW/2, pad+leftH+18);

  // ---- Rechtes Panel: Waehrungen oben, Rohstoff-Leisten darunter -
  // gleicher Panelstil wie links, damit beide Seiten als ein System wirken.
  const rightW = 150, rightH = 68;
  const rightX = W-pad-rightW;
  hudPanel(rightX, pad, rightW, rightH);

  const innerPad = 12;
  drawCurrencyItem(rightX+innerPad, pad+9, drawCoinIcon, 9, state.resources.coins);
  drawCurrencyItem(rightX+rightW/2, pad+9, drawGemIcon, 9, state.resources.gems);

  const cap = storageCap();
  const barW = rightW-innerPad*2, barH = 15;
  drawStorageBar(rightX+innerPad, pad+33, barW, barH, state.resources.holz, cap, 11, drawLogIcon, HUD.wood, state.resources.holz+"/"+cap);
  drawStorageBar(rightX+innerPad, pad+33+barH+5, barW, barH, state.resources.stein, cap, 11, drawStoneIcon, HUD.stone, state.resources.stein+"/"+cap);

  // ---- Mitte: Wellen-Status, zentriert in der Luecke zwischen den Panels.
  // Wird die Luecke zu schmal, schrumpft der Pill lieber selbst, statt
  // links oder rechts zu ueberlappen.
  const gapLeft = pad+leftW+8, gapRight = rightX-8;
  const chipW = Math.max(64, Math.min(120, gapRight-gapLeft));
  const statusX = (gapLeft+gapRight)/2 - chipW/2;
  const statusY = pad;
  if(!state.tutorialDone){
    drawStatusPill(statusX, statusY, chipW, HUD.accent, HUD.accent, HUD.accentText, ()=>{
      ctx.strokeStyle=HUD.accentText; ctx.lineWidth=2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-5,3); ctx.lineTo(-1,7); ctx.lineTo(6,-5); ctx.stroke();
      ctx.lineCap="butt";
    }, "Aufbau "+tutorialProgressText());
  } else {
    const inCombat = enemies.length>0;
    const waveLabel = inCombat ? enemies.length+" Gegner" : Math.max(0,Math.ceil(state.waveTimer))+"s";
    const fill = inCombat ? HUD.danger : HUD.panel;
    const stroke = inCombat ? HUD.danger : HUD.border;
    const textColor = inCombat ? HUD.dangerText : HUD.text;
    drawStatusPill(statusX, statusY, chipW, fill, stroke, textColor, ()=>{
      ctx.strokeStyle=textColor; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-5); ctx.moveTo(0,0); ctx.lineTo(3,2); ctx.stroke();
    }, waveLabel);

    // Wachturm-Vorschau: zeigt an, was in der naechsten Welle kommt
    if(!inCombat && state.nextWaveComposition){
      const counts = {};
      state.nextWaveComposition.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
      const summary = Object.entries(counts).map(([k,v])=>v+"x "+ENEMY_TYPES[k].name).join(" · ");
      ctx.font="600 10.5px sans-serif";
      const tw = ctx.measureText(summary).width;
      const cx = statusX+chipW/2;
      const py = statusY+38;
      drawRoundRect(cx-tw/2-10, py, tw+20, 20, 10, HUD.panel);
      ctx.strokeStyle=HUD.border; ctx.lineWidth=1;
      ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(cx-tw/2-10, py, tw+20, 20, 10); ctx.stroke();
      ctx.fillStyle=HUD.text; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(summary, cx, py+10);
      ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    }
  }
}

function render(){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const list = cellList(gridSize);

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(camera.scale, camera.scale);
  ctx.translate(-camera.x, -camera.y);

  drawWater();
  drawIslandBase(gridSize);

  // Gras wird an die organische Kuestenlinie geclippt - so enden die
  // quadratischen Felder nicht in einer harten Kante, sondern laufen an
  // den Ecken in den Strand aus.
  ctx.save();
  traceIslandPath(gridHalfExtent(gridSize)+14, 13, 4.4);
  ctx.clip();
  list.forEach(([c,r])=>{ const p=cellCenter(c,r,gridSize); drawGrassTile(p.x,p.y,c,r); });
  { const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize); drawGrassTile(p.x,p.y,0,0); }
  // Kante abdunkeln, damit das Gras zum Wasser hin abfaellt statt flach
  // abzubrechen
  const gHalf = gridHalfExtent(gridSize);
  const toEdge = ctx.createRadialGradient(0,0,gHalf*0.86, 0,0,gHalf+16);
  toEdge.addColorStop(0,"rgba(14,32,16,0)");
  toEdge.addColorStop(1,"rgba(14,32,16,0.45)");
  ctx.fillStyle = toEdge; ctx.fillRect(-gHalf-40,-gHalf-40,(gHalf+40)*2,(gHalf+40)*2);
  ctx.restore();

  drawHafen(gridSize);

  list.forEach(([c,r])=>{
    const p = cellCenter(c,r,gridSize);
    const slot = state.cellsByCoord[c+","+r] || {unlocked:false,building:null};
    if(slot.building) drawBuildingSprite(p.x,p.y,slot.building);
    else if(!slot.unlocked) drawLockedButton(p.x,p.y);
    else drawPlusButton(p.x,p.y);
  });

  // Wasser-Ressourcenknoten
  state.nodes.forEach(n=>{
    const def = WATER_NODE_DEFS.find(d=>d.id===n.id);
    const p = nodeWorldPos(n);
    if(def.type==="holz") drawLogNode(p.x,p.y,n,def); else drawRockNode(p.x,p.y,n,def);
  });

  // Base in der Mitte
  {
    const p = cellCenter(centerOf(gridSize),centerOf(gridSize),gridSize);
    drawBaseSprite(p.x,p.y);
  }

  drawAngreiferUnits(gridSize);
  drawRepairIndicator(gridSize);
  drawPlayerSprite();
  drawDepositFx();
  drawKnockoutFx();

  projectiles.forEach(drawProjectile);
  enemies.forEach(drawEnemy);

  if(moveSource){
    const p = cellCenter(moveSource.c, moveSource.r, gridSize);
    drawTutorialHighlight(p.x, p.y, "Zielfeld antippen");
  }

  const tut = nextTutorialTarget();
  if(tut){
    let tp;
    if(tut.kind==="cell") tp = cellCenter(tut.c,tut.r,gridSize);
    else {
      const n = tut.node || state.nodes.find(x=>x.amount>0) || state.nodes[0];
      tp = nodeWorldPos(n);
    }
    drawTutorialHighlight(tp.x, tp.y, tut.label);
  }

  ctx.restore();
  drawLightingPass();
  drawInGameHud();
}

// ================= Eingabe / Menues =================

// Waehrend "Verschieben" aktiv ist, wartet der naechste Tap auf ein Zielfeld
// statt normal ein Menue zu oeffnen.
let moveSource = null;

function handleTap(wx,wy){
  const gridSize = gridSizeForLevel(state.basisLevel);
  const c0 = centerOf(gridSize);

  if(moveSource){
    const c = Math.round(wx/CELL + c0);
    const r = Math.round(wy/CELL + c0);
    const srcSlot = state.cellsByCoord[moveSource.c+","+moveSource.r];
    const validTarget = c>=0 && c<gridSize && r>=0 && r<gridSize && !(c===c0 && r===c0) && !(c===moveSource.c && r===moveSource.r);
    if(validTarget && srcSlot && srcSlot.building){
      const destSlot = state.cellsByCoord[c+","+r];
      const req = requiredTypeForCell(c,r);
      const destOk = destSlot && destSlot.unlocked && !destSlot.building && (!req || req===srcSlot.building.type);
      if(destOk){
        destSlot.building = srcSlot.building;
        srcSlot.building = null;
        save();
      }
    }
    moveSource = null;
    render();
    return;
  }

  // Wasser-Knoten treffen? Der Spieler laeuft erst hin, sammelt nicht mehr
  // sofort per Fingertipp - Rucksack-Kapazitaet macht das erst zur Reise.
  for(const n of state.nodes){
    const p = nodeWorldPos(n);
    if(Math.hypot(wx-p.x,wy-p.y) < 26){
      if(n.amount<=0) return;
      state.player.moveTarget = { x:p.x, y:p.y, nodeId:n.id };
      save(); render();
      return;
    }
  }

  const c = Math.round(wx/CELL + c0);
  const r = Math.round(wy/CELL + c0);
  if(c<0||c>=gridSize||r<0||r>=gridSize) return;
  if(c===c0 && r===c0){ openBasisMenu(); return; }
  openBuildMenu(c,r);
}

function relocateNode(n){
  // an eine neue Stelle im Wasser versetzen, mit Abstand zu den anderen Knoten
  let tries=0, angle;
  do { angle = Math.random()*360; tries++; }
  while(tries<10 && state.nodes.some(o=>o!==n && Math.abs(((o.angle-angle+540)%360)-180)<35));
  n.angle = angle;
}

const PLAYER_SPEED = 130;       // px/s - deutlich schneller als jeder Gegner
const BACKPACK_CAPACITY = 40;   // Gesamt an Holz+Stein, die der Spieler gleichzeitig tragen kann
const PLAYER_ARRIVE_RADIUS = 22;
const BASE_DEPOSIT_RADIUS = 40;

function backpackTotal(){ return state.player.backpack.holz + state.player.backpack.stein; }

const JOYSTICK_DEADZONE = 0.15; // kleine Ausschläge ignorieren, damit er nicht zittert

// Beim manuellen Steuern per Joystick gibt es kein "Tap-Ziel" mit fester
// Knoten-ID mehr - stattdessen wird im Vorbeilaufen eingesammelt, sobald
// der Spieler nah genug an einem Knoten mit Inhalt ist.
function collectNearbyNode(pl){
  let closest=null, closestDist=PLAYER_ARRIVE_RADIUS;
  state.nodes.forEach(n=>{
    if(n.amount<=0) return;
    const p = nodeWorldPos(n);
    const d = Math.hypot(p.x-pl.x, p.y-pl.y);
    if(d<closestDist){ closestDist=d; closest=n; }
  });
  if(!closest) return;
  const def = WATER_NODE_DEFS.find(d=>d.id===closest.id);
  const room = BACKPACK_CAPACITY - backpackTotal();
  const take = Math.min(closest.amount, room);
  if(take>0){
    pl.backpack[def.type] += take;
    closest.amount -= take;
    if(closest.amount<=0){
      relocateNode(closest);
      state.tutorialCollected = true;
      checkTutorial();
    }
    save();
  }
}

// Kurzer visueller Effekt beim Entleeren an der Base - keine Spielmechanik,
// darum nicht in state/save, sondern nur lokal fuers Rendern.
let depositFx = null;
const DEPOSIT_FX_DURATION = 900;

// Effekt beim K.o. des Spielers, ebenfalls rein visuell.
let knockoutFx = null;
const KNOCKOUT_FX_DURATION = 1400;

// Effekt beim Spieler-Level-Up, ebenfalls rein visuell (state.playerLevel
// selbst ist schon aktuell, das hier ist nur das kurze Aufblitzen im HUD).
let playerLevelUpFx = null;
const LEVELUP_FX_DURATION = 1600;

function updatePlayer(dt){
  const pl = state.player;
  const joyLen = Math.hypot(joystickDir.x, joystickDir.y);
  if(joyLen>JOYSTICK_DEADZONE){
    // Manuelle Steuerung per Joystick geht vor - bricht ein per Tap gesetztes
    // Auto-Ziel ab, der Spieler bestimmt direkt die Richtung.
    pl.moveTarget = null;
    const speedMult = Math.min(1, joyLen);
    pl.x += (joystickDir.x/joyLen)*PLAYER_SPEED*speedMult*dt;
    pl.y += (joystickDir.y/joyLen)*PLAYER_SPEED*speedMult*dt;
    collectNearbyNode(pl);
  } else if(pl.moveTarget){
    const dx = pl.moveTarget.x-pl.x, dy = pl.moveTarget.y-pl.y;
    const dist = Math.hypot(dx,dy);
    if(dist>PLAYER_ARRIVE_RADIUS){
      const ang = Math.atan2(dy,dx);
      pl.x += Math.cos(ang)*PLAYER_SPEED*dt;
      pl.y += Math.sin(ang)*PLAYER_SPEED*dt;
    } else {
      if(pl.moveTarget.nodeId){
        const node = state.nodes.find(n=>n.id===pl.moveTarget.nodeId);
        if(node && node.amount>0){
          const def = WATER_NODE_DEFS.find(d=>d.id===node.id);
          const room = BACKPACK_CAPACITY - backpackTotal();
          const take = Math.min(node.amount, room);
          if(take>0){
            pl.backpack[def.type] += take;
            node.amount -= take;
            if(node.amount<=0){
              relocateNode(node);
              state.tutorialCollected = true;
              checkTutorial();
            }
          }
        }
      }
      pl.moveTarget = null;
      // Rucksack voll -> automatisch zur Base zurücklaufen, statt extra Klick
      if(backpackTotal()>=BACKPACK_CAPACITY){
        pl.moveTarget = { x:0, y:0, nodeId:null };
      }
      save();
    }
  }
  // In der Naehe der Base automatisch entleeren
  if(backpackTotal()>0 && Math.hypot(pl.x,pl.y)<=BASE_DEPOSIT_RADIUS){
    const cap = storageCap();
    state.resources.holz = Math.min(cap, state.resources.holz+pl.backpack.holz);
    state.resources.stein = Math.min(cap, state.resources.stein+pl.backpack.stein);
    depositFx = { holz: pl.backpack.holz, stein: pl.backpack.stein, startedAt: performance.now() };
    pl.backpack.holz = 0; pl.backpack.stein = 0;
    save();
  }
}

function requiredTypeForCell(c,r){
  if(state.tutorialDone) return null;
  const t = tutorialTargets();
  if(t.towers.some(([tc,tr])=>tc===c&&tr===r)) return "turm";
  if(t.walls.some(([tc,tr])=>tc===c&&tr===r)) return "mauer";
  return null;
}

function openBasisMenu(){
  const overlay = document.createElement("div");
  overlay.className="buildmenu";
  const box = document.createElement("div");
  box.className="box";
  box.innerHTML = `<h3>Base</h3><div class="hint2">Level ${state.basisLevel}</div>`;

  if(!state.tutorialDone){
    box.innerHTML += `<div class="hint2">Baue zuerst deine Grundverteidigung fertig (${tutorialProgressText()}), bevor du die Base verbessern kannst.</div>`;
  } else {
    const cost = basisUpgradeCost(state.basisLevel);
    const opt = document.createElement("div");
    opt.className = "buildopt" + (!canAfford(cost) ? " disabled":"");
    opt.innerHTML = `<span>Verbessern auf Level ${state.basisLevel+1}<small>${nextLevelDescription()}</small></span><b>${formatCost(cost)}</b>`;
    opt.addEventListener("click", ()=>{
      if(upgradeBasis()){ document.body.removeChild(overlay); render(); }
    });
    box.appendChild(opt);
  }
  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function openBuildMenu(c,r){
  const key = c+","+r;
  const slot = state.cellsByCoord[key] || {unlocked:false, building:null};
  state.cellsByCoord[key] = slot;

  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";

  if(!slot.unlocked){
    box.innerHTML = `<h3>Noch gesperrt</h3><div class="hint2">Verbessere deine Base, um weitere Felder freizuschalten.</div>`;
  } else if(slot.building){
    const b = slot.building;
    const def = BUILDABLE_TYPES[b.type];
    const cost = upgradeCost(b.type, b.level);
    const maxHp = maxHpFor(b.type, b.level);
    // Zerstoerte Gebaeude (0 HP) bleiben stehen statt zu verschwinden - sie
    // muessen erst repariert werden, bevor man sie hochstuft, umruestet
    // oder verschiebt.
    const isDestroyed = b.hp<=0;
    box.innerHTML = `<h3>${def.name}${isDestroyed?" (kaputt)":""}</h3><div class="hint2">Level ${b.level} · HP ${Math.round(b.hp)}/${maxHp}</div>`;

    // Gebaeude-Level darf das aktuelle Basis-Level nie ueberholen - sonst
    // koennte man wieder einen einzelnen Turm isoliert hochpumpen, egal wie
    // weit die Basis eigentlich ist (genau das Problem, das die Kanone
    // vorher hatte).
    const atLevelCap = b.level>=state.basisLevel;
    const upOpt = document.createElement("div");
    upOpt.className = "buildopt" + (isDestroyed || atLevelCap || !canAfford(cost) ? " disabled":"");
    upOpt.innerHTML = isDestroyed
      ? `<span>Verbessern auf Level ${b.level+1}<small>Erst reparieren</small></span>`
      : atLevelCap
      ? `<span>Verbessern auf Level ${b.level+1}<small>Erst ab Basis-Level ${b.level+1} möglich</small></span>`
      : `<span>Verbessern auf Level ${b.level+1}<small>Repariert dabei auch komplett</small></span><b>${formatCost(cost)}</b>`;
    upOpt.addEventListener("click", ()=>{
      if(!isDestroyed && !atLevelCap && canAfford(cost)){
        payCost(cost); b.level++; b.hp = maxHpFor(b.type,b.level);
        addPlayerXp(buildingUpgradeXp(b.level));
        save(); document.body.removeChild(overlay); render();
      }
    });
    box.appendChild(upOpt);

    if(b.hp<maxHp){
      const rCost = repairCost(b.type,b);
      const repOpt = document.createElement("div");
      repOpt.className = "buildopt" + (!canAfford(rCost) ? " disabled":"");
      repOpt.innerHTML = `<span>Reparieren<small>Stellt volle HP wieder her</small></span><b>${formatCost(rCost)}</b>`;
      repOpt.addEventListener("click", ()=>{
        if(canAfford(rCost)){ payCost(rCost); b.hp = maxHp; save(); document.body.removeChild(overlay); render(); }
      });
      box.appendChild(repOpt);
    }

    if(b.type==="kaserne"){
      const head = document.createElement("div");
      head.className="hint2"; head.style.marginTop="6px"; head.textContent="Ausbildung:";
      box.appendChild(head);

      if(isDestroyed){
        const info = document.createElement("div");
        info.className="hint2"; info.textContent = "Erst reparieren, bevor hier weiter ausgebildet werden kann.";
        box.appendChild(info);
      } else {
        const anyTraining = !!state.npc.training;
        Object.entries(NPC_TRAIN_DEFS).forEach(([kind,trainDef])=>{
          const count = kind==="reparatur" ? state.npc.reparaturCount : state.npc.angreifer.length;
          const cap = kind==="reparatur" ? REPAIR_NPC_CAP : ANGREIFER_CAP;
          const isTrainingThis = state.npc.training && state.npc.training.kind===kind;

          const rowHead = document.createElement("div");
          rowHead.className="hint2"; rowHead.style.marginTop="6px";
          rowHead.textContent = trainDef.name+" herstellen "+count+"/"+cap
            + (isTrainingThis ? " · noch "+Math.ceil(state.npc.training.timeLeft)+"s" : "");
          box.appendChild(rowHead);

          const slotRow = document.createElement("div");
          slotRow.className="slotRow";
          for(let i=0;i<cap;i++){
            const slotEl = document.createElement("div");
            if(i<count){
              slotEl.className = "slot filled";
              slotEl.textContent = "✓";
            } else {
              const canStart = !anyTraining && canAfford(trainDef.cost);
              slotEl.className = "slot empty" + (canStart ? "" : " disabled");
              slotEl.textContent = "+";
              slotEl.title = trainDef.desc+" ("+formatCost(trainDef.cost)+")";
              if(canStart){
                slotEl.addEventListener("click", ()=>{
                  payCost(trainDef.cost);
                  state.npc.training = { kind, timeLeft: trainDef.baseTime, totalTime: trainDef.baseTime };
                  save(); document.body.removeChild(overlay); render();
                });
              }
            }
            slotRow.appendChild(slotEl);
          }
          box.appendChild(slotRow);
        });

        const costHint = document.createElement("div");
        costHint.className="hint2";
        costHint.textContent = "Kosten pro Slot: Reparatur-Trupp "+formatCost(NPC_TRAIN_DEFS.reparatur.cost)+" · Angreifer "+formatCost(NPC_TRAIN_DEFS.angreifer.cost);
        box.appendChild(costHint);
      }
    }

    if(b.type==="krankenhaus"){
      const verletzt = state.npc.angreifer.filter(a=>a.status==="verletzt").length;
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed
        ? "Erst reparieren - solange ist die Pflege-Kapazität 0."
        : "Pflegeplätze belegt: "+verletzt+"/"+b.level+". Höheres Level heilt schneller und bietet mehr Plätze.";
      box.appendChild(info);
    }

    if(b.type==="lager"){
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = "Aktuelle Lagerkapazität: "+storageCap()+" pro Rohstoff.";
      box.appendChild(info);
    }

    if(b.type==="wachturm"){
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed ? "Erst reparieren, bevor wieder vorgewarnt wird." : "Zeigt die Zusammensetzung der nächsten Welle oben im Spiel an.";
      box.appendChild(info);
    }

    if(b.type==="handelsposten"){
      const rate = tradeRate(b.level);
      const info = document.createElement("div");
      info.className="hint2"; info.style.marginTop="6px";
      info.textContent = isDestroyed ? "Erst reparieren, bevor hier getauscht werden kann." : "Tauschkurs: "+Math.round(rate*100)+"% - kein Ersatz fürs Sammeln, nur eine Notlösung.";
      box.appendChild(info);

      if(!isDestroyed){
        const TRADE_AMOUNT = 20;
        const gain = Math.round(TRADE_AMOUNT*rate);
        const cap = storageCap();

        const toStein = document.createElement("div");
        const canToStein = state.resources.holz>=TRADE_AMOUNT;
        toStein.className = "buildopt"+(canToStein?"":" disabled");
        toStein.innerHTML = `<span>${TRADE_AMOUNT} Holz → ${gain} Stein</span>`;
        toStein.addEventListener("click", ()=>{
          if(state.resources.holz>=TRADE_AMOUNT){
            state.resources.holz -= TRADE_AMOUNT;
            state.resources.stein = Math.min(cap, state.resources.stein+gain);
            save(); document.body.removeChild(overlay); render();
          }
        });
        box.appendChild(toStein);

        const toHolz = document.createElement("div");
        const canToHolz = state.resources.stein>=TRADE_AMOUNT;
        toHolz.className = "buildopt"+(canToHolz?"":" disabled");
        toHolz.innerHTML = `<span>${TRADE_AMOUNT} Stein → ${gain} Holz</span>`;
        toHolz.addEventListener("click", ()=>{
          if(state.resources.stein>=TRADE_AMOUNT){
            state.resources.stein -= TRADE_AMOUNT;
            state.resources.holz = Math.min(cap, state.resources.holz+gain);
            save(); document.body.removeChild(overlay); render();
          }
        });
        box.appendChild(toHolz);
      }
    }

    if(b.type==="turm"){
      const wHead = document.createElement("div");
      wHead.className="hint2"; wHead.style.marginTop="6px"; wHead.textContent="Waffe auswählen:";
      box.appendChild(wHead);
      Object.entries(WEAPONS).forEach(([key2,w])=>{
        // Beides muss stimmen: die Basis muss weit genug sein (Fortschritt
        // insgesamt) UND DIESER Turm muss selbst auf das Level hochgekauft
        // sein (Investition in genau diesen Turm) - sonst bekommt man die
        // Kanone quasi geschenkt, sobald die Basis hoch genug ist.
        const basisOk = state.basisLevel>=w.unlockLevel;
        const turmOk = b.level>=w.unlockLevel;
        const unlocked = basisOk && turmOk && !isDestroyed;
        const selected = b.weapon===key2;
        const wOpt = document.createElement("div");
        wOpt.className = "buildopt"+(!unlocked?" disabled":"");
        wOpt.style.border = selected ? "1px solid #7aa2f7" : "";
        let hint = w.desc;
        if(!unlocked){
          hint = isDestroyed ? "Erst reparieren"
               : !basisOk && !turmOk ? "Braucht Basis-Level "+w.unlockLevel+" und Turm-Level "+w.unlockLevel
               : !basisOk ? "Braucht Basis-Level "+w.unlockLevel
               : "Braucht Turm-Level "+w.unlockLevel;
        }
        wOpt.innerHTML = `<span>${w.name}${selected?" (aktiv)":""}<small>${hint}</small></span>`;
        if(unlocked && !selected) wOpt.addEventListener("click", ()=>{ b.weapon=key2; save(); document.body.removeChild(overlay); render(); });
        box.appendChild(wOpt);
      });
    }

    const moveOpt = document.createElement("div");
    moveOpt.className = "buildopt" + (isDestroyed ? " disabled":""); moveOpt.style.marginTop="6px";
    moveOpt.innerHTML = isDestroyed
      ? `<span>Verschieben<small>Erst reparieren</small></span>`
      : `<span>Verschieben<small>Tippe danach ein freies Feld an</small></span>`;
    moveOpt.addEventListener("click", ()=>{
      if(isDestroyed) return;
      moveSource = {c,r};
      document.body.removeChild(overlay); render();
    });
    box.appendChild(moveOpt);

    const refund = sellRefund(b.type,b.level);
    const sellOpt = document.createElement("div");
    sellOpt.className = "buildopt"; sellOpt.style.marginTop="6px";
    sellOpt.innerHTML = `<span>Verkaufen</span><b>+${formatCost(refund)}</b>`;
    sellOpt.addEventListener("click", ()=>{
      state.resources.holz+=refund.holz; state.resources.stein+=refund.stein;
      slot.building = null;
      save(); document.body.removeChild(overlay); render();
    });
    box.appendChild(sellOpt);
  } else {
    const required = requiredTypeForCell(c,r);
    box.innerHTML = required
      ? `<h3>${BUILDABLE_TYPES[required].name} bauen</h3><div class="hint2">Für die Grundverteidigung brauchst du hier ${required==="turm"?"einen Turm":"eine Mauer"}.</div>`
      : `<h3>Feld bebauen</h3>`;
    Object.entries(BUILDABLE_TYPES).filter(([type])=>{
      if(required) return type===required;
      if(type==="kaserne") return state.basisLevel>=KASERNE_UNLOCK_LEVEL && !hasKaserne();
      if(type==="krankenhaus") return state.basisLevel>=KASERNE_UNLOCK_LEVEL && !hasKrankenhaus();
      if(type==="lager") return state.basisLevel>=LAGER_UNLOCK_LEVEL && !hasLager();
      if(type==="wachturm") return state.basisLevel>=WACHTURM_UNLOCK_LEVEL && !hasWachturm();
      if(type==="handelsposten") return state.basisLevel>=HANDEL_UNLOCK_LEVEL && !hasHandelsposten();
      return true;
    }).forEach(([type,def])=>{
      const opt = document.createElement("div");
      opt.className = "buildopt" + (!canAfford(def.cost) ? " disabled":"");
      opt.innerHTML = `<span>${def.name}<small>${def.desc}</small></span><b>${formatCost(def.cost)}</b>`;
      opt.addEventListener("click", ()=>{
        if(canAfford(def.cost)){
          payCost(def.cost);
          const hp = maxHpFor(type,1);
          slot.building = type==="turm" ? {type,level:1,weapon:"bogen",hp} : {type,level:1,hp};
          checkTutorial();
          save(); document.body.removeChild(overlay); render();
        }
      });
      box.appendChild(opt);
    });
  }

  addCloseBtn(box, overlay);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function addCloseBtn(box, overlay){
  const close = document.createElement("div");
  close.className="buildopt"; close.style.justifyContent="center"; close.textContent="Schließen";
  close.addEventListener("click", ()=> document.body.removeChild(overlay));
  box.appendChild(close);
}

function showIntroIfNeeded(){
  if(state.tutorialIntroShown) return;
  const overlay = document.createElement("div");
  overlay.className = "buildmenu";
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<h3>Willkommen auf deiner Insel</h3>
    <div class="hint2">
      Folge der markierten Stelle mit dem Pfeil und tippe genau dort drauf -
      sie zeigt dir Schritt für Schritt, was als Nächstes zu tun ist.
      Erst wenn deine Grundverteidigung steht, kommt die erste Gegnerwelle.
    </div>`;
  const opt = document.createElement("div");
  opt.className = "buildopt"; opt.style.justifyContent="center";
  opt.textContent = "Los geht's";
  opt.addEventListener("click", ()=>{
    state.tutorialIntroShown = true;
    save();
    document.body.removeChild(overlay);
  });
  box.appendChild(opt);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
buildTextures();
resizeCanvas();
showIntroIfNeeded();

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  updateWave(dt);
  updateRepairJob(dt);
  updateTraining(dt);
  updateHospital(dt);
  updatePlayer(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
